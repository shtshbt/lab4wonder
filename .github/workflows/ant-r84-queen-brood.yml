name: Ant r84 queen brood cycle
on:
  push:
    branches:
      - agent/ant-r84-queen-brood-cycle
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/ant_r84_queen_brood.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('ant-colony.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          scripts=re.findall(r'<script(?![^>]*type=["\']application/json["\'])[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              f=Path(tempfile.gettempdir())/f'ant_r84_{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'r84-ant-queen-brood-cycle' in s
          assert '女王 → 卵 → 幼虫 → 蛹 → 働きアリ' in s
          assert 'const baseStepR84=step' in s and 'const baseDrawR84=draw' in s
          assert "countEl.value=String(current+1)" in s
          assert '種によっては複数の女王' in s
          print('HTML/JS structure validation ok')
          PY
      - name: Build browser interaction test
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('ant-colony.html').read_text(encoding='utf-8')
          test=r'''
          <script>
          setTimeout(()=>{try{
            const before=Number(document.querySelector('#count').value),initial={e:document.querySelector('#r84Eggs')?.textContent,l:document.querySelector('#r84Larvae')?.textContent,p:document.querySelector('#r84Pupae')?.textContent};
            for(let i=0;i<30;i++){step(1);draw()}
            const after=Number(document.querySelector('#count').value),card=document.querySelector('#r84BroodCard');
            document.querySelector('#r83InspectBtn').click();
            const ov=document.querySelector('.r83-ant-overlay'),cv=document.querySelector('#mainCv'),r=cv.getBoundingClientRect(),q=rooms[0];
            ov.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,cancelable:true,pointerId:7,clientX:r.left+q.x/cv.width*r.width,clientY:r.top+q.y/cv.height*r.height}));
            const queenShown=document.querySelector('#r84QueenInfo')?.classList.contains('show');
            const final={e:document.querySelector('#r84Eggs')?.textContent,l:document.querySelector('#r84Larvae')?.textContent,p:document.querySelector('#r84Pupae')?.textContent,w:document.querySelector('#r84Workers')?.textContent,status:document.querySelector('#r84BroodStatus')?.textContent};
            const out=document.createElement('pre');out.id='r84-browser-result';out.textContent=JSON.stringify({marker:document.documentElement.dataset.r84AntQueen,before,after,recruited:after>before,queenShown,initial,final,card:!!card});document.body.appendChild(out);
            card?.scrollIntoView({block:'center'});
          }catch(e){const out=document.createElement('pre');out.id='r84-browser-result';out.textContent=JSON.stringify({error:String(e),stack:e.stack});document.body.appendChild(out)}},900);
          </script>
          '''
          Path('ant-r84-test.html').write_text(s.replace('</body>',test+'</body>'),encoding='utf-8')
          PY
      - name: Browser lifecycle and queen tap test
        run: |
          chromium --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=3200 --dump-dom "file://$PWD/ant-r84-test.html" > /tmp/ant-r84-dom.html
          grep -q '"marker":"queen-brood-worker-cycle"' /tmp/ant-r84-dom.html
          grep -q '"recruited":true' /tmp/ant-r84-dom.html
          grep -q '"queenShown":true' /tmp/ant-r84-dom.html
          grep -q '"card":true' /tmp/ant-r84-dom.html
          chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=2600 --screenshot=/tmp/ant-r84-mobile.png "file://$PWD/ant-r84-test.html"
          rm ant-r84-test.html
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ant-r84-queen-brood-screenshot
          path: /tmp/ant-r84-mobile.png
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ant-colony.html
          git diff --cached --quiet || git commit -m "Add queen and brood lifecycle to ant colony"
          git push
