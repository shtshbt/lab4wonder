name: Apply direct interaction upgrades

on:
  push:
    branches:
      - agent/direct-interaction-upgrades
    paths:
      - .github/workflows/apply-direct-interaction-upgrades.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-interaction-upgrades
          fetch-depth: 0

      - name: Apply interaction patch from previous workflow revision
        shell: bash
        run: |
          git show HEAD^:.github/workflows/apply-direct-interaction-upgrades.yml > /tmp/previous-workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/previous-workflow.yml').read_text(encoding='utf-8')
          token="          python3 - <<'PY'\n"
          start=src.index(token)+len(token)
          end=src.index("\n          PY",start)
          body=src[start:end]
          body='\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          Path('/tmp/apply-interactions.py').write_text(body+'\n',encoding='utf-8')
          PY
          python3 /tmp/apply-interactions.py

      - name: Validate executable inline JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile
          from pathlib import Path
          for name in ['spider-web.html','quicksand-simulator.html']:
              text=Path(name).read_text(encoding='utf-8')
              assert 'r76-' in text
              scripts=re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S|re.I)
              for i,(attrs,src) in enumerate(scripts):
                  m=re.search(r'type=["\']([^"\']+)["\']',attrs,re.I)
                  if m and m.group(1).lower() not in ('text/javascript','application/javascript','module'):
                      continue
                  if not src.strip():
                      continue
                  p=Path(tempfile.gettempdir())/f'{Path(name).stem}-{i}.js'
                  p.write_text(src,encoding='utf-8')
                  subprocess.run(['node','--check',str(p)],check=True)
          print('executable inline JavaScript syntax OK')
          PY

      - name: Validate expected interaction hooks
        shell: bash
        run: |
          grep -q '巣をゆらす' spider-web.html
          grep -q 'damagePenalty' spider-web.html
          grep -q '補強糸で切断点' spider-web.html
          grep -q '上から落とす' quicksand-simulator.html
          grep -q "kind:'stir'" quicksand-simulator.html
          grep -q "kind:'body'" quicksand-simulator.html

      - name: Commit patched apps
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add spider-web.html quicksand-simulator.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add direct interactions to spider web and quicksand labs'
          git push origin HEAD:agent/direct-interaction-upgrades
