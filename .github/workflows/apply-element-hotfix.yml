name: Apply element sandbox hotfix

on:
  push:
    branches:
      - agent/element-sandbox-hotfix
    paths:
      - .github/workflows/apply-element-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply mud cohesion and wood-ball ignition fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('element-sandbox.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<meta name="r70-release" content="stability-accessibility-undo">',
              '<meta name="r70-release" content="stability-accessibility-undo">\n<meta name="r72-release" content="mud-cohesion-wood-ball-ignition">',
              'release marker',
          )

          replace_once(
              'function step(){\n',
              '''function canMudFlowInto(t){return t===EMPTY||t===SMOKE}\nfunction countMudNeighbors(x,y){\n  let n=0;\n  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){\n    if((dx||dy)&&inBounds(x+dx,y+dy)&&grid[idx(x+dx,y+dy)]===MUD)n++;\n  }\n  return n;\n}\nfunction moveMudClump(x,y,dx){\n  const sources=[{x,y}];\n  if(y>0&&grid[idx(x,y-1)]===MUD&&Math.random()<.82)sources.push({x,y:y-1});\n  const side=Math.random()<.5?-1:1;\n  if(inBounds(x+side,y)&&grid[idx(x+side,y)]===MUD&&Math.random()<.62)sources.push({x:x+side,y});\n  const sourceSet=new Set(sources.map(p=>idx(p.x,p.y)));\n  const targets=sources.map(p=>({x:p.x+dx,y:p.y+1}));\n  for(const p of targets){\n    if(!inBounds(p.x,p.y))return false;\n    const ti=idx(p.x,p.y);\n    if(!sourceSet.has(ti)&&!canMudFlowInto(grid[ti]))return false;\n  }\n  const targetSet=new Set(targets.map(p=>idx(p.x,p.y)));\n  for(const p of sources){\n    const si=idx(p.x,p.y);\n    if(!targetSet.has(si))setCell(si,EMPTY);\n    moved[si]=1;\n  }\n  for(const p of targets){const ti=idx(p.x,p.y);setCell(ti,MUD);moved[ti]=1}\n  return true;\n}\nfunction step(){\n''',
              'mud helpers',
          )

          old_mud = '''      }else if(t===MUD){\n        const pressed=y>0&&(grid[idx(x,y-1)]===MUD||grid[idx(x,y-1)]===SAND);\n        if(Math.random()>(pressed?.68:.24))continue;\n        if(y+1<H){\n          const down=idx(x,y+1);\n          if(grid[down]===EMPTY||grid[down]===WATER||grid[down]===SMOKE){swapCells(i,down);continue}\n          const dir=Math.random()<.5?-1:1;\n          for(const dx of [dir,-dir]){\n            if(!inBounds(x+dx,y+1))continue;\n            const diagonal=idx(x+dx,y+1);\n            if((grid[diagonal]===EMPTY||grid[diagonal]===WATER)&&Math.random()<.48){swapCells(i,diagonal);break}\n          }\n          if(pressed&&Math.random()<.16){\n            for(const dx of [dir,-dir]){\n              if(inBounds(x+dx,y)&&grid[idx(x+dx,y)]===EMPTY){swapCells(i,idx(x+dx,y));break}\n            }\n          }\n        }\n'''
          new_mud = '''      }else if(t===MUD){\n        const pressed=y>0&&(grid[idx(x,y-1)]===MUD||grid[idx(x,y-1)]===SAND);\n        const cohesion=countMudNeighbors(x,y);\n        const moveChance=(pressed?.19:.065)/(1+cohesion*.035);\n        if(Math.random()>moveChance)continue;\n        if(y+1<H){\n          const down=idx(x,y+1),downType=grid[down];\n          if(canMudFlowInto(downType)&&moveMudClump(x,y,0))continue;\n          if(downType===WATER&&Math.random()<.28){swapCells(i,down);continue}\n          const dir=Math.random()<.5?-1:1;\n          let movedMud=false;\n          for(const dx of [dir,-dir]){\n            if(!inBounds(x+dx,y+1))continue;\n            const diagonal=idx(x+dx,y+1),dt=grid[diagonal];\n            if(canMudFlowInto(dt)&&Math.random()<.32&&moveMudClump(x,y,dx)){movedMud=true;break}\n            if(dt===WATER&&Math.random()<.14){swapCells(i,diagonal);movedMud=true;break}\n          }\n          if(movedMud)continue;\n          if(pressed&&Math.random()<.035){\n            for(const dx of [dir,-dir]){\n              if(inBounds(x+dx,y)&&grid[idx(x+dx,y)]===EMPTY){swapCells(i,idx(x+dx,y));break}\n            }\n          }\n        }\n'''
          replace_once(old_mud, new_mud, 'mud update branch')

          replace_once(
              '      }else if(t===FIRE){\n        if(life[i]>0)life[i]--;',
              '      }else if(t===FIRE){\n        igniteWoodBallsNear(x+.5,y+.5,1.35);\n        if(life[i]>0)life[i]--;',
              'fire-side ignition',
          )

          replace_once(
              'function spawnBurnEffects(b){\n',
              '''function igniteWoodBall(b){\n  if(b.type!==WOOD_BALL||b.burning||b.dead)return false;\n  b.burning=true;b.burnLife=420+Math.floor(Math.random()*120);\n  return true;\n}\nfunction igniteWoodBallsNear(x,y,r){\n  let ignited=false;\n  for(const b of balls){\n    if(b.type===WOOD_BALL&&Math.hypot(b.x-x,b.y-y)<=b.r+r+1.1)ignited=igniteWoodBall(b)||ignited;\n  }\n  return ignited;\n}\nfunction spawnBurnEffects(b){\n''',
              'wood ignition helpers',
          )

          old_burn = '''  if(wood){\n    if(!b.burning&&touchesCellType(b,FIRE,.8)){b.burning=true;b.burnLife=360+Math.floor(Math.random()*120)}\n    if(b.burning){\n      if(f.water>.16){b.burning=false;b.burnLife=0}\n      else{\n        b.burnLife--;spawnBurnEffects(b);\n        if(b.burnLife<=0)b.dead=true;\n      }\n    }\n  }\n'''
          new_burn = '''  if(wood){\n    if(!b.burning&&touchesCellType(b,FIRE,2.1))igniteWoodBall(b);\n    if(b.burning){\n      if(f.water>.58){b.burning=false;b.burnLife=0}\n      else{\n        b.burnLife--;spawnBurnEffects(b);\n        if(b.burnLife<=0)b.dead=true;\n      }\n    }\n  }\n'''
          replace_once(old_burn, new_burn, 'wood burn state')

          replace_once(
              '''function paintAt(x,y){\n  const cx=Math.floor(x),cy=Math.floor(y),t=current===ERASE?EMPTY:current;\n  if(current===ERASE)removeBallsAt(x,y,brush+1);\n''',
              '''function paintAt(x,y){\n  const cx=Math.floor(x),cy=Math.floor(y),t=current===ERASE?EMPTY:current;\n  if(current===ERASE)removeBallsAt(x,y,brush+1);\n  else if(current===FIRE)igniteWoodBallsNear(x,y,brush+1);\n''',
              'paint-side ignition',
          )

          text = text.replace(
              '砂はさらさら落ち、泥はまとまりながらゆっくり動きます。',
              '砂はさらさら落ち、泥は小さな塊を保ちながらもったり動きます。',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('element-sandbox.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          code = next(s for s in scripts if "'use strict';" in s)
          Path('/tmp/element-sandbox.js').write_text(code, encoding='utf-8')
          required = [
              'function moveMudClump',
              'const moveChance=(pressed?.19:.065)',
              'igniteWoodBallsNear(x+.5,y+.5,1.35)',
              'else if(current===FIRE)igniteWoodBallsNear',
              'if(f.water>.58)',
          ]
          for token in required:
              if token not in code:
                  raise SystemExit(f'missing expected hotfix token: {token}')
          PY
          node --check /tmp/element-sandbox.js
          node <<'JS'
          const fs=require('fs'),vm=require('vm');
          let code=fs.readFileSync('/tmp/element-sandbox.js','utf8');
          code=code.split("const pal=document.getElementById('pal');")[0];
          const noop=()=>{};
          const ctx={save:noop,restore:noop,translate:noop,rotate:noop,beginPath:noop,arc:noop,fill:noop,stroke:noop,moveTo:noop,lineTo:noop,quadraticCurveTo:noop,closePath:noop,drawImage:noop,putImageData:noop,createImageData:(w,h)=>({data:new Uint8ClampedArray(w*h*4)}),imageSmoothingEnabled:false};
          const element={clientWidth:640,classList:{add:noop,remove:noop,toggle:noop},style:{},textContent:'',disabled:false,addEventListener:noop,setPointerCapture:noop,releasePointerCapture:noop,getBoundingClientRect:()=>({left:0,top:0,width:640,height:400}),getContext:()=>ctx};
          const document={getElementById:()=>element,createElement:()=>({...element,getContext:()=>ctx})};
          const sandbox={console,Math,Uint8Array,Uint8ClampedArray,Set,document,window:{innerHeight:800},requestAnimationFrame:noop};
          vm.createContext(sandbox);
          const tests=`\n;(()=>{\n            W=40;H=40;SCALE=4;grid=new Uint8Array(W*H);life=new Uint8Array(W*H);shade=new Uint8Array(W*H);moved=new Uint8Array(W*H);balls=[];\n            const wood={type:WOOD_BALL,x:20,y:20,vx:0,vy:0,r:4,angle:0,burning:false,burnLife:0,dead:false};\n            balls=[wood];setCell(idx(20,20),FIRE);updateBall(wood);if(!wood.burning)throw new Error('wood ball did not ignite from nearby fire');\n            wood.burning=false;wood.burnLife=0;current=FIRE;brush=3;paintAt(20,20);if(!wood.burning)throw new Error('painting fire did not ignite wood ball');\n            grid.fill(EMPTY);moved.fill(0);setCell(idx(20,20),MUD);setCell(idx(20,19),MUD);setCell(idx(19,20),MUD);const oldRandom=Math.random;Math.random=()=>0;if(!moveMudClump(20,20,0))throw new Error('mud clump did not move');Math.random=oldRandom;if(grid[idx(20,21)]!==MUD||grid[idx(20,20)]!==MUD)throw new Error('mud clump did not retain cohesion');\n            console.log('targeted behavior checks passed');\n          })();`;
          vm.runInContext(code+tests,sandbox,{timeout:5000});
          JS

      - name: Commit and push hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add element-sandbox.html
          git commit -m "fix: improve mud cohesion and wood ball ignition"
          git push origin HEAD
