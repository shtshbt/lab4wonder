name: Apply pillbug environment lab v2

on:
  push:
    branches:
      - agent/pillbug-environment-lab
    paths:
      - .github/workflows/apply-pillbug-environment-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pillbug-environment-lab
          fetch-depth: 0
      - name: Replace pillbug maze
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > pillbug-maze.html
      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          source = Path('pillbug-maze.html').read_text()
          HTMLParser().feed(source)
          required = ['ダンゴムシ・環境選択迷路ラボ','data-tool="moisture"','data-tool="light"','data-tool="temperature"','通行ヒートマップ','function comfortAt','隠れ場所そのものの座標は評価していません。']
          for token in required:
              assert token in source, token
          assert 'goalAngle' not in source
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', source, re.S)
          Path('/tmp/pillbug-inline.js').write_text('\n'.join(scripts))
          print({'bytes': len(source.encode()), 'inline_scripts': len(scripts)})
          PY
          node --check /tmp/pillbug-inline.js
      - name: Commit generated app
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pillbug-maze.html
          if ! git diff --cached --quiet; then
            git commit -m "Upgrade pillbug maze with microclimate fields"
            git push origin HEAD:agent/pillbug-environment-lab
          fi
