name: Apply quicksand r79
on:
  push:
    branches: [agent/quicksand-r79-interaction]
    paths: [.github/workflows/apply-quicksand-r79.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quicksand-r79-interaction
          fetch-depth: 0
      - name: Patch quicksand interaction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quicksand-simulator.html')
          s=p.read_text(encoding='utf-8')
          assert 'r77-quicksand-visible-feedback' in s
          anchor='<button id="scenarioBtn">課題 S1</button></section>'
          repl='<label id="qsObjectWrap" style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800">物体<select id="qsObjectSel" aria-label="沈める物体"><option value="person">人</option><option value="wood">木箱</option><option value="rock">石</option><option value="iron">鉄球</option><option value="boot">長靴</option></select></label><button id="scenarioBtn">課題 S1</button></section>'
          assert anchor in s
          s=s.replace(anchor,repl,1)
          old="state.ripples.forEach(r=>{const rad=14+r.age*150,a=clamp(1-r.age/1.6,0,1);x.save();x.globalAlpha=a*.8;x.strokeStyle=r.color;x.lineWidth=3;x.beginPath();x.ellipse(cx,SURF,rad,rad*.22,0,0,Math.PI*2);x.stroke();x.restore()});"
          new="state.ripples.forEach(r=>{const rad=14+r.age*150,a=clamp(1-r.age/1.6,0,1),rx=Number.isFinite(r.x)?r.x:cx,ry=Number.isFinite(r.y)?r.y:SURF;x.save();x.globalAlpha=a*.8;x.strokeStyle=r.color;x.lineWidth=3;x.beginPath();x.ellipse(rx,ry,rad,rad*.22,0,0,Math.PI*2);x.stroke();x.restore()});"
          assert old in s
          s=s.replace(old,new,1)
          layer=r'''
<script id="r79-quicksand-objects-and-deformation">
(()=>{
  if(window.__r79QuicksandObjectsAndDeformation)return;window.__r79QuicksandObjectsAndDeformation=true;
  const cv=document.getElementById('mainCv'),g=cv.getContext('2d'),Q=APP.qs,sel=document.getElementById('qsObjectSel');
  const presets={person:{label:'人',rho:1050,V:.12,area:.25,abs:.20,kind:'person'},wood:{label:'木箱',rho:620,V:.16,area:.42,abs:.12,kind:'box'},rock:{label:'石',rho:2400,V:.065,area:.12,abs:0,kind:'rock'},iron:{label:'鉄球',rho:3000,V:.045,area:.08,abs:0,kind:'ball'},boot:{label:'長靴',rho:980,V:.055,area:.16,abs:.08,kind:'boot'}};
  let obj='person',deform=[],dragPath=[],mode=null,last=null,lastAt=0;
  const setControl=(id,v)=>{const el=document.getElementById(id);el.value=String(v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}))};
  function applyPreset(name){const p=presets[name]||presets.person;obj=name;setControl('c1',p.rho);setControl('c2',p.V);setControl('c3',p.area);setControl('c4',p.abs);state.depth=0;state.vel=0;state.structure=1;state.eqDepth=null;state.eqTime=null;state.still=0;state.action='watch';state.note=`${p.label}に変更。上から落とすか、直接つかんで沈めてみよう`;state.noteT=2.2;drawAll()}
  sel.addEventListener('change',()=>applyPreset(sel.value));
  const baseDrawFigure=drawQsFigure;
  drawQsFigure=function(x,feetY){if(obj==='person')return baseDrawFigure(x,feetY);const p=presets[obj],cx=Q.cx,BH=Q.bodyH*Q.px,top=feetY-BH*.76,mid=(top+feetY)/2;x.save();x.lineJoin='round';x.lineCap='round';x.fillStyle='rgba(60,44,26,.48)';x.beginPath();x.ellipse(cx,feetY,54,10,0,0,Math.PI*2);x.fill();if(p.kind==='box'){x.fillStyle='#ad7a42';x.strokeStyle='#5e3e22';x.lineWidth=4;x.fillRect(cx-48,mid-33,96,66);x.strokeRect(cx-48,mid-33,96,66);x.strokeStyle='#d2a568';x.beginPath();x.moveTo(cx-42,mid-25);x.lineTo(cx+42,mid+25);x.moveTo(cx+42,mid-25);x.lineTo(cx-42,mid+25);x.stroke()}else if(p.kind==='rock'){x.fillStyle='#7b8790';x.strokeStyle='#39434a';x.lineWidth=4;x.beginPath();x.moveTo(cx-46,mid+28);x.lineTo(cx-58,mid-3);x.lineTo(cx-28,mid-42);x.lineTo(cx+32,mid-37);x.lineTo(cx+58,mid+2);x.lineTo(cx+39,mid+34);x.closePath();x.fill();x.stroke()}else if(p.kind==='ball'){x.fillStyle='#6e7882';x.strokeStyle='#c1c9cf';x.lineWidth=4;x.beginPath();x.arc(cx,mid,42,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='rgba(255,255,255,.22)';x.beginPath();x.arc(cx-14,mid-14,11,0,Math.PI*2);x.fill()}else{x.fillStyle='#3f6d83';x.strokeStyle='#173849';x.lineWidth=4;x.beginPath();x.moveTo(cx-36,mid-44);x.lineTo(cx+12,mid-44);x.lineTo(cx+18,mid+9);x.quadraticCurveTo(cx+48,mid+18,cx+44,mid+42);x.lineTo(cx-42,mid+42);x.closePath();x.fill();x.stroke()}x.fillStyle='rgba(7,17,28,.78)';x.fillRect(cx-64,top-31,128,24);x.fillStyle='#f4e5bf';x.font='bold 13px system-ui';x.textAlign='center';x.fillText(p.label,cx,top-14);x.restore();return{head:top,shoulder:top+BH*.15,hip:mid,knee:feetY-BH*.18}};
  const point=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
  const bodyHit=p=>{const feet=Q.surf+state.depth*Q.px,top=feet-Q.bodyH*Q.px*.9,w=obj==='person'?92:82;return Math.abs(p.x-Q.cx)<w&&p.y>top-34&&p.y<feet+34};
  const wake=()=>{if(!running){running=true;document.getElementById('playPause').textContent='⏸ 一時停止';last=performance.now()}};
  const note=t=>{state.note=t;state.noteT=1.9};
  const disturb=(p,intensity=1)=>{const loss=(.075+.11*num('c8'))*Math.max(.35,intensity),before=state.structure;state.structure=Math.max(Q.structMin,state.structure-loss);state.agit=Math.min(1,state.agit+.42*Math.max(.35,intensity));state.settle=0;state.eqDepth=null;state.eqTime=null;state.still=0;deform.push({x:p.x,y:p.y,t:performance.now(),power:Math.max(.3,intensity),loss:before-state.structure});if(deform.length>34)deform.splice(0,deform.length-34);state.ripples.push({age:0,color:'#ffc072',x:p.x,y:p.y})};
  cv.addEventListener('pointerdown',e=>{const p=point(e);last=p;lastAt=performance.now();if(bodyHit(p)){e.preventDefault();e.stopImmediatePropagation();const feet=Q.surf+state.depth*Q.px;mode={kind:'body',grip:p.y-feet,startY:p.y,resistance:0};running=false;document.getElementById('playPause').textContent='▶ 再生';cv.setPointerCapture?.(e.pointerId);note(`${presets[obj].label}をつかんだ。上下に動かそう`);drawAll();return}if(p.y>Q.surf){e.preventDefault();e.stopImmediatePropagation();mode={kind:'stir'};cv.setPointerCapture?.(e.pointerId);disturb(p,1.25);dragPath=[p];note('泥面が崩れた。なぞるほど溝と渦が大きくなる');drawAll()}},true);
  cv.addEventListener('pointermove',e=>{if(!mode)return;const p=point(e),now=performance.now(),dt=Math.max(.016,(now-lastAt)/1000),dist=last?Math.hypot(p.x-last.x,p.y-last.y):0;e.preventDefault();e.stopImmediatePropagation();if(mode.kind==='body'){compute();const d=state.d,target=Math.max(0,Math.min(Q.maxDepth,(p.y-mode.grip-Q.surf)/Q.px)),res=Math.max(0,Math.min(3,(d.yieldF+d.visc)/Math.max(1,d.weight))),old=state.depth,gain=.72/(1+.45*res);state.depth+=(target-state.depth)*gain;state.vel=Math.max(-Q.vMax,Math.min(Q.vMax,(state.depth-old)/dt));state.structure=Math.max(Q.structMin,state.structure-Math.abs(state.depth-old)*(.05+.12*num('c8')));state.eqDepth=null;state.eqTime=null;state.still=0;mode.resistance=res}else if(dist>2){const inten=Math.min(1.8,.45+dist/34);disturb(p,inten);dragPath.push(p);if(dragPath.length>28)dragPath.shift()}last=p;lastAt=now;drawAll()},true);
  const release=e=>{if(!mode)return;e.preventDefault();e.stopImmediatePropagation();const k=mode.kind;mode=null;last=null;dragPath=[];state.action='watch';note(k==='body'?'手を離した。ここから泥の物理で動く':'攪乱終了。静置すると泥の構造が回復する');wake();drawAll()};cv.addEventListener('pointerup',release,true);cv.addEventListener('pointercancel',release,true);
  const baseDrawAll=drawAll;drawAll=()=>{baseDrawAll();const now=performance.now();deform=deform.filter(d=>now-d.t<2600);g.save();for(const d of deform){const age=(now-d.t)/2600,a=Math.max(0,1-age),r=28+d.power*34+age*32;g.globalAlpha=.25+.6*a;const grad=g.createRadialGradient(d.x,d.y,3,d.x,d.y,r);grad.addColorStop(0,'rgba(47,34,24,.92)');grad.addColorStop(.48,'rgba(151,98,49,.72)');grad.addColorStop(1,'rgba(255,196,111,0)');g.fillStyle=grad;g.beginPath();g.ellipse(d.x,d.y,r,r*.42,age*1.2,0,0,Math.PI*2);g.fill();g.strokeStyle=`rgba(255,217,145,${.25+.55*a})`;g.lineWidth=2.5;for(let k=0;k<3;k++){const rr=r*(.38+k*.22);g.beginPath();g.ellipse(d.x,d.y,rr,rr*.34,age*2+k*.5,0,Math.PI*2);g.stroke()}if(age<.32){g.fillStyle='rgba(7,17,28,.88)';g.fillRect(d.x+16,d.y-30,126,26);g.fillStyle='#ffd08b';g.font='bold 12px system-ui';g.fillText(`構造 −${Math.max(1,Math.round(d.loss*100))}%`,d.x+24,d.y-12)}}if(dragPath.length>1){g.globalAlpha=.8;g.strokeStyle='#ffcb83';g.lineWidth=12;g.lineCap='round';g.lineJoin='round';g.beginPath();dragPath.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.stroke();g.globalAlpha=.55;g.strokeStyle='#5a3c27';g.lineWidth=5;g.stroke()}if(mode?.kind==='body'&&last){const x=Q.cx+110,col=last.y<mode.startY?'#69e0b0':'#ffd85a';g.globalAlpha=1;g.strokeStyle=col;g.fillStyle=col;g.lineWidth=4;g.beginPath();g.moveTo(x,mode.startY);g.lineTo(x,last.y);g.stroke();g.fillStyle='rgba(7,17,28,.9)';g.fillRect(x+14,Math.min(mode.startY,last.y)-4,166,43);g.fillStyle=col;g.font='bold 12px system-ui';g.fillText(last.y<mode.startY?'↑ 引き抜く':'↓ 押し込む',x+24,Math.min(mode.startY,last.y)+13);g.fillStyle='#dceafa';g.font='11px system-ui';g.fillText(`泥の抵抗 ${Math.round((mode.resistance||0)*100)}%`,x+24,Math.min(mode.startY,last.y)+31)}g.restore()};
  const guide=document.querySelector('#qsDirectGuide');if(guide)guide.innerHTML='<b>👆 直接遊ぶ：</b> 物体を選び、<b>上から落とす／つかんで上下に動かす</b>。泥をタップするとその場が崩れ、なぞると明るい溝と渦が残ります。木箱・石・鉄球・長靴で沈み方を比べよう。';
  const marker=document.createElement('meta');marker.name='r79-quicksand-objects-deformation';marker.content='object-presets-strong-spatial-stir-feedback';document.head.appendChild(marker);applyPreset('person');
})();
</script>
'''
          assert '</body>' in s
          s=s.replace('</body>',layer+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          text=Path('quicksand-simulator.html').read_text(encoding='utf-8')
          for i,(attrs,src) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S)):
              if 'application/json' in attrs or not src.strip(): continue
              f=Path(tempfile.gettempdir())/f'q79-{i}.js';f.write_text(src,encoding='utf-8');subprocess.run(['node','--check',str(f)],check=True)
          for token in ['qsObjectSel','木箱','鉄球','r79-quicksand-objects-deformation','Number.isFinite(r.x)','deform.push','dragPath']:
              assert token in text,token
          print('r79 validation OK')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quicksand-simulator.html
          git commit -m 'Add quicksand objects and strong spatial deformation'
          git push origin HEAD:agent/quicksand-r79-interaction
