name: Apply quicksand visible feedback
on:
  push:
    branches: [agent/quicksand-visible-feedback]
    paths: [.github/workflows/apply-quicksand-visible-feedback.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quicksand-visible-feedback
      - name: Patch app
        run: |
          python3 - <<'PY'
          import base64,gzip
          data=''
          exec(gzip.decompress(base64.b64decode(data)).decode())
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          text=Path('quicksand-simulator.html').read_text(encoding='utf-8')
          for i,(attrs,src) in enumerate(re.findall(r'<script([^>]*)>(.*?)</script>',text,re.S)):
              if 'application/json' in attrs or not src.strip(): continue
              f=Path(tempfile.gettempdir())/f'q-{i}.js';f.write_text(src,encoding='utf-8');subprocess.run(['node','--check',str(f)],check=True)
          assert 'r77-quicksand-visible-feedback' in text
          print('quicksand visible feedback OK')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quicksand-simulator.html
          git commit -m 'Make quicksand touch feedback visible'
          git push origin HEAD:agent/quicksand-visible-feedback
