name: Create v1.10.1 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v1.10.1-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated release tag
        env:
          TARGET_SHA: 70d76ca4c4b73742cc2aa58b4d68df0269b39f84
          TAG_NAME: v1.10.1
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "${TAG_NAME} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "v1.10.1: mud cohesion and wood-ball ignition hotfix"
          git push origin "refs/tags/${TAG_NAME}"
