name: Create v1.10.3 tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-v1.10.3-tag.yml

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated release tag
        env:
          TARGET_SHA: db70caef8ae434d6ba827259a5714b15bb747dd3
          TAG_NAME: v1.10.3
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "${TAG_NAME} already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m "v1.10.3: complete mud sedimentation in water"
          git push origin "refs/tags/${TAG_NAME}"
