name: Fossil atlas all 48
on:
  push:
    branches:
      - agent/fossil-atlas-all48
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fossil_atlas_all48.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          scripts=re.findall(r'<script(?![^>]*type=["\']application/json["\'])[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              f=Path(tempfile.gettempdir())/f'fossil_r86_{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          for hook in ['all-48-reachable-via-excavation','atlasSitePools','48種すべて本編から収集可能','主化石＋同じ地層','unlockAtlasFromExcavation']:
              assert hook in s, hook
          print('structure/js validation ok')
          PY
      - name: Validate 48-card route coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          m=re.search(r'const DATA=(\[.*?\]),CFG=',s,re.S)
          assert m
          data=json.loads(m.group(1))
          assert len(data)==48, len(data)
          names={x['name'] for x in data}
          p=re.search(r'const atlasSitePools=\{\s*lagoon:(\[.*?\]),\s*river:(\[.*?\]),\s*marine:(\[.*?\])\s*\};',s,re.S)
          assert p
          pools=[json.loads(p.group(i)) for i in (1,2,3)]
          reachable=set().union(*map(set,pools))
          assert names == reachable, (sorted(names-reachable),sorted(reachable-names))
          assert len(reachable)==48
          print('all 48 cards have an excavation route')
          PY
      - name: Browser smoke test
        run: |
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "file://$PWD/fossil-formation.html" > /tmp/dom.html
          grep -q '48種すべて本編から収集可能' /tmp/dom.html
          grep -q '化石図鑑 0/48' /tmp/dom.html
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fossil-formation.html
          git diff --cached --quiet || git commit -m "Make all 48 fossil atlas cards reachable"
          git push
