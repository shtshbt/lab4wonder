name: Fossil clarity pass

on:
  push:
    branches:
      - agent/fossil-clarity-pass

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clarity patch
        run: python .github/patch_fossil_clarity.py
      - name: Validate HTML and JavaScript
        run: |
          node scripts/check_inline_js.js .
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          required=['r82-fossil-clarity-style','r82-ledger','r82Fossil','地中を透視','標本の行方','SURFACE_Y=190']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('missing hooks: '+', '.join(missing))
          print('fossil clarity hooks OK')
          PY
      - name: Browser smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME" ]; then
            "$CHROME" --headless --disable-gpu --no-sandbox --allow-file-access-from-files --virtual-time-budget=2500 --dump-dom "file://$PWD/fossil-formation.html" > /tmp/fossil.html
            grep -q 'r82-ledger' /tmp/fossil.html
            grep -q '地中を透視：ON' /tmp/fossil.html
            grep -q '② 化石になった' /tmp/fossil.html
          fi
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fossil-formation.html
          git rm .github/patch_fossil_clarity.py .github/workflows/fossil-clarity-pass.yml
          git commit -m "Clarify fossil burial and formation outcomes"
          git push
