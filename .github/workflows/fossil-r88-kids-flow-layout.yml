name: Fossil r88 kids flow layout
on:
  push:
    branches:
      - agent/fossil-r88-kids-flow-layout
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fossil_r88_kids_flow_layout.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          scripts=re.findall(r'<script(?![^>]*type=["\']application/json["\'])[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              f=Path(tempfile.gettempdir())/f'fossil_r88_{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          assert 'kid-readable-strong-flow-clean-layout' in s
          assert "{name:'④ のこる？'" in s
          assert '⏩ 時間をすすめる' in s
          assert 'd>210' in s and "maxShift=s.type==='leaf'?260" in s
          assert '.stage-help,.r81-direct #geoLabel' in s
          assert "const tag=s.preserved?'★':s.status==='lost'?'×':over>8?'↓':'○'" in s
          assert 'r88-viewbadge' in s
          print('structure/js validation ok')
          PY
      - name: Build interaction test pages
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          flow=r'''
          <script>
          setTimeout(()=>{try{
            const overlay=document.querySelector('#r81-overlay');
            document.querySelector('#r81-phasebar button[data-phase="1"]').click();
            document.querySelector('.stage').scrollIntoView({block:'center'});
            overlay.setPointerCapture=()=>{};
            const r=overlay.getBoundingClientRect();
            const fire=(type,x,y)=>overlay.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:1,clientX:r.left+x/960*r.width,clientY:r.top+y/620*r.height}));
            fire('pointerdown',100,260);fire('pointermove',820,260);fire('pointerup',820,260);
            setTimeout(()=>{
              const status=document.querySelector('#r81Status')?.textContent||'';
              const hidden=[...document.querySelectorAll('.stage-help,#geoLabel,.r82-viewmode,.r84-section-label')].every(x=>getComputedStyle(x).display==='none');
              const parent=document.querySelector('#r81Status')?.parentElement?.classList.contains('r81-panel')||false;
              const out=document.createElement('pre');out.id='r88-browser-result';out.textContent=JSON.stringify({moved:/動いた/.test(status),status,hidden,parent,marker:document.documentElement.dataset.r88Fossil});document.body.appendChild(out);
            },180);
          }catch(e){const out=document.createElement('pre');out.id='r88-browser-result';out.textContent=JSON.stringify({error:String(e)});document.body.appendChild(out)}},700);
          </script>
          '''
          fate=r'''
          <script>
          setTimeout(()=>{try{
            document.querySelector('#r81-phasebar button[data-phase="3"]').click();
            document.querySelector('#r83Advance').click();document.querySelector('#r83Advance').click();
            document.querySelector('.r83-time').scrollIntoView({block:'center'});
            setTimeout(()=>{
              const btn=document.querySelector('#r83Advance')?.textContent||'';
              const gate=document.querySelector('#r84Gate')?.textContent||'';
              const fates=[...document.querySelectorAll('.r84-fate .mini')].map(x=>x.textContent);
              const out=document.createElement('pre');out.id='r88-browser-result';out.textContent=JSON.stringify({clear:btn==='⏩ 時間をすすめる'&&fates.some(x=>/[○×△★]/.test(x)),btn,gate,fates});document.body.appendChild(out);
            },180);
          }catch(e){const out=document.createElement('pre');out.id='r88-browser-result';out.textContent=JSON.stringify({error:String(e)});document.body.appendChild(out)}},700);
          </script>
          '''
          Path('fossil-r88-flow-test.html').write_text(s.replace('</body>',flow+'</body>'),encoding='utf-8')
          Path('fossil-r88-fate-test.html').write_text(s.replace('</body>',fate+'</body>'),encoding='utf-8')
          PY
      - name: Browser interaction and mobile screenshots
        run: |
          chromium --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=2200 --dump-dom "file://$PWD/fossil-r88-flow-test.html" > /tmp/flow-dom.html
          grep -q '"moved":true' /tmp/flow-dom.html
          grep -q '"hidden":true' /tmp/flow-dom.html
          grep -q '"parent":true' /tmp/flow-dom.html
          grep -q '"marker":"kid-readable-strong-flow-clean-layout"' /tmp/flow-dom.html
          chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=1700 --screenshot=/tmp/fossil-r88-flow-mobile.png "file://$PWD/fossil-r88-flow-test.html"
          chromium --headless --no-sandbox --disable-gpu --window-size=390,900 --virtual-time-budget=2200 --dump-dom "file://$PWD/fossil-r88-fate-test.html" > /tmp/fate-dom.html
          grep -q '"clear":true' /tmp/fate-dom.html
          chromium --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,900 --virtual-time-budget=1700 --screenshot=/tmp/fossil-r88-fate-mobile.png "file://$PWD/fossil-r88-fate-test.html"
          rm fossil-r88-flow-test.html fossil-r88-fate-test.html
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fossil-r88-screenshots
          path: |
            /tmp/fossil-r88-flow-mobile.png
            /tmp/fossil-r88-fate-mobile.png
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fossil-formation.html
          git diff --cached --quiet || git commit -m "Clarify fossil flow and fate for young children"
          git push
