name: Fossil rarity weighting
on:
  push:
    branches:
      - agent/fossil-rarity-weighting
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fossil_rarity_weighting.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          scripts=re.findall(r'<script(?![^>]*type=["\']application/json["\'])[^>]*>(.*?)</script>',s,re.S|re.I)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              f=Path(tempfile.gettempdir())/f'fossil_r87_{i}.js'
              f.write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
          for hook in ['star-rarity-weighted-duplicates','atlasRarityWeight={1:16,2:8,3:4,4:2,5:1}','共伴発見は重複あり','↻ 主化石は再発見']:
              assert hook in s, hook
          assert "const available=[...new Set(pool)].filter(n=>!atlas.has(n))" not in s
          print('structure/js validation ok')
          PY
      - name: Validate rarity odds and 48-card reachability
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          assert 'atlasRarityWeight={1:16,2:8,3:4,4:2,5:1}' in s
          m=re.search(r'const DATA=(\[.*?\]),CFG=',s,re.S); assert m
          data=json.loads(m.group(1)); assert len(data)==48
          names={x['name'] for x in data}
          p=re.search(r'const atlasSitePools=\{\s*lagoon:(\[.*?\]),\s*river:(\[.*?\]),\s*marine:(\[.*?\])\s*\};',s,re.S); assert p
          pools=[json.loads(p.group(i)) for i in (1,2,3)]
          assert names == set().union(*map(set,pools))
          assert all(1 <= x['rarity'] <= 5 for x in data)
          print('rarity weights and all-48 reachability ok')
          PY
      - name: Browser smoke test
        run: |
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "file://$PWD/fossil-formation.html" > /tmp/dom.html
          grep -q '共伴発見は重複あり' /tmp/dom.html
          grep -q '化石図鑑 0/48' /tmp/dom.html
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fossil-formation.html
          git diff --cached --quiet || git commit -m "Weight fossil atlas finds by star rarity"
          git push
