name: Fossil scene redesign
on:
  push:
    branches:
      - agent/fossil-scene-redesign
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply redesign
        run: |
          python .github/scripts/prepare_fossil_scene.py
          python .github/scripts/fossil_scene_pass.py
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          HTMLParser().feed(s)
          for i,js in enumerate(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)):
              if js.strip():
                  f=Path(tempfile.gettempdir())/f'fossil_{i}.js'; f.write_text(js,encoding='utf-8'); subprocess.run(['node','--check',str(f)],check=True)
          for hook in ['r83-fossil-scene-style','r83Advance','drawPlanView','r83FoundGrid','plan-section-time-identity']:
              assert hook in s, hook
          print('validation ok')
          PY
      - name: Browser smoke test
        run: |
          chromium --headless --no-sandbox --disable-gpu --virtual-time-budget=2500 --dump-dom "file://$PWD/fossil-formation.html" > /tmp/dom.html
          grep -q 'r83Advance' /tmp/dom.html
          grep -q 'r83FoundGrid' /tmp/dom.html
          grep -q '水底を上から見る' /tmp/dom.html
      - name: Commit application
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fossil-formation.html
          git diff --cached --quiet || git commit -m "Redesign fossil scene flow for clarity"
          git push
