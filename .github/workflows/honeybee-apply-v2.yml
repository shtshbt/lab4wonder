name: Honeybee balance apply v2

on:
  push:
    branches:
      - agent/honeybee-swarm-crisis-balance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-swarm-crisis-balance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply corrected patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/honeybee-swarm-crisis-balance.yml').read_text()
          start="          cat > /tmp/patch.py <<'PY'\n"
          end="          PY\n          python /tmp/patch.py"
          block=textwrap.dedent(src.split(start,1)[1].split(end,1)[0])
          old='rep("threat.ballDamage=0;if(manual)", "threat.ballDamage=0;threat.scoutChecked=false;threat.scoutChance=0;if(manual)")'
          new='rep("threat.ballDamage=0;bigNotice(\'👹 スズメバチ偵察！\'", "threat.ballDamage=0;threat.scoutChecked=false;threat.scoutChance=0;bigNotice(\'👹 スズメバチ偵察！\'")'
          if old not in block: raise SystemExit('bad-anchor line missing')
          block=block.replace(old,new,1)
          marker='p.write_text(s)'
          extra="rep(\"function step(h){if(h<=0||!colonyAlive)return;\", \"function step(h){if(h<=0||!colonyAlive||swarmPending)return;\")\nrep(\".toast{position:absolute;\", \".toast.show{opacity:1;transform:translate(-50%,0)}.toast{position:absolute;\")\n"
          block=block.replace(marker,extra+marker,1)
          Path('/tmp/patch.py').write_text(block)
          PY
          python /tmp/patch.py
      - name: Validate and dynamically exercise
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text(); P().feed(s)
          for token in ['swarmModal','followSwarm','stayOld','bigAlert','swarmPending','scoutChance','冬は休止','queenMode','.toast.show']:
              assert token in s, token
          a=s.index('<script>')+8; b=s.index('</script>',a); Path('/tmp/bee.js').write_text(s[a:b])
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > bee-balance-test.mjs <<'JS'
          import fs from 'fs'; import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          function make(){return new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});w.requestAnimationFrame=()=>0;}})}
          let dom=make(),lab=dom.window.__beeLab; lab.setPressure(0); lab.stepHours(24*40); let s=lab.snapshot();
          console.log('NO_ACTION',JSON.stringify(s));
          if(s.workers>215)throw new Error('no-action colony still explodes'); if(s.workers<20)throw new Error('baseline too harsh');
          dom=make();lab=dom.window.__beeLab;lab.triggerSwarm(); if(!lab.snapshot().swarmPending)throw new Error('swarm missing'); if(!dom.window.document.getElementById('swarmModal').classList.contains('show'))throw new Error('modal hidden'); let before=lab.snapshot();lab.chooseSwarm('old');s=lab.snapshot(); if(s.swarmPending||s.queenMode!=='virgin'||s.workers>=before.workers)throw new Error('old hive choice failed');
          dom=make();lab=dom.window.__beeLab;lab.forceSeason(3);lab.triggerScout();s=lab.snapshot(); if(s.threat!=='calm'||!dom.window.document.getElementById('scout').disabled)throw new Error('winter hornet allowed');
          dom=make();lab=dom.window.__beeLab;lab.setPressure(100);dom.window.Math.random=()=>.99;lab.triggerScout(); if(!dom.window.document.getElementById('bigAlert').classList.contains('show'))throw new Error('alert missing'); for(let i=0;i<45;i++)lab.stepHours(1);s=lab.snapshot(); if(!['marked','raid','collapsed','recovered'].includes(s.threat))throw new Error('failed scout did not escalate '+JSON.stringify(s)); for(let i=0;i<80&&lab.snapshot().colonyAlive;i++)lab.stepHours(1);s=lab.snapshot(); console.log('FAILED_SCOUT',JSON.stringify(s)); if(s.colonyAlive&&s.defenseLosses<15)throw new Error('raid too gentle');
          console.log('PASS');
          JS
          node bee-balance-test.mjs
          rm -f bee-balance-test.mjs
          rm -rf node_modules package-lock.json package.json
      - name: Commit HTML
        shell: bash
        run: |
          git config user.name 'sshibata'
          git config user.email '107645802+shtshbt@users.noreply.github.com'
          git add honeybee-colony.html
          git commit -m 'Add swarm choice and rebalance colony crises'
          git push origin HEAD:agent/honeybee-swarm-crisis-balance
