name: Honeybee heat-ball cost

on:
  push:
    branches:
      - agent/honeybee-ball-cost

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-ball-cost
      - name: Patch heat-ball cost
        shell: python
        run: |
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          s=s.replace("let threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0};","let threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0,ballLosses:0,ballEnergy:0};",1)
          s=s.replace("threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0};","threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0,ballLosses:0,ballEnergy:0};",1)
          old="function triggerScout(manual=false){if(!['calm','recovered'].includes(threat.mode)){toast('👹 すでに警戒中');return}threat.mode='scout';threat.timer=0;threat.hornets=[{x:955,y:120}];threat.ballTemp=0;if(manual)toast('👹 スズメバチの偵察！',true)}"
          new="function triggerScout(manual=false){if(!['calm','recovered'].includes(threat.mode)){toast('👹 すでに警戒中');return}threat.mode='scout';threat.timer=0;threat.hornets=[{x:955,y:120}];threat.ballTemp=0;threat.losses=0;threat.ballLosses=0;threat.ballEnergy=0;if(manual)toast('👹 スズメバチの偵察！',true)}"
          assert old in s
          s=s.replace(old,new,1)
          old="if(workers>75&&defense>.13){threat.mode='ball';threat.timer=0;threat.ballTemp=36;toast('🔥 蜂球！ みんなで包んだ',true)}"
          new="if(workers>75&&defense>.13){threat.mode='ball';threat.timer=0;threat.ballTemp=36;threat.ballLosses=0;threat.ballEnergy=0;toast('🔥 蜂球！ みんなで包んだ',true)}"
          assert old in s
          s=s.replace(old,new,1)
          old="}else if(threat.mode==='ball'){threat.timer+=h;threat.ballTemp=clamp(36+threat.timer*.42,36,46.2);if(threat.ballTemp>=45.7){threat.mode='recovered';threat.timer=0;threat.hornets=[];toast('🔥 防衛成功！',true)}}else if(threat.mode==='recovered')"
          new="}else if(threat.mode==='ball'){threat.timer+=h;threat.ballTemp=clamp(36+threat.timer*.42,36,46.2);const participants=Math.min(workers,Math.max(36,rr.guard*1.35)),heatStress=clamp((threat.ballTemp-40)/6.2,0,1);threat.ballEnergy+=h*participants*(.0015+.0015*heatStress);const targetLoss=Math.min(Math.max(1,Math.floor(workers*.055)),Math.floor(threat.ballEnergy));if(targetLoss>threat.ballLosses){const delta=Math.min(targetLoss-threat.ballLosses,Math.max(0,workers-28));workers-=delta;threat.ballLosses+=delta;threat.losses+=delta}honey=Math.max(0,honey-h*participants*.00045);if(threat.ballTemp>=45.7){threat.mode='recovered';threat.timer=0;threat.hornets=[];toast(`🔥 防衛成功！ 熱ストレスで働き蜂 -${Math.round(threat.ballLosses)}`,true)}}else if(threat.mode==='recovered')"
          assert old in s
          s=s.replace(old,new,1)
          old="ball:`🔥 熱殺蜂球 ${threat.ballTemp.toFixed(1)}℃。包囲して温度を上げている。`"
          new="ball:`🔥 熱殺蜂球 ${threat.ballTemp.toFixed(1)}℃。包囲中 ｜ 熱ストレスで働き蜂 -${Math.round(threat.ballLosses)}`"
          assert old in s
          s=s.replace(old,new,1)
          old="recovered:'🛡 防衛後。採餌と育児へ少しずつ戻る。'"
          new="recovered:threat.losses>0?`🛡 防衛後。働き蜂 -${Math.round(threat.losses)}。採餌と育児へ戻る。`:'🛡 防衛後。採餌と育児へ少しずつ戻る。'"
          assert old in s
          s=s.replace(old,new,1)
          old="スズメバチの偵察と襲来を防ぐコロニー模型。"
          new="スズメバチの偵察と襲来を防ぎ、防衛コストも観察できるコロニー模型。"
          s=s.replace(old,new,1)
          old="巣房表示は大きな巣の代表断面。</div>"
          new="巣房表示は大きな巣の代表断面。熱殺蜂球は強力だが無傷ではなく、この模型では参加蜂の熱ストレスとエネルギー消費を働き蜂数・蜂蜜の減少として表す。</div>"
          assert old in s
          s=s.replace(old,new,1)
          old="capacity:Math.round(workerCapacity())})"
          new="capacity:Math.round(workerCapacity()),ballLosses:Math.round(threat.ballLosses),defenseLosses:Math.round(threat.losses)})"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          s=Path('honeybee-colony.html').read_text()
          HTMLParser().feed(s)
          assert 'ballLosses' in s
          assert '熱ストレスで働き蜂' in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/bee.js').write_text(scripts[-1])
          PY
          node --check /tmp/bee.js
      - name: Dynamic heat-ball cost test
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install jsdom@26 >/dev/null 2>&1
          node <<'JS'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){
            w.requestAnimationFrame=()=>0;
            w.HTMLCanvasElement.prototype.getContext=()=>new Proxy({}, {get:(t,p)=>p==='measureText'?(()=>({width:20})):(()=>{}),set:()=>true});
          }});
          const w=dom.window;
          const api=w.__beeLab;
          if(!api) throw new Error('bee API missing');
          const start=api.snapshot().workers;
          api.triggerScout();
          let sawBall=false,sawDrop=false,maxBallLoss=0,prev=start;
          for(let i=0;i<70;i++){
            api.stepHours(1);
            const s=api.snapshot();
            if(s.threat==='ball') sawBall=true;
            if(s.ballLosses>maxBallLoss) maxBallLoss=s.ballLosses;
            if(s.workers<prev && s.ballLosses>0) sawDrop=true;
            prev=s.workers;
          }
          const end=api.snapshot();
          if(!sawBall) throw new Error('heat ball never formed');
          if(maxBallLoss<1) throw new Error('heat ball caused no worker loss');
          if(!sawDrop) throw new Error('worker HUD population never declined during heat ball');
          console.log({start,end:end.workers,maxBallLoss,threat:end.threat});
          JS
      - name: Commit application
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- honeybee-colony.html; then exit 0; fi
          git config user.name sstrshbt
          git config user.email 107645802+shtshbt@users.noreply.github.com
          git add honeybee-colony.html
          git commit -m 'Add heat-ball defense cost'
          git push
