name: Honeybee comb behavior test
on:
  push:
    branches: [agent/honeybee-comb-season-ui]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-comb-season-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test spring and winter comb behavior
        run: |
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > comb-test.cjs <<'JS'
          const fs=require('fs'); const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.Math.random=()=>0;w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},moveTo(){},lineTo(){},bezierCurveTo(){},arc(){},ellipse(){},fill(){},stroke(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},fillText(){},strokeText(){},measureText(t){return {width:String(t).length*7}},createLinearGradient(){return {addColorStop(){}}},set fillStyle(v){},set strokeStyle(v){},set shadowColor(v){},set shadowBlur(v){},set lineWidth(v){},set font(v){},set textAlign(v){},set globalAlpha(v){}});w.requestAnimationFrame=()=>0;}});
          const w=dom.window,d=w.document,lab=w.__beeLab,cv=d.getElementById('cv');
          if(!lab) throw new Error('beeLab missing');
          if(w.getComputedStyle(d.getElementById('swarmModal')).position!=='fixed') throw new Error('swarm modal not viewport fixed');
          cv.getBoundingClientRect=()=>({left:0,top:0,width:960,height:650,right:960,bottom:650});
          const tap=()=>cv.dispatchEvent(new w.MouseEvent('pointerdown',{clientX:703,clientY:352,button:0,bubbles:true}));
          lab.forceSeason(0);lab.setTool('comb');
          let s0=lab.snapshot(); tap(); let q1=lab.snapshot();
          if(q1.buildTargets<=s0.buildTargets) throw new Error('spring comb target not queued');
          lab.stepHours(2); let s1=lab.snapshot();
          if(s1.cells<=s0.cells) throw new Error('spring comb did not build');
          if(s1.wax>=s0.wax && s1.honey>=s0.honey) throw new Error('comb build showed no resource cost');
          tap(); let queued=lab.snapshot(); if(queued.buildTargets<1) throw new Error('second spring target not queued');
          lab.forceSeason(3); let w0=lab.snapshot(); tap(); let w1=lab.snapshot();
          if(w1.buildTargets!==w0.buildTargets) throw new Error('winter accepted a new build target');
          lab.stepHours(48); let w2=lab.snapshot();
          if(w2.cells!==w0.cells) throw new Error('pending comb expanded during winter');
          if(w2.buildTargets!==w0.buildTargets) throw new Error('winter consumed pending build target');
          console.log({springBefore:s0,springAfter:s1,winterBefore:w0,winterAfter:w2});
          JS
          node comb-test.cjs
      - name: Remove temporary workflow
        run: |
          rm -f comb-test.cjs package-lock.json .github/workflows/honeybee-comb-behavior-test.yml
          git config user.name sshibata
          git config user.email 107645802+shtshbt@users.noreply.github.com
          git add .github/workflows/honeybee-comb-behavior-test.yml
          git commit -m "Remove temporary comb behavior test"
          git push origin agent/honeybee-comb-season-ui
