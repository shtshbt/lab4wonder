name: Honeybee comb tap target
on:
  push:
    branches: [agent/honeybee-comb-tap-target]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-comb-tap-target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch comb targeting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          start=s.index('function nearestCell(p){')
          end=s.index("cv.addEventListener('pointerdown'", start)
          new="function nearestCell(p){let best=null,bd=42;for(const z of cells){const hp=hexPos(z.q,z.r),d=Math.hypot(hp.x-p.x,hp.y-p.y);if(d<bd){bd=d;best={z,...hp}}}return best}function canBuildComb(){if(seasonIndex===3)return{ok:false,reason:'❄️ 冬は巣板を広げず、越冬を優先する'};if(workers<55)return{ok:false,reason:'🐝 働き蜂が少なくて増築できない'};if(temp<31)return{ok:false,reason:'🌡 巣が冷えていて蜜ろうを作りにくい'};const budget=combBuildBudget();if(budget<=buildTargets.length){if(wax<1)return{ok:false,reason:'⬡ 蜜ろうが足りない。花と蜂蜜があると少しずつ作る'};if(honey<7)return{ok:false,reason:'🍯 蜂蜜が少ない。増築より食料確保が先'};return{ok:false,reason:'⬡ いま作れる分は建築予約済み'}}return{ok:true,budget}}function buildCandidates(){const dirs=[[1,0],[-1,0],[0,1],[0,-1],[1,-1],[-1,1]],occupied=new Set(cells.map(z=>z.q+','+z.r)),queued=new Set(buildTargets.map(z=>z.q+','+z.r)),seen=new Set(),out=[];for(const z of cells)for(const [dq,dr] of dirs){const q=z.q+dq,r=z.r+dr,key=q+','+r;if(seen.has(key)||occupied.has(key)||queued.has(key))continue;seen.add(key);const hp=hexPos(q,r);if(hp.x<combArea.x+18||hp.x>combArea.x+combArea.w-18||hp.y<combArea.y+18||hp.y>combArea.y+combArea.h-18)continue;out.push({q,r,...hp})}return out}function nearestBuildSpot(p){const opts=buildCandidates();if(!opts.length)return null;let best=opts[0],bd=Infinity;for(const a of opts){const d=Math.hypot(a.x-p.x,a.y-p.y);if(d<bd){bd=d;best=a}}return best}function addBuildNear(p){const can=canBuildComb();if(!can.ok){toast(can.reason,true);return false}if(p.x<combArea.x-35||p.x>combArea.x+combArea.w+25||p.y<combArea.y-35||p.y>combArea.y+combArea.h+25){toast('⬡ 巣板のあたりをタップしてね');return false}const spot=nearestBuildSpot(p);if(!spot){toast('ここはもう巣房でいっぱい');return false}buildTargets.push({q:spot.q,r:spot.r});toast('⬡ 近い外周へ吸着！ 増築予約した',true);return true}"
          s=s[:start]+new+s[end:]
          old2="for(const b of buildTargets){const p=hexPos(b.q,b.r);c.setLineDash([4,4]);drawHex(p.x,p.y,p.R,'rgba(255,215,101,.08)','#ffd765');c.setLineDash([])}c.textAlign='left';"
          new2="if(tool==='comb'){const can=canBuildComb();if(can.ok){for(const b of buildCandidates()){c.setLineDash([3,4]);drawHex(b.x,b.y,b.R,'rgba(255,215,101,.055)','rgba(255,215,101,.55)');c.setLineDash([]);c.fillStyle='rgba(255,235,165,.82)';c.font='900 12px system-ui';c.textAlign='center';c.fillText('＋',b.x,b.y+4)}}}for(const b of buildTargets){const p=hexPos(b.q,b.r);c.setLineDash([4,4]);drawHex(p.x,p.y,p.R,'rgba(255,215,101,.12)','#ffd765');c.setLineDash([])}c.textAlign='left';"
          if old2 not in s: raise SystemExit('draw anchor missing')
          s=s.replace(old2,new2,1)
          old3="if(tool==='comb'){if(p.y<245){toast('⬡ 巣板の端をタップしてね');return}addBuildNear(p)}"
          if old3 not in s: raise SystemExit('pointer anchor missing')
          s=s.replace(old3,"if(tool==='comb'){addBuildNear(p)}",1)
          old4="comb:'⬡ 巣板の端をタップ：春〜秋に増築。蜜ろう1＋蜂蜜0.6が必要。冬は建築を休む。'"
          if old4 not in s: raise SystemExit('hint anchor missing')
          s=s.replace(old4,"comb:'⬡ 巣板の中〜外周を大ざっぱにタップ：最寄りの黄色い＋へ吸着して増築。蜜ろう1＋蜂蜜0.6が必要。冬は建築を休む。'",1)
          old5="forceSeason:i=>{seasonIndex=i;seasonHour=0;if(i===3){threat.mode='calm';threat.hornets=[];threat.raidPending=0}update()}"
          if old5 not in s: raise SystemExit('test api anchor missing')
          s=s.replace(old5,"queueBuildAt:(x,y)=>addBuildNear({x,y}),buildCandidateCount:()=>buildCandidates().length,forceSeason:i=>{seasonIndex=i;seasonHour=0;if(i===3){threat.mode='calm';threat.hornets=[];threat.raidPending=0}update()}",1)
          p.write_text(s)
          PY
      - name: Validate syntax and tap behavior
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('honeybee-colony.html').read_text()
          js=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S).group(1)
          pathlib.Path('/tmp/bee.js').write_text(js)
          assert 'function buildCandidates()' in s
          assert 'function canBuildComb()' in s
          assert '近い外周へ吸着' in s
          assert "fillText('＋'" in s
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > test-comb-tap.cjs <<'JS'
          const fs=require('fs'),{JSDOM}=require('jsdom');
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>new Proxy({measureText:t=>({width:String(t).length*7})},{get:(o,k)=>k in o?o[k]:(()=>{})});w.requestAnimationFrame=()=>0;}});
          const lab=dom.window.__beeLab;
          if(!lab) throw Error('beeLab missing');
          const start=lab.snapshot();
          const candidates=lab.buildCandidateCount();
          if(candidates<1) throw Error('no build candidates');
          const ok=lab.queueBuildAt(650,395);
          const queued=lab.snapshot();
          if(!ok || queued.buildTargets!==start.buildTargets+1) throw Error('center tap did not snap to perimeter candidate');
          const ok2=lab.queueBuildAt(880,520);
          if(!ok2 || lab.snapshot().buildTargets!==queued.buildTargets+1) throw Error('broad edge tap did not queue');
          const outside=lab.queueBuildAt(100,100);
          if(outside) throw Error('far outside tap should not build');
          lab.forceSeason(3);
          const winterBefore=lab.snapshot().buildTargets;
          const winterOk=lab.queueBuildAt(650,395);
          if(winterOk || lab.snapshot().buildTargets!==winterBefore) throw Error('winter build gate regressed');
          console.log(JSON.stringify({candidates,centerSnap:ok,edgeSnap:ok2,outsideBlocked:!outside,winterBlocked:!winterOk}));
          JS
          node test-comb-tap.cjs
          rm -f test-comb-tap.cjs
      - name: Commit result
        run: |
          git config user.name "shtshbt"
          git config user.email "107645802+shtshbt@users.noreply.github.com"
          git add honeybee-colony.html
          git commit -m "Make comb expansion taps forgiving"
          git push origin HEAD:agent/honeybee-comb-tap-target
