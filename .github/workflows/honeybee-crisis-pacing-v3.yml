name: Honeybee crisis pacing v3

on:
  push:
    branches:
      - agent/honeybee-crisis-pacing-fix

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-crisis-pacing-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v2 patch plus floral reproduction coupling
        shell: bash
        run: |
          if grep -q 'bigAlertContinue' honeybee-colony.html; then
            echo 'HTML already patched; validating current branch'
          else
            python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/honeybee-crisis-pacing-v2.yml').read_text()
          start="          python - <<'PY'\n"
          end="          PY\n      - name: Validate behavior"
          block=textwrap.dedent(src.split(start,1)[1].split(end,1)[0])
          marker="          p.write_text(s)" if "          p.write_text(s)" in block else "p.write_text(s)"
          extra="rep(\"const lay=(queenMode==='mated'?s.lay:0)*space*food*(temp>30.5&&temp<36.8?1:.25);\", \"const floralLayBoost=clamp(flowerMass/1.45,.62,1.45),lay=(queenMode==='mated'?s.lay:0)*space*food*floralLayBoost*(temp>30.5&&temp<36.8?1:.25);\")\n"
          if marker not in block: raise SystemExit('write marker missing')
          block=block.replace(marker,extra+marker,1)
          Path('/tmp/patch.py').write_text(block)
          PY
            python /tmp/patch.py
          fi
      - name: Validate growth and crisis behavior
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text(); P().feed(s)
          for token in ['bigAlertContinue','crisisHold','collapsedCurtain','raidPending=48+Math.random()*72','clamp(flowerMass/1.2,0,2.2)','floralLayBoost']:
              assert token in s, token
          a=s.index('<script>')+8;b=s.index('</script>',a);Path('/tmp/bee.js').write_text(s[a:b])
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > bee-v3-test.mjs <<'JS'
          import fs from 'fs'; import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          function make(){return new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});w.requestAnimationFrame=()=>0;}})}
          let dom=make(),lab=dom.window.__beeLab;lab.setPressure(0);let a=lab.snapshot();lab.stepHours(24);let b=lab.snapshot();if(b.flowers!==a.flowers||b.flowerResource<=a.flowerResource*.75)throw new Error('flower lifetime regression '+JSON.stringify({a,b}));
          dom=make();lab=dom.window.__beeLab;lab.setPressure(0);lab.stepHours(24*20);let base=lab.snapshot();console.log('BASE20',JSON.stringify(base));
          dom=make();lab=dom.window.__beeLab;lab.setPressure(0);for(let i=0;i<3;i++)lab.addTestFlower(24*30,100);lab.stepHours(24*20);let g=lab.snapshot();console.log('MANAGED20',JSON.stringify(g));if(!(g.swarmPending||g.workers>=base.workers+10))throw new Error('extra flowers still do not produce a growth advantage');if(g.workers<140)throw new Error('managed colony remains stagnant');if(g.flowers<3)throw new Error('flowers vanish too quickly');
          dom=make();lab=dom.window.__beeLab;lab.setPressure(100);dom.window.Math.random=()=>.99;lab.triggerScout();let s=lab.snapshot();if(!s.crisisHold||s.threat!=='scout')throw new Error('scout not paused');lab.releaseCrisisHold();for(let i=0;i<50&&!lab.snapshot().crisisHold;i++)lab.stepHours(1);s=lab.snapshot();if(!s.crisisHold||s.threat!=='marked')throw new Error('failed scout not paused');lab.releaseCrisisHold();for(let i=0;i<40;i++)lab.stepHours(1);if(lab.snapshot().threat!=='marked')throw new Error('raid too immediate');for(let i=0;i<100&&!lab.snapshot().crisisHold;i++)lab.stepHours(1);s=lab.snapshot();if(!s.crisisHold||s.threat!=='raid')throw new Error('raid not paused');lab.releaseCrisisHold();for(let i=0;i<180&&lab.snapshot().colonyAlive;i++)lab.stepHours(1);s=lab.snapshot();console.log('COLLAPSE',JSON.stringify(s));if(s.colonyAlive||s.visualBees!==0||s.workers!==0)throw new Error('collapse not terminal');console.log('PASS');
          JS
          node bee-v3-test.mjs
          rm -f bee-v3-test.mjs
          rm -rf node_modules package-lock.json package.json
      - name: Commit HTML if changed
        shell: bash
        run: |
          git config user.name 'sshibata'
          git config user.email '107645802+shtshbt@users.noreply.github.com'
          if git diff --quiet -- honeybee-colony.html; then
            echo 'No HTML changes to commit'
          else
            git add honeybee-colony.html
            git commit -m 'Fix honeybee crisis pacing and resource-growth balance'
            git push origin HEAD:agent/honeybee-crisis-pacing-fix
          fi
