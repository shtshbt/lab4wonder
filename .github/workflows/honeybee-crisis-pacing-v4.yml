name: Honeybee crisis pacing v4

on:
  push:
    branches:
      - agent/honeybee-crisis-pacing-fix

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-crisis-pacing-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final patch if needed
        shell: bash
        run: |
          if grep -q 'bigAlertContinue' honeybee-colony.html; then
            echo 'HTML already patched'
          else
            python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/honeybee-crisis-pacing-v2.yml').read_text()
          start="          python - <<'PY'\n"; end="          PY\n      - name: Validate behavior"
          block=textwrap.dedent(src.split(start,1)[1].split(end,1)[0])
          marker="p.write_text(s)"
          extra="rep(\"const lay=(queenMode==='mated'?s.lay:0)*space*food*(temp>30.5&&temp<36.8?1:.25);\", \"const floralLayBoost=clamp(flowerMass/1.45,.62,1.45),lay=(queenMode==='mated'?s.lay:0)*space*food*floralLayBoost*(temp>30.5&&temp<36.8?1:.25);\")\n"
          block=block.replace(marker,extra+marker,1)
          Path('/tmp/patch.py').write_text(block)
          PY
            python /tmp/patch.py
          fi
      - name: Validate final balance
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text();P().feed(s)
          for token in ['bigAlertContinue','crisisHold','collapsedCurtain','raidPending=48+Math.random()*72','clamp(flowerMass/1.2,0,2.2)','floralLayBoost','🌸${Math.round(100*f.n']:
              assert token in s,token
          a=s.index('<script>')+8;b=s.index('</script>',a);Path('/tmp/bee.js').write_text(s[a:b])
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > final-test.mjs <<'JS'
          import fs from 'fs';import {JSDOM} from 'jsdom';const html=fs.readFileSync('honeybee-colony.html','utf8');
          function make(){return new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});w.requestAnimationFrame=()=>0;}})}
          let dom=make(),lab=dom.window.__beeLab;lab.setPressure(0),a=lab.snapshot();lab.stepHours(24);let day1=lab.snapshot();if(day1.flowers!==2||day1.flowerResource<a.flowerResource*.75)throw new Error('flowers still vanish too fast');
          dom=make();lab=dom.window.__beeLab;lab.setPressure(0);lab.stepHours(24*20);let base=lab.snapshot();console.log('BASE',JSON.stringify(base));if(base.workers<145)throw new Error('normal spring colony does not grow');
          dom=make();lab=dom.window.__beeLab;lab.setPressure(0);for(let i=0;i<3;i++)lab.addTestFlower(24*30,100);lab.stepHours(24*20);let managed=lab.snapshot();console.log('MANAGED',JSON.stringify(managed));const baseFuture=base.eggs+base.larvae+base.pupae,managedFuture=managed.eggs+managed.larvae+managed.pupae,baseStores=base.honey+base.nectar+base.pollen,managedStores=managed.honey+managed.nectar+managed.pollen;if(managed.workers<base.workers)throw new Error('extra flowers reduce workers');if(managedFuture<baseFuture+6)throw new Error('extra flowers do not increase next generation');if(managedStores<baseStores+60)throw new Error('flower amount does not meaningfully affect stores');if(managed.flowers<3)throw new Error('managed flowers vanish too fast');
          dom=make();lab=dom.window.__beeLab;lab.setPressure(100);dom.window.Math.random=()=>.99;lab.triggerScout();let s=lab.snapshot();if(!s.crisisHold||s.threat!=='scout')throw new Error('scout notice not held');lab.releaseCrisisHold();for(let i=0;i<50&&!lab.snapshot().crisisHold;i++)lab.stepHours(1);s=lab.snapshot();if(!s.crisisHold||s.threat!=='marked')throw new Error('escape notice not held');lab.releaseCrisisHold();for(let i=0;i<40;i++)lab.stepHours(1);if(lab.snapshot().threat!=='marked')throw new Error('raid starts immediately');for(let i=0;i<100&&!lab.snapshot().crisisHold;i++)lab.stepHours(1);s=lab.snapshot();if(!s.crisisHold||s.threat!=='raid')throw new Error('raid notice not held');lab.releaseCrisisHold();for(let i=0;i<180&&lab.snapshot().colonyAlive;i++)lab.stepHours(1);s=lab.snapshot();console.log('COLLAPSE',JSON.stringify(s));if(s.colonyAlive||s.workers!==0||s.visualBees!==0)throw new Error('collapse not terminal');if(!dom.window.document.getElementById('collapsedCurtain').classList.contains('show'))throw new Error('collapse screen missing');console.log('PASS');
          JS
          node final-test.mjs
          rm -f final-test.mjs
          rm -rf node_modules package-lock.json package.json
      - name: Commit HTML if changed
        shell: bash
        run: |
          git config user.name 'sshibata';git config user.email '107645802+shtshbt@users.noreply.github.com'
          if git diff --quiet -- honeybee-colony.html;then echo 'No HTML changes';else git add honeybee-colony.html;git commit -m 'Fix honeybee pacing, collapse state, and flower balance';git push origin HEAD:agent/honeybee-crisis-pacing-fix;fi
