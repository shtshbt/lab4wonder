name: Honeybee damage and collapse

on:
  push:
    branches:
      - agent/honeybee-damage-collapse

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-damage-collapse
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch cumulative heat damage and colony collapse
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit('missing patch anchor: '+a[:100])
              s=s.replace(a,b,1)

          rep('働き蜂、女王、スズメバチ、コロニー状態パネルを表示する模型"></canvas><div class="hud" aria-label="コロニー規模"><div class="big" id="hudWorkers">🐝 120</div><div id="hudQueen">👑 1</div>',
              '働き蜂、女王、スズメバチ、コロニー状態パネルを表示する模型"></canvas><div class="hud" aria-label="コロニー規模"><div class="big" id="hudWorkers">🐝 120</div><div id="hudHeat">♨️ 0</div><div id="hudQueen">👑 1</div>')
          rep('熱殺蜂球は強力だが無傷ではなく、この模型では参加蜂の熱ストレスとエネルギー消費を働き蜂数・蜂蜜の減少として表す。',
              '熱殺蜂球は強力だが無傷ではない。この模型では蜂球参加後に「♨️熱ダメージ蜂」が増え、その多くはすぐ死なず、その後の余命短縮を追加死亡率として表す。繰り返す防衛はこの負債を蓄積する。働き蜂数に最低保証はなく、維持不能まで減るとコロニーは崩壊する。')
          rep("simHours=0,workers=120,honey=28", "simHours=0,workers=120,heatDamaged=0,colonyAlive=true,queenAlive=true,honey=28")
          rep("workers=120;honey=28;", "workers=120;heatDamaged=0;colonyAlive=true;queenAlive=true;honey=28;")
          rep("losses:0,ballLosses:0,ballEnergy:0};", "losses:0,ballLosses:0,ballEnergy:0,ballDamage:0};")
          rep("threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0,ballLosses:0,ballEnergy:0};", "threat={mode:'calm',timer:0,hornets:[],ballTemp:0,marked:false,raidPending:0,losses:0,ballLosses:0,ballEnergy:0,ballDamage:0};")

          rep("function resourceQuality(){return clamp((honey+nectar*.18+12)/48,.25,1.25)*clamp((pollen+8)/28,.25,1.2)}function step(h){if(h<=0)return;",
              "function resourceQuality(){return clamp((honey+nectar*.18+12)/48,.25,1.25)*clamp((pollen+8)/28,.25,1.2)}function collapseColony(reason){if(!colonyAlive)return;colonyAlive=false;queenAlive=false;workers=Math.max(0,workers);heatDamaged=Math.min(heatDamaged,workers);running=false;$('play').textContent='▶ 再生';threat.mode='collapsed';threat.hornets=[];threat.raidPending=0;toast(`💀 コロニー崩壊：${reason}`,true)}function checkCollapse(reason='働き蜂が少なすぎて巣を維持できない'){if(colonyAlive&&workers<6)collapseColony(reason)}function step(h){if(h<=0||!colonyAlive)return;")

          rep("let deaths=workers*s.death*h;if(seasonIndex===2){const autumnTarget=workerCapacity()*.48;if(workers>autumnTarget)deaths+=(workers-autumnTarget)*h/(14*24)}if(seasonIndex===3){const winterTarget=workerCapacity()*.34;if(workers>winterTarget)deaths+=(workers-winterTarget)*h/(11*24)}workers=Math.max(28,workers+pupaOut-deaths);const cap=workerCapacity();",
              "let deaths=workers*s.death*h;if(seasonIndex===2){const autumnTarget=workerCapacity()*.48;if(workers>autumnTarget)deaths+=(workers-autumnTarget)*h/(14*24)}if(seasonIndex===3){const winterTarget=workerCapacity()*.34;if(workers>winterTarget)deaths+=(workers-winterTarget)*h/(11*24)}const damagedShare=workers>0?heatDamaged/workers:0,damagedBaseLoss=Math.min(heatDamaged,deaths*damagedShare),heatDebtLoss=Math.min(Math.max(0,heatDamaged-damagedBaseLoss),heatDamaged*h/(12*24));heatDamaged=Math.max(0,heatDamaged-damagedBaseLoss-heatDebtLoss);deaths+=heatDebtLoss;workers=Math.max(0,workers+pupaOut-deaths);checkCollapse();if(!colonyAlive){update();return}const cap=workerCapacity();")

          rep("threat.ballTemp=0;threat.losses=0;threat.ballLosses=0;threat.ballEnergy=0;", "threat.ballTemp=0;threat.losses=0;threat.ballLosses=0;threat.ballEnergy=0;threat.ballDamage=0;")
          rep("threat.ballTemp=36;threat.ballLosses=0;threat.ballEnergy=0;toast('🔥 蜂球！ みんなで包んだ',true)", "threat.ballTemp=36;threat.ballLosses=0;threat.ballEnergy=0;threat.ballDamage=0;toast('🔥 蜂球！ みんなで包んだ',true)")

          old="const participants=Math.min(workers,Math.max(36,rr.guard*1.35)),heatStress=clamp((threat.ballTemp-40)/6.2,0,1);threat.ballEnergy+=h*participants*(.0015+.0015*heatStress);const targetLoss=Math.min(Math.max(1,Math.floor(workers*.055)),Math.floor(threat.ballEnergy));if(targetLoss>threat.ballLosses){const delta=Math.min(targetLoss-threat.ballLosses,Math.max(0,workers-28));workers-=delta;threat.ballLosses+=delta;threat.losses+=delta}honey=Math.max(0,honey-h*participants*.00045);if(threat.ballTemp>=45.7){threat.mode='recovered';threat.timer=0;threat.hornets=[];toast(`🔥 防衛成功！ 熱ストレスで働き蜂 -${Math.round(threat.ballLosses)}`,true)}"
          new="const participants=Math.min(workers,Math.max(36,rr.guard*1.35)),heatStress=clamp((threat.ballTemp-40)/6.2,0,1),veterans=Math.min(heatDamaged,participants*.55);threat.ballEnergy+=h*participants*(.0015+.0015*heatStress);const damageTarget=Math.min(Math.floor(participants*.48),Math.floor(threat.ballEnergy*4.5)),newDamage=Math.min(Math.max(0,damageTarget-threat.ballDamage),Math.max(0,workers-heatDamaged));if(newDamage>0){heatDamaged+=newDamage;threat.ballDamage+=newDamage}const fatalTarget=Math.min(Math.floor(workers*.018),Math.floor(threat.ballEnergy*.20+veterans*heatStress*.018));if(fatalTarget>threat.ballLosses){const delta=Math.min(fatalTarget-threat.ballLosses,workers);workers-=delta;heatDamaged=Math.max(0,heatDamaged-delta);threat.ballLosses+=delta;threat.losses+=delta;checkCollapse('蜂球防衛の消耗で群れを維持できなくなった');if(!colonyAlive)return}honey=Math.max(0,honey-h*participants*.00045);if(threat.ballTemp>=45.7){threat.mode='recovered';threat.timer=0;threat.hornets=[];toast(`🔥 防衛成功！ 即時損失 -${Math.round(threat.ballLosses)} / ♨️熱ダメージ ${Math.round(threat.ballDamage)}匹`,true)}"
          rep(old,new)

          old="const lost=Math.min(Math.max(0,workers-28),Math.max(0,h*(strength-def)*.012));if(lost>0){workers-=lost;threat.losses+=lost}if(threat.timer>28){threat.mode='recovered';threat.hornets=[];toast(`⚠ 襲来終了。働き蜂 -${Math.round(threat.losses)}`,true)}"
          new="const lost=Math.min(workers,Math.max(0,h*(strength-def)*.012));if(lost>0){const before=Math.max(1,workers),damagedKilled=Math.min(heatDamaged,lost*(heatDamaged/before));workers-=lost;heatDamaged=Math.max(0,heatDamaged-damagedKilled);threat.losses+=lost;checkCollapse('スズメバチ襲来で防衛蜂が尽きた');if(!colonyAlive)return}if(threat.timer>28){threat.mode='recovered';threat.hornets=[];toast(`⚠ 襲来終了。働き蜂 -${Math.round(threat.losses)}`,true)}"
          rep(old,new)

          rep("$('hudWorkers').textContent=`🐝 ${Math.round(workers)}`;$('hudQueen').textContent='👑 1';", "$('hudWorkers').textContent=`🐝 ${Math.round(workers)}`;$('hudHeat').textContent=`♨️ ${Math.round(heatDamaged)}`;$('hudQueen').textContent=queenAlive?'👑 1':'👑 0';")
          rep("labels={calm:'平穏',scout:'偵察！',ball:`蜂球 ${threat.ballTemp.toFixed(0)}℃`,marked:'警戒',raid:'襲来！',recovered:'回復中'};", "labels={calm:'平穏',scout:'偵察！',ball:`蜂球 ${threat.ballTemp.toFixed(0)}℃`,marked:'警戒',raid:'襲来！',recovered:'回復中',collapsed:'崩壊'};")
          rep("ball:`🔥 熱殺蜂球 ${threat.ballTemp.toFixed(1)}℃。包囲中 ｜ 熱ストレスで働き蜂 -${Math.round(threat.ballLosses)}`", "ball:`🔥 熱殺蜂球 ${threat.ballTemp.toFixed(1)}℃ ｜ 即時損失 -${Math.round(threat.ballLosses)} ｜ ♨️熱ダメージ ${Math.round(threat.ballDamage)}匹`")
          rep("recovered:threat.losses>0?`🛡 防衛後。働き蜂 -${Math.round(threat.losses)}。採餌と育児へ戻る。`:'🛡 防衛後。採餌と育児へ少しずつ戻る。'};", "recovered:(threat.losses>0||heatDamaged>0)?`🛡 防衛後。即時損失 -${Math.round(threat.losses)} / ♨️熱ダメージ蜂 ${Math.round(heatDamaged)}。後から死亡率が上がる。`:'🛡 防衛後。採餌と育児へ少しずつ戻る。',collapsed:'💀 コロニー崩壊。リセットすると新しい群れで始められる。'};")
          rep("c.fillText(`働き蜂 ${Math.round(workers)}匹　／　群れ容量 約${Math.round(workerCapacity())}匹`,x+14,y+49);", "c.fillText(`働き蜂 ${Math.round(workers)}匹（♨️熱ダメージ ${Math.round(heatDamaged)}）／ 容量 約${Math.round(workerCapacity())}`,x+14,y+49);")
          rep("function nextHint(){if(seasonIndex===3)", "function nextHint(){if(!colonyAlive)return '💀 コロニーは崩壊した。リセットして新しい群れを始めよう。';if(seasonIndex===3)")
          rep("function drawQueen(){drawBee(630,385,1.65);", "function drawQueen(){if(!queenAlive)return;drawBee(630,385,1.65);")
          rep("snapshot:()=>({workers:Math.round(workers),eggs:", "snapshot:()=>({workers:Math.round(workers),healthyWorkers:Math.max(0,Math.round(workers-heatDamaged)),heatDamaged:Math.round(heatDamaged),colonyAlive,queenAlive,eggs:")
          rep("ballLosses:Math.round(threat.ballLosses),defenseLosses:Math.round(threat.losses)}),", "ballLosses:Math.round(threat.ballLosses),ballDamage:Math.round(threat.ballDamage),defenseLosses:Math.round(threat.losses)}),")
          rep("function triggerScout(manual=false){if(!['calm','recovered'].includes(threat.mode))", "function triggerScout(manual=false){if(!colonyAlive){toast('💀 コロニーは崩壊している');return}if(!['calm','recovered'].includes(threat.mode))")

          if 'Math.max(28' in s or 'workers-28' in s:
              raise SystemExit('old minimum-worker safety remains')
          p.write_text(s)
          PY
          python /tmp/patch.py
      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text()
          P().feed(s)
          a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/bee.js').write_text(s[a:b])
          for token in ['heatDamaged','collapseColony','colonyAlive','ballDamage','♨️熱ダメージ','最低保証はなく']:
              assert token in s, token
          assert 'Math.max(28' not in s
          assert 'workers-28' not in s
          PY
          node --check /tmp/bee.js
      - name: Dynamic damage and collapse tests
        shell: bash
        run: |
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > /tmp/test.mjs <<'JS'
          import fs from 'fs';
          import {JSDOM} from 'jsdom';
          let html=fs.readFileSync('honeybee-colony.html','utf8');
          html=html.replace("window.__beeLab={snapshot:","window.__beeLab={__setWorkers:n=>{workers=n;heatDamaged=Math.min(heatDamaged,n);},snapshot:");
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){
            w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});
            w.requestAnimationFrame=()=>0;
          }});
          const lab=dom.window.__beeLab;
          if(!lab) throw new Error('bee lab missing');
          lab.__setWorkers(320); lab.setPressure(100); lab.triggerScout();
          let sawBall=false;
          for(let i=0;i<80;i++){lab.stepHours(1);const s=lab.snapshot();if(s.threat==='ball')sawBall=true;if(s.threat==='recovered')break;}
          let s=lab.snapshot();
          if(!sawBall) throw new Error('heat ball did not form');
          if(s.ballDamage<5) throw new Error('heat damage cohort too small '+JSON.stringify(s));
          const damagedAfter=s.heatDamaged;
          lab.stepHours(72); s=lab.snapshot();
          if(!(s.heatDamaged<damagedAfter)) throw new Error('heat damage debt did not decay through excess mortality '+JSON.stringify(s));
          dom.window.document.getElementById('reset').click();
          lab.__setWorkers(20); lab.setPressure(100); lab.triggerScout();
          for(let i=0;i<140 && lab.snapshot().colonyAlive;i++) lab.stepHours(1);
          s=lab.snapshot();
          if(s.colonyAlive) throw new Error('severe hornet raid could not collapse colony '+JSON.stringify(s));
          if(s.workers>=6) throw new Error('collapse floor still acting '+JSON.stringify(s));
          console.log('PASS',JSON.stringify(s));
          JS
          node /tmp/test.mjs
      - name: Commit application
        shell: bash
        run: |
          rm -rf node_modules package-lock.json package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add honeybee-colony.html
          git commit -m 'Model cumulative heat damage and colony collapse'
          git push origin HEAD:agent/honeybee-damage-collapse
