name: Fix honeybee validation anchor

on:
  push:
    branches:
      - agent/honeybee-swarm-crisis-balance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-swarm-crisis-balance
      - name: Fix anchor and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/honeybee-swarm-crisis-balance.yml')
          s=p.read_text()
          old='          rep("threat.ballDamage=0;if(manual)", "threat.ballDamage=0;threat.scoutChecked=false;threat.scoutChance=0;if(manual)")'
          new='          rep("threat.ballDamage=0;bigNotice(\'👹 スズメバチ偵察！\'", "threat.ballDamage=0;threat.scoutChecked=false;threat.scoutChance=0;bigNotice(\'👹 スズメバチ偵察！\'")'
          if old not in s:
              raise SystemExit('anchor line not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/honeybee-fix-anchor.yml
          git config user.name 'sshibata'
          git config user.email '107645802+shtshbt@users.noreply.github.com'
          git add .github/workflows/honeybee-swarm-crisis-balance.yml .github/workflows/honeybee-fix-anchor.yml
          git commit -m 'Fix honeybee validation anchor'
          git push origin HEAD:agent/honeybee-swarm-crisis-balance
