name: Honeybee unobstructed UI
on:
  push:
    branches: [agent/honeybee-panel-dedup]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-panel-dedup
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch unobstructed UI and autonomous scout flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('honeybee-colony.html')
          s=p.read_text()

          hud='''<div class="hud" aria-label="コロニー規模"><div class="big" id="hudWorkers">🐝 120</div><div id="hudHeat">♨️ 0</div><div id="hudQueen">👑 1</div><div id="hudEgg">🥚 18</div><div id="hudLarva">🐛 14</div><div id="hudHoney">🍯 28</div><div id="hudPollen">🌼 16</div><div id="hudCells">⬡ 73</div><div id="hudSeason">🌿 春</div><div id="hudRange">🧭 1.1km</div><div class="lineage" id="hudLineage">🏠 1年目 ｜ 👑 1代目</div><div class="danger" id="hudDanger">👹 ○○○○○ 平穏</div></div>'''
          if hud not in s: raise SystemExit('HUD anchor missing')
          s=s.replace(hud,'''<div class="quickStatus" aria-label="コロニーの要約"><strong id="hudWorkers">🐝 120</strong><span id="hudSeason">🌿 春</span><span class="danger" id="hudDanger">👹 ○○○○○ 平穏</span></div>''',1)

          css='''.quickStatus{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border-top:1px solid #30465c;background:#0d1925;font:850 12px/1.3 ui-monospace,monospace}.quickStatus strong{color:#ffd765;font-size:14px}.quickStatus span{padding-left:8px;border-left:1px solid #40536b}.quickStatus .danger{color:#ffb0a0;flex:1}.stage>.toast{position:static;display:none;left:auto;bottom:auto;transform:none;opacity:1;transition:none;margin:7px 10px;padding:8px 10px;border-radius:10px;max-width:none;white-space:normal;background:#243442;color:#eef5fb;text-align:left}.stage>.toast.show{display:block;transform:none;opacity:1}.stage>.bigalert{position:static;display:none;left:auto;right:auto;top:auto;transform:none;width:auto;margin:7px 10px;padding:9px 12px;border:2px solid #ffb091;border-radius:12px;box-shadow:none;opacity:1;text-align:left;background:#35191a}.stage>.bigalert.show{display:block;transform:none}.stage>.bigalert.safe{background:#2b260f}.stage>.bigalert h2{display:inline;margin:0 8px 0 0;font-size:16px}.stage>.bigalert p{display:inline;margin:0;font-size:12px}.stage>.bigalert button{display:none!important}.stage>.bigalert.hold{pointer-events:none}@media(max-width:430px){.quickStatus{font-size:11px;gap:5px}.quickStatus strong{font-size:13px}.quickStatus span{padding-left:5px}.stage>.bigalert h2{font-size:14px}.stage>.bigalert p{font-size:11px}}'''
          s=s.replace('</style>',css+'</style>',1)

          pat=re.compile(r"\$\('hudWorkers'\)\.textContent=`🐝 \$\{Math\.round\(workers\)\}`;\$\('hudHeat'\).*?\$\('hudLineage'\)\.textContent=.*?;const d=",re.S)
          s,n=pat.subn("$('hudWorkers').textContent=`🐝 ${Math.round(workers)}`;$('hudSeason').textContent=`${s.icon} ${s.name}`;const d=",s,count=1)
          if n!=1: raise SystemExit(f'HUD update replacement count={n}')

          pat=re.compile(r"threat\.scoutChance=0;holdNotice\('👹 スズメバチ偵察！'.*?\);if\(manual\)toast\('👹 スズメバチの偵察！',true\)")
          replacement="threat.scoutChance=0;bigNotice('👹 スズメバチ偵察！','右から偵察蜂が接近中。しばらく見ていると蜂球で迎撃するか、逃げられるかが決まる。','danger',4200);if(manual&&!running){running=true;$('play').textContent='⏸ 一時停止'}if(manual)toast('👹 偵察蜂が飛んできた。動きを見てみよう',true)"
          s,n=pat.subn(replacement,s,count=1)
          if n!=1: raise SystemExit(f'triggerScout replacement count={n}')

          pat=re.compile(r"holdNotice\('⚠️ 偵察蜂を逃した！'.*?\);toast\('⚠ 偵察蜂が逃げた。巣を覚えられたかも…',true\)")
          s,n=pat.subn("bigNotice('⚠️ 偵察蜂を逃した！','巣を覚えられた。2〜5日ほどの警戒期間を経て、本格襲来する可能性がある。','danger',4800);toast('⚠ 偵察蜂が逃げた。巣を覚えられたかも…',true)",s,count=1)
          if n!=1: raise SystemExit(f'markNest replacement count={n}')

          pat=re.compile(r"holdNotice\('🚨 スズメバチの大群！'.*?\);toast\(`👹 \$\{n\}匹の大群が接近！`,true\)")
          s,n=pat.subn("bigNotice('🚨 スズメバチ大群！',`${n}匹が右から接近中。まず姿を確認しよう。巣口へ着くまでは被害は始まらない。`,'danger',5200);toast(`👹 ${n}匹の大群が接近！`,true)",s,count=1)
          if n!=1: raise SystemExit(f'startRaid replacement count={n}')

          # PR34 accidentally capped x at exactly 610 while testing x < 610, so scout could never arrive.
          old="const x=880-Math.min(270,threat.timer*8);"
          if old not in s: raise SystemExit('scout movement cap anchor missing')
          s=s.replace(old,"const x=880-Math.min(300,threat.timer*8);",1)

          p.write_text(s)
          PY
      - name: Validate behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('honeybee-colony.html').read_text()
          assert 'class="hud"' not in s
          assert 'class="quickStatus"' in s
          assert 'id="hudHeat"' not in s and 'id="hudQueen"' not in s
          assert "holdNotice('👹 スズメバチ偵察！'" not in s
          assert "holdNotice('⚠️ 偵察蜂を逃した！'" not in s
          assert "holdNotice('🚨 スズメバチの大群！'" not in s
          assert 'Math.min(300,threat.timer*8)' in s
          assert 'stage>.toast{position:static' in s
          assert 'stage>.bigalert{position:static' in s
          script=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/bee.js').write_text(script)
          print('static assertions passed')
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > bee-ui-test.cjs <<'JS'
          const fs=require('fs'); const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},moveTo(){},lineTo(){},bezierCurveTo(){},arc(){},ellipse(){},fill(){},stroke(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},fillText(){},strokeText(){},measureText(t){return {width:String(t).length*7}},createLinearGradient(){return {addColorStop(){}}},set fillStyle(v){},set strokeStyle(v){},set shadowColor(v){},set shadowBlur(v){},set lineWidth(v){},set font(v){},set textAlign(v){},set globalAlpha(v){}}); w.requestAnimationFrame=()=>0;}});
          const w=dom.window,d=w.document,lab=w.__beeLab;
          if(!lab) throw new Error('beeLab missing');
          if(d.querySelector('.hud')) throw new Error('old overlay HUD remains');
          if(!d.querySelector('.quickStatus')) throw new Error('quick summary missing');
          lab.forceSeason(2); lab.setPressure(100); lab.triggerScout();
          let s=lab.snapshot(); if(s.threat!=='scout') throw new Error('scout not started');
          if(s.crisisHold) throw new Error('scout still blocked by crisisHold');
          lab.stepHours(40); s=lab.snapshot();
          if(s.threat==='scout') throw new Error('scout stayed forever');
          console.log('scout advanced to',s.threat,'workers',s.workers);
          JS
          node bee-ui-test.cjs
      - name: Commit app and remove workflow
        run: |
          git config user.name sshibata
          git config user.email 107645802+shtshbt@users.noreply.github.com
          git add honeybee-colony.html
          git commit -m "Remove obstructive hive overlays and unblock scouts"
          git rm .github/workflows/honeybee-panel-dedup.yml
          git commit -m "Remove temporary honeybee UI workflow"
          git push origin agent/honeybee-panel-dedup
