name: Honeybee raid animation
on:
  push:
    branches: [agent/honeybee-raid-animation]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-raid-animation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch raid animation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          def rep(old,new):
              global s
              if old not in s: raise SystemExit('missing anchor: '+old[:100])
              s=s.replace(old,new,1)

          rep("workerHistory=[];let threat=", "workerHistory=[],combatFx=[];let threat=")
          rep("workerHistory=[];threat={mode:'calm'", "workerHistory=[];combatFx=[];threat={mode:'calm'")

          rep("function syncVisualBees(rr){if(!colonyAlive){bees=[];return}const want=Math.round(clamp(28+workers*.16,30,92));", "function syncVisualBees(rr){if(!colonyAlive){bees=[];return}const raid=threat.mode==='raid',want=Math.round(clamp((raid?18:28)+workers*(raid?.22:.16),raid?18:30,raid?110:92));")

          rep("function drawBees(){if(!colonyAlive)return;const now=performance.now()/1000,winter=seasonIndex===3;bees.forEach((b,i)=>{b.phase+=.006;let x=b.x,y=b.y;if(winter){", "function drawBees(){if(!colonyAlive)return;const now=performance.now()/1000,winter=seasonIndex===3,raid=threat.mode==='raid';bees.forEach((b,i)=>{b.phase+=raid?.026:.006;let x=b.x,y=b.y;if(raid){const wave=(Math.sin(now*4.8+b.phase+i*.7)+1)/2,ring=22+(i%9)*3.8,ang=b.phase+i*.63+now*1.7;x=548+Math.cos(ang)*ring+wave*20;y=205+Math.sin(ang*1.17)*ring*.68+(i%3-1)*3}else if(winter){")

          rep("function drawThreat(){for(const [i,h] of threat.hornets.entries()){", "function addCombatFx(x,y,type='hit'){combatFx.push({x,y,type,life:1})}function drawCombatFx(){for(const f of combatFx){const a=clamp(f.life,0,1),r=(1-a)*30+4;c.save();c.globalAlpha=a;if(f.type==='fall'){c.strokeStyle='#ffd765';c.lineWidth=2;c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x-10,f.y+22);c.stroke();drawBee(f.x-10,f.y+22,.45,1.2)}else{c.strokeStyle='#fff1a8';c.lineWidth=3;c.beginPath();for(let k=0;k<8;k++){const aa=k/8*TAU;c.moveTo(f.x+Math.cos(aa)*r*.35,f.y+Math.sin(aa)*r*.35);c.lineTo(f.x+Math.cos(aa)*r,f.y+Math.sin(aa)*r)}c.stroke()}c.restore();f.life-=.045}combatFx=combatFx.filter(f=>f.life>0)}function drawThreat(){for(const [i,h] of threat.hornets.entries()){")

          rep("function draw(){c.clearRect(0,0,960,650);drawWorld();drawComb();drawPanel();drawBees();drawThreat();drawQueen()}", "function draw(){c.clearRect(0,0,960,650);drawWorld();drawComb();drawPanel();drawBees();drawThreat();drawCombatFx();drawQueen();if(threat.mode==='raid'){c.save();c.fillStyle='rgba(90,0,0,.14)';c.fillRect(400,140,190,115);c.strokeStyle='rgba(255,95,65,.75)';c.lineWidth=3;c.strokeRect(505,170,74,62);c.fillStyle='#ffcabd';c.font='900 15px system-ui';c.fillText('🚨 巣口で攻防中！',418,160);c.restore()}}")

          rep("const breach=Math.max(0,strength-def),lost=Math.min(workers,Math.max(0,h*breach*.018));", "const breach=Math.max(0,strength-def),lost=Math.min(workers,Math.max(0,h*breach*.018));if(breach>0&&Math.random()<Math.min(.85,h*.55)){addCombatFx(rand(520,585),rand(178,232),Math.random()<.58?'hit':'fall')}")

          rep("if(lost>0){const before=Math.max(1,workers)", "if(lost>0){for(let k=0;k<Math.min(4,Math.ceil(lost/2));k++)addCombatFx(rand(515,585),rand(185,235),'fall');const before=Math.max(1,workers)")

          rep("if(def>strength){if(threat.timer>9){threat.hornets.pop();", "if(def>strength){if(Math.random()<Math.min(.75,h*.35))addCombatFx(rand(520,590),rand(180,230),'hit');if(threat.timer>9){threat.hornets.pop();")

          rep("if(!threat.hornets.length){threat.mode='recovered';toast('🛡 襲来をしのいだ',true)}", "if(!threat.hornets.length){threat.mode='recovered';combatFx=[];bigNotice('🛡 襲来をしのいだ',`働き蜂の損失 ${Math.round(threat.losses)}匹。防衛蜂が巣口を守り切った。`,'safe',3600);toast('🛡 襲来をしのいだ',true)}")

          rep("if(threat.timer>28){threat.mode='recovered';threat.hornets=[];", "if(threat.timer>28){threat.mode='recovered';threat.hornets=[];combatFx=[];")

          rep("threat.mode='collapsed';threat.hornets=[];", "threat.mode='collapsed';threat.hornets=[];combatFx=[];")

          rep("raid:`🚨 本格襲来！ ${threat.hornets.length}匹 / 働き蜂被害 ${Math.round(threat.losses)} / 育児被害 ${Math.round(threat.broodLoss||0)}`", "raid:`🚨 巣口で防衛中！ スズメバチ ${threat.hornets.length}匹 / 働き蜂被害 ${Math.round(threat.losses)} / 育児被害 ${Math.round(threat.broodLoss||0)}`")

          p.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text(); P().feed(s)
          a=s.index('<script>')+8; b=s.index('</script>',a); Path('/tmp/bee.js').write_text(s[a:b])
          for token in ["combatFx=[]","function drawCombatFx()","巣口で攻防中","raid?.22","addCombatFx(rand(520,585)"]:
              assert token in s, token
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > raid-test.mjs <<'JS'
          import fs from 'fs'; import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set globalAlpha(v){},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});w.requestAnimationFrame=()=>0;}});
          const lab=dom.window.__beeLab; lab.setPressure(100); dom.window.Math.random=()=>.99; lab.triggerScout(); lab.releaseCrisisHold();
          for(let i=0;i<60&&!lab.snapshot().crisisHold;i++) lab.stepHours(1);
          if(lab.snapshot().threat!=='marked') throw new Error('expected marked');
          lab.releaseCrisisHold();
          for(let i=0;i<130&&!lab.snapshot().crisisHold;i++) lab.stepHours(1);
          if(lab.snapshot().threat!=='raid') throw new Error('expected raid hold');
          lab.releaseCrisisHold(); lab.stepHours(3);
          const s=lab.snapshot(); if(s.threat!=='raid' && s.colonyAlive) throw new Error('raid did not animate long enough');
          console.log('RAID',JSON.stringify(s));
          JS
          node raid-test.mjs
          rm -f raid-test.mjs package.json package-lock.json
          rm -rf node_modules
      - name: Commit and cleanup
        shell: bash
        run: |
          git config user.name sshibata
          git config user.email 107645802+shtshbt@users.noreply.github.com
          git add honeybee-colony.html
          git commit -m "Animate honeybee hornet raids"
          git rm .github/workflows/honeybee-raid-animation.yml
          git commit -m "Remove temporary honeybee raid workflow"
          git push origin HEAD:agent/honeybee-raid-animation
