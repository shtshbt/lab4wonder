name: Honeybee swarm clarity
on:
  push:
    branches: [agent/honeybee-swarm-clarity]
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-swarm-clarity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch swarm visibility and forage label
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()

          old="if(!winter){c.fillStyle='#17301a';c.font='bold 10px system-ui';c.fillText('← 約1.2km　採餌圏（模式図）　約0.1km →',42,224)}"
          if old not in s: raise SystemExit('forage scale label anchor missing')
          s=s.replace(old,'',1)

          old="if(seasonDay()>=6&&workers>=180&&honey>=22&&cells.length>=65)openSwarmChoice()"
          new="if(seasonDay()>=7&&workers>=150&&honey>=18&&cells.length>=65)openSwarmChoice()"
          if old not in s: raise SystemExit('swarm threshold anchor missing')
          s=s.replace(old,new,1)

          old="if(seasonIndex===3)return `越冬中：${Math.round(workers)}匹が女王を囲み、蜂蜜を使って巣温を保つ。`;if(workers>workerCapacity()*.86)return '群れが巣の容量に近い。⬡ 巣板を増築すると成長余地が広がる。';"
          new="if(seasonIndex===3)return `越冬中：${Math.round(workers)}匹が女王を囲み、蜂蜜を使って巣温を保つ。`;if(seasonIndex===0&&!swarmDoneThisSpring&&!swarmPending){const ready=[workers>=150,honey>=18,cells.length>=65,seasonDay()>=7].filter(Boolean).length;return `🌪 分蜂準備 ${ready}/4：🐝${Math.round(workers)}/150　🍯${Math.round(honey)}/18　⬡${cells.length}/65　春${seasonDay()}/7日。4つそろうと巣分かれ！`;}if(workers>workerCapacity()*.86)return '群れが巣の容量に近い。⬡ 巣板を増築すると成長余地が広がる。';"
          if old not in s: raise SystemExit('nextHint anchor missing')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Validate swarm gameplay
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('honeybee-colony.html').read_text()
          assert '採餌圏（模式図）' not in s
          assert 'workers>=150&&honey>=18&&cells.length>=65' in s
          assert '🌪 分蜂準備 ${ready}/4' in s
          script=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/bee.js').write_text(script)
          print('static assertions passed')
          PY
          node --check /tmp/bee.js
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > bee-swarm-test.cjs <<'JS'
          const fs=require('fs'); const {JSDOM}=require('jsdom');
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          const dom=new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){
            w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},moveTo(){},lineTo(){},bezierCurveTo(){},arc(){},ellipse(){},fill(){},stroke(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},fillText(){},strokeText(){},measureText(t){return {width:String(t).length*7}},createLinearGradient(){return {addColorStop(){}}},set fillStyle(v){},set strokeStyle(v){},set shadowColor(v){},set shadowBlur(v){},set lineWidth(v){},set font(v){},set textAlign(v){},set globalAlpha(v){}});
            w.requestAnimationFrame=()=>0;
          }});
          const w=dom.window,d=w.document,lab=w.__beeLab;
          if(!lab) throw new Error('beeLab missing');
          lab.forceSeason(0); lab.setPressure(0);
          lab.triggerSwarm();
          let s=lab.snapshot();
          if(!s.swarmPending) throw new Error('swarm choice did not open');
          if(!d.getElementById('swarmModal').classList.contains('show')) throw new Error('swarm modal not visible');
          lab.chooseSwarm('new');
          s=lab.snapshot();
          if(s.swarmPending) throw new Error('swarm choice did not resolve');
          if(s.hiveGeneration<2) throw new Error('new-hive branch did not advance lineage');
          console.log('swarm choice path works:',s.hiveGeneration,s.workers);
          JS
          node bee-swarm-test.cjs
      - name: Commit app and remove workflow
        run: |
          git config user.name sshibata
          git config user.email 107645802+shtshbt@users.noreply.github.com
          git add honeybee-colony.html
          git commit -m "Clarify and rebalance spring swarming"
          git rm .github/workflows/honeybee-swarm-clarity.yml
          git commit -m "Remove temporary swarm validation workflow"
          git push origin agent/honeybee-swarm-clarity
