name: Honeybee swarm and crisis balance

on:
  push:
    branches:
      - agent/honeybee-swarm-crisis-balance

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-swarm-crisis-balance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch swarm choice, crisis alerts, and balance
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit('missing anchor: '+a[:120])
              s=s.replace(a,b,1)

          rep('.toast{position:absolute;left:50%;bottom:18px;z-index:8;transform:translate(-50%,10px);opacity:0;transition:.16s;padding:9px 12px;border-radius:999px;background:#ffd765;color:#2b2100;font-weight:950;font-size:12px;pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}',
              '.toast{position:absolute;left:50%;bottom:18px;z-index:8;transform:translate(-50%,10px);opacity:0;transition:.16s;padding:9px 12px;border-radius:999px;background:#ffd765;color:#2b2100;font-weight:950;font-size:12px;pointer-events:none;white-space:nowrap;max-width:88%;overflow:hidden;text-overflow:ellipsis}.bigalert{position:absolute;z-index:18;left:50%;top:92px;transform:translate(-50%,-12px) scale(.96);width:min(620px,90%);padding:18px 20px;border:3px solid #ffb091;border-radius:20px;background:rgba(74,12,8,.94);box-shadow:0 18px 60px #000b;opacity:0;pointer-events:none;transition:.18s;text-align:center}.bigalert.show{opacity:1;transform:translate(-50%,0) scale(1)}.bigalert.safe{border-color:#ffd765;background:rgba(47,35,5,.95)}.bigalert h2{margin:0 0 6px;font-size:27px;color:#fff}.bigalert p{margin:0;font-size:14px;line-height:1.6;font-weight:850;color:#ffe8df}.swarmModal{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(3,10,16,.78);backdrop-filter:blur(5px)}.swarmModal.show{display:flex}.swarmBox{width:min(720px,96%);border:2px solid #ffd765;border-radius:22px;background:#101d2af5;padding:18px;box-shadow:0 22px 70px #000c}.swarmBox h2{font-size:25px;margin:0 0 6px;color:#ffd765;text-align:center}.swarmBox>p{text-align:center;font-size:13px;line-height:1.6;color:#dbe7ef}.swarmChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.swarmChoice{min-height:142px;text-align:left;padding:14px;border:2px solid #4e6579;background:#17293a}.swarmChoice b{display:block;font-size:18px;color:#ffd765;margin-bottom:7px}.swarmChoice span{font-size:12px;line-height:1.65;color:#d9e5ed}.swarmChoice:hover,.swarmChoice:focus{border-color:#ffd765}.hud .lineage{grid-column:1/-1;color:#b8d7ea}',
          )
          rep('@media(max-width:700px){.cards{grid-template-columns:1fr}', '@media(max-width:700px){.swarmChoices{grid-template-columns:1fr}.bigalert{top:62px}.bigalert h2{font-size:21px}.cards{grid-template-columns:1fr}')

          rep('<div id="hudCells">⬡ 73</div><div id="hudSeason">🌿 春</div><div class="danger" id="hudDanger">', '<div id="hudCells">⬡ 73</div><div id="hudSeason">🌿 春</div><div class="lineage" id="hudLineage">🏠 1年目 ｜ 👑 1代目</div><div class="danger" id="hudDanger">')
          rep('<div class="toast" id="toast"></div></section>', '<div class="toast" id="toast"></div><div class="bigalert" id="bigAlert"><h2 id="bigAlertTitle"></h2><p id="bigAlertBody"></p></div><div class="swarmModal" id="swarmModal"><div class="swarmBox"><h2>🌪 分蜂！ どちらの巣を追う？</h2><p>群れが十分に育った。旧女王と働き蜂の一部が新天地へ出発し、元の巣には新女王候補と蓄えが残る。</p><div class="swarmChoices"><button class="swarmChoice" id="followSwarm"><b>🌳 旧女王についていく</b><span>働き蜂の約半数と新天地へ。巣板・貯蜜・育児をほぼゼロから作り直す「開拓」ルート。</span></button><button class="swarmChoice" id="stayOld"><b>🏠 元の巣に残る</b><span>巣板・蜂蜜・育児は残るが、働き蜂の約半数が去る。新女王が成熟して産卵を始めるまで待つ。</span></button></div></div></div></section>')

          rep("simHours=0,workers=120,heatDamaged=0,colonyAlive=true,queenAlive=true,honey=28", "simHours=0,workers=120,heatDamaged=0,colonyAlive=true,queenAlive=true,queenMode='mated',queenDelay=0,year=1,queenGeneration=1,hiveGeneration=1,swarmPending=false,swarmDoneThisSpring=false,noticeTimer=0,honey=28")
          rep("const seasons=[{icon:'🌿',name:'春',forage:.92,lay:1.8,death:1/(70*24)},{icon:'☀️',name:'夏',forage:1,lay:1.35,death:1/(60*24)},{icon:'🍂',name:'秋',forage:.62,lay:.28,death:1/(28*24)},{icon:'❄️',name:'冬',forage:.025,lay:.01,death:1/(120*24)}]", "const seasons=[{icon:'🌿',name:'春',forage:.88,lay:.55,death:1/(46*24)},{icon:'☀️',name:'夏',forage:1,lay:.32,death:1/(36*24)},{icon:'🍂',name:'秋',forage:.52,lay:.06,death:1/(25*24)},{icon:'❄️',name:'冬',forage:.015,lay:0,death:1/(110*24)}]")
          rep("function workerCapacity(){return Math.max(180,cells.length*6)}function broodCapacity(){return Math.max(42,cells.length*1.65)}", "function workerCapacity(){return Math.max(120,cells.length*2.8)}function broodCapacity(){return Math.max(28,cells.length*.95)}")
          rep("workers=120;heatDamaged=0;colonyAlive=true;queenAlive=true;honey=28;", "workers=120;heatDamaged=0;colonyAlive=true;queenAlive=true;queenMode='mated';queenDelay=0;year=1;queenGeneration=1;hiveGeneration=1;swarmPending=false;swarmDoneThisSpring=false;honey=28;")
          rep("flowers=[{x:125,y:115,n:90,q:.72},{x:270,y:165,n:78,q:.9}]", "flowers=[{x:125,y:115,n:62,q:.68},{x:270,y:165,n:50,q:.78}]")

          rep("function logEvent(s){eventLog.unshift({t:stamp(),s});eventLog=eventLog.slice(0,6)}function toast(s,log=false)", "function logEvent(s){eventLog.unshift({t:stamp(),s});eventLog=eventLog.slice(0,6)}function bigNotice(title,body,kind='danger',ms=3000){const el=$('bigAlert');$('bigAlertTitle').textContent=title;$('bigAlertBody').textContent=body;el.classList.toggle('safe',kind==='safe');el.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el.classList.remove('show'),ms)}function toast(s,log=false)")

          rep("function resourceQuality(){return clamp((honey+nectar*.18+12)/48,.25,1.25)*clamp((pollen+8)/28,.25,1.2)}", "function resourceQuality(){return clamp((honey+nectar*.12)/32,.06,1.15)*clamp((pollen+2)/16,.06,1.15)}")
          rep("function collapseColony(reason){if(!colonyAlive)return;", "function collapseColony(reason){if(!colonyAlive)return;bigNotice('💀 コロニー崩壊',reason,'danger',6000);")

          old="while(seasonHour>=SEASON_H){seasonHour-=SEASON_H;seasonIndex=(seasonIndex+1)%4;const ns=seasons[seasonIndex];if(seasonIndex===3){toast('❄️ 越冬群へ。働き蜂が減り、女王を囲んで集団越冬する。',true)}else if(seasonIndex===0){toast('🌿 春。女王の産卵と育児が再び活発になる。',true)}else toast(`${ns.icon} ${ns.name}になった`,true)}"
          new="while(seasonHour>=SEASON_H){seasonHour-=SEASON_H;seasonIndex=(seasonIndex+1)%4;const ns=seasons[seasonIndex];if(seasonIndex===3){if(!['calm','collapsed'].includes(threat.mode)||threat.raidPending>0){threat.mode='calm';threat.hornets=[];threat.raidPending=0;threat.marked=false;logEvent('❄️ 冬入り。スズメバチの活動は休止')}toast('❄️ 越冬群へ。働き蜂が減り、女王を囲んで集団越冬する。',true)}else if(seasonIndex===0){year++;swarmDoneThisSpring=false;toast('🌿 春。女王の産卵と育児が再び活発になる。',true)}else toast(`${ns.icon} ${ns.name}になった`,true)}if(queenMode==='virgin'){queenDelay-=h;if(queenDelay<=0){queenMode='mated';queenDelay=0;bigNotice('👑 新女王が産卵を開始','女王交代が完了。これから新しい卵が増え始める。','safe',3200);logEvent('👑 新女王が産卵を開始')}}"
          rep(old,new)

          rep("take=Math.min(f.n,h*.045*foragePotential*share);f.n=Math.max(12,f.n-take*.04);", "take=Math.min(f.n,h*.028*foragePotential*share);f.n=Math.max(2,f.n-take*.055);")
          rep("const regen=seasonIndex===0?.030:seasonIndex===1?.018:seasonIndex===2?.006:0;", "const regen=seasonIndex===0?.020:seasonIndex===1?.012:seasonIndex===2?.003:0;")
          rep("const broodDemand=larvae*.0055;honey-=h*(workers*.0016+broodDemand);pollen-=h*larvae*.0030;", "const broodDemand=larvae*.007;honey-=h*(workers*.0024+broodDemand);pollen-=h*larvae*.0040;")
          rep("const lay=s.lay*space*food*(temp>30.5&&temp<36.8?1:.25);", "const lay=(queenMode==='mated'?s.lay:0)*space*food*(temp>30.5&&temp<36.8?1:.25);")
          rep("const eggOut=Math.min(eggs,eggs*h/48),larvaOut=Math.min(larvae,larvae*h/96*clamp(nurseQ,.25,1.1)),pupaOut=Math.min(pupae,pupae*h/168);const larvaLoss=Math.min(larvae,larvae*h*(nurseQ<.5?.0018:.00025));", "const eggOut=Math.min(eggs,eggs*h/48),larvaOut=Math.min(larvae,larvae*h/96*clamp(nurseQ,.18,1.05)),pupaOut=Math.min(pupae,pupae*h/168*clamp(food,.15,1));const larvaLoss=Math.min(larvae,larvae*h*(nurseQ<.45?.0032:.00035));")
          rep("let deaths=workers*s.death*h;if(seasonIndex===2)", "let deaths=workers*s.death*h;if(honey<2)deaths+=workers*h*.0015;if(pollen<.7&&seasonIndex!==3)deaths+=workers*h*.0007;if(seasonIndex===2)")

          anchor="function syncCellDisplay(){"
          swarm_code="""function openSwarmChoice(){if(swarmPending||swarmDoneThisSpring||!colonyAlive)return;swarmPending=true;running=false;$('play').textContent='▶ 再生';$('swarmModal').classList.add('show');bigNotice('🌪 分蜂が始まる！','旧女王の新巣か、新女王が継ぐ元巣か。追跡する群れを選ぼう。','safe',5000);logEvent('🌪 分蜂。追跡する巣を選ぶ')}function maybeSwarm(){if(seasonIndex!==0||swarmPending||swarmDoneThisSpring||queenMode!=='mated'||threat.mode!=='calm')return;if(seasonDay()>=6&&workers>=180&&honey>=22&&cells.length>=65)openSwarmChoice()}function chooseSwarm(which){if(!swarmPending)return;const before=workers,depart=Math.max(45,Math.round(before*.46)),damagedRatio=before?heatDamaged/before:0;if(which==='new'){workers=depart;heatDamaged=Math.min(workers,Math.round(workers*damagedRatio));honey=clamp(honey*.14,5,11);pollen=clamp(pollen*.12,3,8);nectar=clamp(nectar*.10,1,5);eggs=0;larvae=0;pupae=0;wax=10;cells=[];for(let q=-3;q<=3;q++)for(let r=-2;r<=3;r++)if(Math.abs(q)+Math.abs(r)<6)addCell(q,r);buildTargets=[];hiveGeneration++;queenMode='mated';queenAlive=true;bigNotice('🌳 新しい巣へ！',`旧女王と${Math.round(workers)}匹で開拓開始。巣板も食料も少ない。`,'safe',4200);logEvent('🌳 分蜂群について新巣へ移動')}else{workers=Math.max(0,before-depart);heatDamaged=Math.min(workers,Math.round(workers*damagedRatio));honey*=.82;queenGeneration++;queenMode='virgin';queenDelay=96;queenAlive=true;bigNotice('🏠 元の巣に残った',`働き蜂${depart}匹が旧女王と出発。新女王の成熟を待つ。`,'safe',4200);logEvent('🏠 元巣を選択。新女王へ交代')}swarmDoneThisSpring=true;swarmPending=false;$('swarmModal').classList.remove('show');syncCellDisplay();update()}"""
          if anchor not in s: raise SystemExit('missing swarm insertion')
          s=s.replace(anchor,swarm_code+anchor,1)

          rep("hornetStep(h,rr);syncCellDisplay();", "maybeSwarm();if(!swarmPending)hornetStep(h,rr);syncCellDisplay();")

          rep("function triggerScout(manual=false){if(!colonyAlive){toast('💀 コロニーは崩壊している');return}", "function triggerScout(manual=false){if(!colonyAlive){toast('💀 コロニーは崩壊している');return}if(seasonIndex===3){toast('❄️ 冬はスズメバチの活動を休止している');return}")
          rep("if(manual)toast('👹 スズメバチの偵察！',true)}", "bigNotice('👹 スズメバチ偵察！','巣口へ接近中。十分な健康な防衛蜂が集まれるか？','danger',3200);if(manual)toast('👹 スズメバチの偵察！',true)}")
          rep("toast('⚠ 偵察蜂が逃げた。巣を覚えられたかも…',true)}", "bigNotice('⚠️ 偵察蜂を逃した！','巣を覚えられた。本格襲来につながる危険が高い。','danger',4200);toast('⚠ 偵察蜂が逃げた。巣を覚えられたかも…',true)}")
          rep("toast(`👹 ${n}匹が襲来！`,true)}", "bigNotice('🚨 スズメバチ襲来！',`${n}匹が巣へ殺到。働き蜂だけでなく育児中の蜂も危険！`,'danger',4600);toast(`👹 ${n}匹が襲来！`,true)}")

          old="function hornetStep(h,rr){const pressure=+$('pressure').value/100,seasonThreat=seasonIndex===2?1.6:seasonIndex===1?.85:seasonIndex===3?.10:.35;if(threat.mode==='calm'&&Math.random()<h*.00028*pressure*seasonThreat)triggerScout(false);"
          new="function hornetStep(h,rr){if(seasonIndex===3)return;const pressure=+$('pressure').value/100,seasonThreat=seasonIndex===2?1.8:seasonIndex===1?.70:.12;if(threat.mode==='calm'&&Math.random()<h*.00034*pressure*seasonThreat)triggerScout(false);"
          rep(old,new)

          old="if(x<610){const defense=rr.guard/Math.max(1,workers);if(workers>75&&defense>.13){threat.mode='ball';threat.timer=0;threat.ballTemp=36;threat.ballLosses=0;threat.ballEnergy=0;threat.ballDamage=0;toast('🔥 蜂球！ みんなで包んだ',true)}else if(threat.timer>34)markNest()}"
          new="if(x<610&&!threat.scoutChecked){threat.scoutChecked=true;const healthy=Math.max(0,workers-heatDamaged),guardFrac=rr.guard/Math.max(1,workers),honeyQ=clamp(honey/40,0,1),damageFrac=heatDamaged/Math.max(1,workers);const pBall=clamp(.08+.55*clamp(healthy/300,0,1)+.9*clamp(guardFrac-.20,0,.25)+.12*clamp((healthy-200)/300,0,1)+.10*honeyQ-.28*damageFrac,.12,.94);threat.scoutChance=pBall;if(Math.random()<pBall){threat.mode='ball';threat.timer=0;threat.ballTemp=36;threat.ballLosses=0;threat.ballEnergy=0;threat.ballDamage=0;bigNotice('🔥 熱殺蜂球！',`偵察蜂を包囲。成功率の目安 ${Math.round(pBall*100)}%。多数の蜂が熱ダメージを負う。`,'safe',3600);toast('🔥 蜂球！ みんなで包んだ',true)}else markNest()}"
          rep(old,new)
          rep("threat.ballDamage=0;if(manual)", "threat.ballDamage=0;threat.scoutChecked=false;threat.scoutChance=0;if(manual)")

          rep("function startRaid(){threat.mode='raid';threat.timer=0;threat.losses=0;const n=3+Math.floor(+$('pressure').value/23);", "function startRaid(){threat.mode='raid';threat.timer=0;threat.losses=0;threat.broodLoss=0;const n=6+Math.floor(+$('pressure').value/17);")
          old="const strength=threat.hornets.length*42,def=rr.guard*1.65+workers*.22;if(def>strength)"
          new="const healthy=Math.max(0,workers-heatDamaged),strength=threat.hornets.length*55,def=rr.guard*1.45+healthy*.12;if(def>strength)"
          rep(old,new)
          rep("const lost=Math.min(workers,Math.max(0,h*(strength-def)*.012));if(lost>0)", "const breach=Math.max(0,strength-def),lost=Math.min(workers,Math.max(0,h*breach*.018));if(breach>0){const broodHit=Math.min(larvae+pupae,h*breach*.006);const fromLarva=Math.min(larvae,broodHit*.65);larvae-=fromLarva;pupae=Math.max(0,pupae-(broodHit-fromLarva));threat.broodLoss=(threat.broodLoss||0)+broodHit;honey=Math.max(0,honey-h*breach*.003)}if(lost>0)")
          rep("toast(`⚠ 襲来終了。働き蜂 -${Math.round(threat.losses)}`,true)", "bigNotice('⚠️ 襲来がおさまった',`働き蜂 -${Math.round(threat.losses)} / 育児個体 -${Math.round(threat.broodLoss||0)}。群れは大きく消耗した。`,'danger',4200);toast(`⚠ 襲来終了。働き蜂 -${Math.round(threat.losses)}`,true)")

          rep("$('hudSeason').textContent=`${s.icon} ${s.name}`;", "$('hudSeason').textContent=`${s.icon} ${s.name}`;$('hudLineage').textContent=`🏠 ${year}年目・巣${hiveGeneration} ｜ 👑 ${queenGeneration}代目${queenMode==='virgin'?'（未交尾）':''}`;")
          rep("const es={calm:'平穏。秋ほど自然に偵察蜂が来やすくなる。'", "$('scout').disabled=seasonIndex===3||!colonyAlive;$('scout').textContent=seasonIndex===3?'❄ 冬は休止':'⚡ 偵察を呼ぶ';const es={calm:seasonIndex===3?'❄ 冬。スズメバチの活動は休止中。':'平穏。秋ほど自然に偵察蜂が来やすくなる。'")
          rep("scout:'👹 偵察蜂が巣口へ接近中。防衛蜂が集まる。'", "scout:`👹 偵察蜂が巣口へ接近中。蜂球成立は確定ではない。${threat.scoutChance?` 成功目安 ${Math.round(threat.scoutChance*100)}%`:''}`")
          rep("raid:`👹 本格襲来！ ${threat.hornets.length}匹 / 被害 ${Math.round(threat.losses)}匹`", "raid:`🚨 本格襲来！ ${threat.hornets.length}匹 / 働き蜂被害 ${Math.round(threat.losses)} / 育児被害 ${Math.round(threat.broodLoss||0)}`")
          rep("c.fillText(`季節　${seasons[seasonIndex].icon}${seasons[seasonIndex].name} ${seasonDay()}日目 / 22日`,x+14,y+112);", "c.fillText(`季節　${seasons[seasonIndex].icon}${seasons[seasonIndex].name} ${seasonDay()}日目 / 22日　🏠${year}年目`,x+14,y+112);")
          rep("if(threat.mode!=='calm')return 'スズメバチ警戒中。防衛蜂が巣口へ集まっている。';", "if(swarmPending)return '🌪 分蜂！ どちらの群れを追跡するか選ぼう。';if(threat.mode!=='calm')return 'スズメバチ警戒中。偵察を逃すと本格襲来へ進む。';")

          rep("$('reset').onclick=reset;$('scout').onclick=()=>triggerScout(true);", "$('reset').onclick=reset;$('scout').onclick=()=>triggerScout(true);$('followSwarm').onclick=()=>chooseSwarm('new');$('stayOld').onclick=()=>chooseSwarm('old');")
          rep("snapshot:()=>({workers:Math.round(workers)", "snapshot:()=>({workers:Math.round(workers),year,queenGeneration,hiveGeneration,queenMode,swarmPending")
          rep("defenseLosses:Math.round(threat.losses)}),", "defenseLosses:Math.round(threat.losses),broodLosses:Math.round(threat.broodLoss||0),scoutChance:threat.scoutChance||0}),")
          rep("setTool:t=>{tool=t}};", "setTool:t=>{tool=t},triggerSwarm:()=>openSwarmChoice(),chooseSwarm,forceSeason:i=>{seasonIndex=i;seasonHour=0;if(i===3){threat.mode='calm';threat.hornets=[];threat.raidPending=0}update()}};")

          if "seasonIndex===3?.10" in s or "workers>75&&defense>.13" in s:
              raise SystemExit('old hornet logic remains')
          p.write_text(s)
          PY
          python /tmp/patch.py
      - name: Validate markup and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          s=Path('honeybee-colony.html').read_text()
          P().feed(s)
          for token in ['swarmModal','followSwarm','stayOld','bigAlert','swarmPending','scoutChance','冬は休止','queenMode']:
              assert token in s, token
          a=s.index('<script>')+8; b=s.index('</script>',a)
          Path('/tmp/bee.js').write_text(s[a:b])
          PY
          node --check /tmp/bee.js
      - name: Dynamic behavior tests
        shell: bash
        run: |
          npm install --no-save jsdom@26 >/dev/null 2>&1
          cat > bee-balance-test.mjs <<'JS'
          import fs from 'fs';
          import {JSDOM} from 'jsdom';
          const html=fs.readFileSync('honeybee-colony.html','utf8');
          function make(){return new JSDOM(html,{runScripts:'dangerously',pretendToBeVisual:true,beforeParse(w){
            w.HTMLCanvasElement.prototype.getContext=()=>({clearRect(){},fillRect(){},strokeRect(){},beginPath(){},closePath(){},fill(){},stroke(){},moveTo(){},lineTo(){},arc(){},ellipse(){},bezierCurveTo(){},fillText(){},save(){},restore(){},translate(){},rotate(){},scale(){},setLineDash(){},createLinearGradient(){return{addColorStop(){}}},measureText(t){return{width:String(t).length*7}},set fillStyle(v){},set strokeStyle(v){},set lineWidth(v){},set font(v){},set textAlign(v){}});
            w.requestAnimationFrame=()=>0;
          }}})}
          let dom=make(),lab=dom.window.__beeLab;
          if(!lab)throw new Error('lab missing');
          lab.setPressure(0); lab.stepHours(24*40); let s=lab.snapshot();
          if(s.workers>215)throw new Error('no-action colony still explodes '+JSON.stringify(s));
          if(s.workers<20)throw new Error('baseline balance too harsh '+JSON.stringify(s));

          dom=make();lab=dom.window.__beeLab;lab.triggerSwarm();
          if(!lab.snapshot().swarmPending)throw new Error('swarm choice not opened');
          if(!dom.window.document.getElementById('swarmModal').classList.contains('show'))throw new Error('swarm modal not visible');
          const before=lab.snapshot();lab.chooseSwarm('old');s=lab.snapshot();
          if(s.swarmPending||s.queenMode!=='virgin'||s.workers>=before.workers)throw new Error('old-hive choice failed '+JSON.stringify(s));

          dom=make();lab=dom.window.__beeLab;lab.forceSeason(3);lab.triggerScout();s=lab.snapshot();
          if(s.threat!=='calm')throw new Error('winter scout was allowed '+JSON.stringify(s));
          if(!dom.window.document.getElementById('scout').disabled)throw new Error('winter scout button enabled');

          dom=make();lab=dom.window.__beeLab;lab.setPressure(100);dom.window.Math.random=()=>.99;lab.triggerScout();
          if(!dom.window.document.getElementById('bigAlert').classList.contains('show'))throw new Error('large scout alert missing');
          for(let i=0;i<45;i++)lab.stepHours(1);s=lab.snapshot();
          if(!['marked','raid','collapsed','recovered'].includes(s.threat))throw new Error('forced failed scout did not escalate '+JSON.stringify(s));
          let min=s.workers;for(let i=0;i<80&&lab.snapshot().colonyAlive;i++){lab.stepHours(1);min=Math.min(min,lab.snapshot().workers)}s=lab.snapshot();
          if(s.colonyAlive && s.defenseLosses<15)throw new Error('failed scout raid still low consequence '+JSON.stringify(s));
          console.log('PASS',JSON.stringify({baseline:s,raidMin:min}));
          JS
          node bee-balance-test.mjs
