name: Honeybee threat visibility
on:
  push:
    branches: [agent/honeybee-threat-visibility]
jobs:
  patch-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-threat-visibility
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch hornet visibility and pacing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('honeybee-colony.html')
          s=p.read_text()
          old=".bigalert{position:absolute;z-index:18;left:50%;top:92px;transform:translate(-50%,-12px) scale(.96);width:min(620px,90%);padding:18px 20px;border:3px solid #ffb091;border-radius:20px;background:rgba(74,12,8,.94);box-shadow:0 18px 60px #000b;opacity:0;pointer-events:none;transition:.18s;text-align:center}.bigalert.show{opacity:1;transform:translate(-50%,0) scale(1)}.bigalert.safe{border-color:#ffd765;background:rgba(47,35,5,.95)}.bigalert h2{margin:0 0 6px;font-size:27px;color:#fff}.bigalert p{margin:0;font-size:14px;line-height:1.6;font-weight:850;color:#ffe8df}.bigalert button{display:none;margin:12px auto 0;min-width:150px;background:#ffd765;color:#2b2100;border-color:#ffd765}.bigalert.hold{pointer-events:auto}.bigalert.hold button{display:block}"
          new=".bigalert{position:absolute;z-index:18;left:10px;right:182px;top:8px;transform:translateY(-8px);width:auto;padding:9px 12px;border:2px solid #ffb091;border-radius:13px;background:rgba(74,12,8,.91);box-shadow:0 8px 28px #0008;opacity:0;pointer-events:none;transition:.18s;text-align:left}.bigalert.show{opacity:1;transform:translateY(0)}.bigalert.safe{border-color:#ffd765;background:rgba(47,35,5,.93)}.bigalert h2{margin:0 0 2px;font-size:18px;color:#fff}.bigalert p{margin:0;font-size:11px;line-height:1.45;font-weight:850;color:#ffe8df}.bigalert button{display:none;margin:6px 0 0;min-width:120px;min-height:34px;background:#ffd765;color:#2b2100;border-color:#ffd765}.bigalert.hold{pointer-events:auto}.bigalert.hold button{display:inline-block}"
          assert old in s
          s=s.replace(old,new)
          old="@media(max-width:700px){.swarmChoices{grid-template-columns:1fr}.bigalert{top:62px}.bigalert h2{font-size:21px}"
          new="@media(max-width:700px){.swarmChoices{grid-template-columns:1fr}.bigalert{top:6px;left:6px;right:146px;padding:7px 9px}.bigalert h2{font-size:15px}.bigalert p{font-size:10px}.bigalert button{min-height:31px;padding:4px 8px}"
          assert old in s
          s=s.replace(old,new)
          old="threat.hornets=[{x:955,y:120}];"
          new="threat.hornets=[{x:880,y:138}];"
          assert old in s
          s=s.replace(old,new)
          old="holdNotice('👹 スズメバチ偵察！','巣口へ接近中。状況を確認してから「続ける」で防衛へ進む。危機中は速度も自動で落ちる。','danger')"
          new="holdNotice('👹 スズメバチ偵察！','画面右上に偵察蜂がいる。見つけてから「続ける」→ゆっくり巣口へ近づく。','danger')"
          assert old in s
          s=s.replace(old,new)
          old="function startRaid(){threat.mode='raid';threat.timer=0;threat.losses=0;threat.broodLoss=0;const n=6+Math.floor(+$('pressure').value/17);threat.hornets=Array.from({length:n},(_,i)=>({x:920+i*10,y:120+i*14}));holdNotice('🚨 スズメバチ襲来！',`${n}匹が巣へ殺到。働き蜂・育児個体・貯蜜が危険。「続ける」で戦闘が始まる。`,'danger');toast(`👹 ${n}匹が襲来！`,true)}"
          new="function startRaid(){threat.mode='raid';threat.timer=-18;threat.losses=0;threat.broodLoss=0;const n=6+Math.floor(+$('pressure').value/17);threat.hornets=Array.from({length:n},(_,i)=>({x:900+(i%3)*24,y:88+(i%4)*27,seed:i*.91}));holdNotice('🚨 スズメバチの大群！',`${n}匹が画面右から編隊で接近中。まず姿を確認し、「続ける」で巣口への突入を見る。接触するまで被害は始まらない。`,'danger');toast(`👹 ${n}匹の大群が接近！`,true)}"
          assert old in s
          s=s.replace(old,new)
          old="threat.timer+=h;const x=955-Math.min(390,threat.timer*13);threat.hornets[0].x=x;threat.hornets[0].y=150+Math.sin(threat.timer*.8)*15;"
          new="threat.timer+=h;const x=880-Math.min(270,threat.timer*8);threat.hornets[0].x=x;threat.hornets[0].y=145+Math.sin(threat.timer*.55)*18;"
          assert old in s
          s=s.replace(old,new)
          old="else if(threat.mode==='raid'){threat.timer+=h;const healthy=Math.max(0,workers-heatDamaged),strength=threat.hornets.length*55,def=rr.guard*1.45+healthy*.12;"
          new="else if(threat.mode==='raid'){threat.timer+=h;if(threat.timer<0)return;const healthy=Math.max(0,workers-heatDamaged),strength=threat.hornets.length*55,def=rr.guard*1.45+healthy*.12;"
          assert old in s
          s=s.replace(old,new)
          old="raid:`🚨 巣口で防衛中！ スズメバチ ${threat.hornets.length}匹 / 働き蜂被害 ${Math.round(threat.losses)} / 育児被害 ${Math.round(threat.broodLoss||0)}`"
          new="raid:threat.timer<0?`🚨 スズメバチ ${threat.hornets.length}匹が接近中… 接触まで ${Math.max(0,Math.ceil(-threat.timer/6))}秒ほど`:`🚨 巣口で防衛中！ スズメバチ ${threat.hornets.length}匹 / 働き蜂被害 ${Math.round(threat.losses)} / 育児被害 ${Math.round(threat.broodLoss||0)}`"
          assert old in s
          s=s.replace(old,new)
          old="function drawThreat(){for(const [i,h] of threat.hornets.entries()){let x=h.x,y=h.y;if(threat.mode==='raid'){x=820-Math.min(250,threat.timer*9)+i*24;y=155+i*18+Math.sin(threat.timer+i)*9}if(threat.mode==='ball'){x=565;y=198}c.fillStyle='#ee8c34';c.beginPath();c.ellipse(x,y,13,8,0,0,TAU);c.fill();c.fillStyle='#21150d';c.fillRect(x-5,y-7,4,14);c.fillRect(x+3,y-7,4,14);c.fillStyle='rgba(235,245,255,.65)';c.beginPath();c.ellipse(x-5,y-10,8,4,-.35,0,TAU);c.ellipse(x-5,y+10,8,4,.35,0,TAU);c.fill()}if(threat.mode==='ball'){for(let i=0;i<32;i++){const a=i/32*TAU+performance.now()/700,r=17+(i%4)*3;drawBee(565+Math.cos(a)*r,198+Math.sin(a)*r,.55,a)}c.fillStyle='#ff684d';c.font='bold 16px system-ui';c.fillText(`${threat.ballTemp.toFixed(1)}℃`,585,205)}}"
          new="function drawThreat(){const now=performance.now()/1000;for(const [i,h] of threat.hornets.entries()){let x=h.x,y=h.y,scale=threat.mode==='scout'?1.35:1.55;if(threat.mode==='raid'){if(threat.timer<0){const p=clamp((threat.timer+18)/18,0,1),lane=(i%3)-1;x=930-p*338+lane*22;y=78+(i%4)*31+Math.sin(now*5+(h.seed||i))*8;if(i<3){c.strokeStyle='rgba(255,190,70,.72)';c.lineWidth=3;c.beginPath();c.moveTo(x+68,y);c.lineTo(x+24,y);c.stroke()}}else{x=565+Math.sin(now*3.2+i*.8)*38+(i%3)*9;y=202+Math.cos(now*4+i)*26+(i%4-1.5)*5}}if(threat.mode==='ball'){x=565;y=198;scale=1}c.save();c.shadowColor='#fff2a8';c.shadowBlur=threat.mode==='raid'||threat.mode==='scout'?8:0;c.fillStyle='#ee8c34';c.strokeStyle='#130b06';c.lineWidth=2.2;c.beginPath();c.ellipse(x,y,13*scale,8*scale,0,0,TAU);c.fill();c.stroke();c.fillStyle='#21150d';c.fillRect(x-5*scale,y-7*scale,4*scale,14*scale);c.fillRect(x+3*scale,y-7*scale,4*scale,14*scale);c.fillStyle='rgba(235,245,255,.78)';c.beginPath();c.ellipse(x-5*scale,y-10*scale,8*scale,4*scale,-.35,0,TAU);c.ellipse(x-5*scale,y+10*scale,8*scale,4*scale,.35,0,TAU);c.fill();c.restore();if((threat.mode==='scout'&&i===0)||(threat.mode==='raid'&&i===0&&threat.timer<0)){c.fillStyle='#fff4bd';c.strokeStyle='#35170b';c.lineWidth=3;c.font='900 15px system-ui';c.strokeText(threat.mode==='scout'?'👹 偵察スズメバチ':'👹 スズメバチ大群 →',x-70,y-28);c.fillText(threat.mode==='scout'?'👹 偵察スズメバチ':'👹 スズメバチ大群 →',x-70,y-28)}}if(threat.mode==='ball'){for(let i=0;i<32;i++){const a=i/32*TAU+performance.now()/700,r=17+(i%4)*3;drawBee(565+Math.cos(a)*r,198+Math.sin(a)*r,.55,a)}c.fillStyle='#ff684d';c.font='bold 16px system-ui';c.fillText(`${threat.ballTemp.toFixed(1)}℃`,585,205)}}"
          assert old in s
          s=s.replace(old,new)
          old="if(threat.mode==='raid'){c.save();c.fillStyle='rgba(90,0,0,.14)';c.fillRect(400,140,190,115);c.strokeStyle='rgba(255,95,65,.75)';c.lineWidth=3;c.strokeRect(505,170,74,62);c.fillStyle='#ffcabd';c.font='900 15px system-ui';c.fillText('🚨 巣口で攻防中！',418,160);c.restore()}"
          new="if(threat.mode==='raid'){c.save();if(threat.timer<0){c.fillStyle='rgba(255,174,40,.10)';c.fillRect(400,55,560,190);c.fillStyle='#fff1ad';c.font='900 18px system-ui';c.fillText('🚨 大群接近中 — まだ戦闘前',430,82)}else{c.fillStyle='rgba(90,0,0,.14)';c.fillRect(400,140,190,115);c.strokeStyle='rgba(255,95,65,.75)';c.lineWidth=3;c.strokeRect(505,170,74,62);c.fillStyle='#ffcabd';c.font='900 15px system-ui';c.fillText('🚨 巣口で攻防中！',418,160)}c.restore()}"
          assert old in s
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('honeybee-colony.html').read_text()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          Path('/tmp/bee.js').write_text(js)
          assert "threat.timer=-18" in s
          assert "if(threat.timer<0)return" in s
          assert "大群接近中 — まだ戦闘前" in s
          assert "偵察スズメバチ" in s
          assert "right:182px;top:8px" in s
          PY
          node --check /tmp/bee.js
      - name: Commit app and remove workflow
        run: |
          rm .github/workflows/honeybee-threat-visibility.yml
          git config user.name "sshibata"
          git config user.email "107645802+shtshbt@users.noreply.github.com"
          git add honeybee-colony.html .github/workflows/honeybee-threat-visibility.yml
          git commit -m "Improve hornet threat visibility and staging"
          git push origin HEAD:agent/honeybee-threat-visibility
