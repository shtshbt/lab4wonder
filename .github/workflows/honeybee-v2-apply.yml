name: Honeybee v2 apply

on:
  push:
    branches:
      - agent/honeybee-colony-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/honeybee-colony-v2
      - name: Apply and validate honeybee v2
        shell: bash
        run: |
          set -euo pipefail
          target='d98e5b5ed18ed353e45a40e7e8bb53a029c35af0db758e303170a2b538b06eb2'
          current="$(sha256sum honeybee-colony.html | awk '{print $1}')"
          if [[ "$current" == "$target" ]]; then
            echo 'Honeybee v2 already applied.'
            exit 0
          fi
          echo '' | base64 -d | gzip -d > honeybee-colony.html
          got="$(sha256sum honeybee-colony.html | awk '{print $1}')"
          [[ "$got" == "$target" ]]
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser): pass
          P().feed(Path('honeybee-colony.html').read_text())
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('honeybee-colony.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>',s)
          assert m
          Path('/tmp/honeybee.js').write_text(m.group(1))
          for needle in ['id="speed"','🐝 コロニーのいま','冬蜂','workerCapacity','rThermo']:
              assert needle in s, needle
          PY
          node --check /tmp/honeybee.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add honeybee-colony.html
          git commit -m 'Refine honeybee colony seasons and controls'
          git push origin HEAD:agent/honeybee-colony-v2
