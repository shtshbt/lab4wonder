name: Inspect fossil atlas
on:
  push:
    branches:
      - agent/fossil-atlas-integration
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect atlas hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('fossil-formation.html').read_text(encoding='utf-8')
          for needle in ['const DATA=','const CFG=','const explore=','function explore','r60-atlas-scan','発掘する','name":"三葉虫','name":"アンモナイト','name":"魚','name":"葉','name":"足跡','group":"']:
              print('\n###',needle)
              pos=0; n=0
              while True:
                  i=s.find(needle,pos)
                  if i<0 or n>=10: break
                  print(s[max(0,i-1200):min(len(s),i+3600)].replace('\n','\\n'))
                  print('\n---')
                  pos=i+len(needle); n+=1
          PY
