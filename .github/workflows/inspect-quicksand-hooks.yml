name: Inspect quicksand hooks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect relevant quicksand code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('quicksand-simulator.html').read_text(encoding='utf-8')
          for key in ['function drawQsFigure','const Q=','r76-quicksand-direct-interaction','r77-quicksand-visible-feedback','applyStirImpulse','function drawQuicksand']:
              i=s.find(key)
              print('\n===',key,'index',i,'===')
              if i>=0: print(s[max(0,i-1200):i+5000])
          PY
