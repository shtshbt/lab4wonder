name: Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify site package
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f explore.html
          test -f kids-index.html
          html_count="$(find . -maxdepth 1 -type f -name '*.html' | wc -l)"
          if [[ "$html_count" -ne 187 ]]; then
            echo "Expected 187 HTML files, found $html_count." >&2
            exit 1
          fi

      - name: Stamp offline cache version
        shell: bash
        run: |
          set -euo pipefail
          test -f sw.js
          test -f manifest.webmanifest
          test -f icon-192.png
          test -f icon-512.png
          test -f apple-touch-icon.png
          build_id="${GITHUB_SHA:0:12}"
          sed -i "s/__BUILD_ID__/${build_id}/" sw.js
          grep -q "lab4wonder-${build_id}" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4