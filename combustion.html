<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>燃焼・火を育てて消すラボ</title><link rel="stylesheet" href="lab4wonder_v1_1.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:920px;margin:auto;padding:12px 12px 100px;background:#07131f;color:#eff7ff;font-family:system-ui,"Yu Gothic",sans-serif}.head,.tools,.metrics{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}p{line-height:1.65}.stage{position:relative;border:2px solid #405d76;border-radius:20px;overflow:hidden;background:#101820}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.prompt{position:absolute;top:9px;left:50%;transform:translateX(-50%);background:#07131fe8;padding:8px 13px;border-radius:999px;font-weight:900;white-space:nowrap}.tools{margin:10px 0}.tools button,.head button{min-height:48px;border:1px solid #47657e;border-radius:13px;background:#172e44;color:#fff;padding:8px 13px;font-weight:900}.tools button.on{background:#ffd65a;color:#251d00}.metrics span{padding:8px 10px;border-radius:12px;background:#10263a}.metrics #stateM{flex:1;border:2px solid #ffd65a;font-weight:900}.card{margin-top:10px;padding:12px;border:1px solid #38556e;border-radius:15px;background:#102337}.legend{display:flex;gap:7px;flex-wrap:wrap}.legend span{padding:5px 9px;border-radius:999px}.fuel{background:#9b6437}.air{background:#64c7e9;color:#092631}.fire{background:#ff663d}.smoke{background:#68717b}.water{background:#397dc2}
</style></head><body>
<header class="head"><div><h1>🔥 燃焼・火を育てて消すラボ</h1><p>画面へ燃料・空気・水・壁を直接置こう。火に必要な3つがそろうかどうかで、炎と煙が大きく変わる。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="legend"><span class="fuel">茶＝燃料</span><span class="air">青＝酸素</span><span class="fire">赤橙＝炎</span><span class="smoke">灰＝煙</span><span class="water">濃青＝水</span></div>
<div class="tools"><button data-tool="fuel" class="on">🪵 燃料を置く</button><button data-tool="air">💨 空気を送る</button><button data-tool="water">💧 水をかける</button><button data-tool="wall">🧱 壁を置く</button><button data-tool="spark">✨ 火をつける</button></div>
<section class="stage"><canvas id="canvas" width="900" height="580" aria-label="燃料、空気、水、壁へ直接介入する燃焼模型"></canvas><div class="prompt" id="prompt">👆 画面をなぞって燃料を置く</div></section>
<div class="metrics"><span>炎 <b id="flameM">0</b></span><span>酸素 <b id="oxygenM">0%</b></span><span>煙 <b id="smokeM">0</b></span><span id="stateM">燃料を置いて火をつけよう</span></div>
<details class="card"><summary><b>🔬 もっとためす：完全燃焼と不完全燃焼</b></summary><label>空気の自然な流れ <input id="draft" type="range" min="0" max="100" value="35"></label><p><b>燃焼の3要素</b>は燃料・酸素・十分な温度。酸素が少ないと暗い炎と煙が増える「不完全燃焼」になります。壁で空気を遮り、送風で回復させて比べよう。</p></details>
<script>
(()=>{'use strict';const cv=document.getElementById('canvas'),c=cv.getContext('2d'),W=60,H=38,S=15;let tool='fuel',cells,drag=false,last=0;
function idx(x,y){return y*W+x}function reset(){cells=Array.from({length:W*H},()=>({fuel:0,fire:0,water:0,wall:false,air:.65,smoke:0}));for(let x=19;x<41;x++)for(let y=29;y<35;y++)cells[idx(x,y)].fuel=.9;for(let x=25;x<35;x++)cells[idx(x,28)].fire=.5;draw()}
function point(e){const r=cv.getBoundingClientRect();return{x:Math.floor((e.clientX-r.left)/r.width*W),y:Math.floor((e.clientY-r.top)/r.height*H)}}
function apply(p){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=p.x+dx,y=p.y+dy;if(x<0||y<0||x>=W||y>=H||dx*dx+dy*dy>5)continue;const q=cells[idx(x,y)];if(tool==='fuel'){q.fuel=1;q.wall=false}else if(tool==='air'){q.air=1;q.smoke=Math.max(0,q.smoke-.2)}else if(tool==='water'){q.water=1;q.fire=0}else if(tool==='wall'){q.wall=!q.wall;q.fire=0}else if(tool==='spark'&&q.fuel>.05&&q.air>.15)q.fire=1}document.getElementById('prompt').hidden=true;draw()}
function simulation(){const next=cells.map(q=>({...q})),draft=Number(document.getElementById('draft').value)/100;for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=idx(x,y),q=cells[i],n=next[i];if(q.wall)continue;n.water=Math.max(0,q.water-.003);n.air=Math.min(1,q.air+.004*draft);if(q.fire>0){const burn=Math.min(q.fuel,.012+.025*q.air);n.fuel-=burn;n.air=Math.max(0,q.air-burn*1.8);n.fire=q.water>.1?Math.max(0,q.fire-.25):q.fuel>0&&q.air>.06?Math.min(1,q.fire+.02):Math.max(0,q.fire-.08);n.smoke=Math.min(1,q.smoke+burn*(q.air<.35?5:.8));const up=next[idx(x,y-1)];if(!up.wall&&Math.random()<.18+q.fire*.25){up.fire=Math.max(up.fire,q.fire*.72);up.smoke=Math.max(up.smoke,q.smoke*.8)}for(const j of [idx(x-1,y),idx(x+1,y),idx(x,y+1)])if(!next[j].wall&&cells[j].fuel>.08&&Math.random()<q.fire*.035)next[j].fire=Math.max(next[j].fire,.5)}else n.smoke=Math.max(0,q.smoke-.008);if(!q.wall){const av=[cells[idx(x-1,y)].air,cells[idx(x+1,y)].air,cells[idx(x,y-1)].air,cells[idx(x,y+1)].air];n.air+=(av.reduce((a,b)=>a+b,0)/4-q.air)*.04}}cells=next}
	function draw(){c.fillStyle='#101820';c.fillRect(0,0,900,580);let flames=0,smoke=0,air=0,count=0,reactionAir=0,reactionCount=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++){const q=cells[idx(x,y)],px=x*S,py=y*S;if(q.wall){c.fillStyle='#8c5943';c.fillRect(px,py,S,S);c.strokeStyle='#c78b6a';c.strokeRect(px,py,S,S);continue}c.fillStyle=`rgba(55,149,194,${q.air*.12})`;c.fillRect(px,py,S,S);if(q.fuel>.02){c.fillStyle=`rgba(151,91,43,${.3+q.fuel*.7})`;c.fillRect(px+1,py+1,S-2,S-2)}if(q.water>.02){c.fillStyle=`rgba(47,119,201,${q.water})`;c.fillRect(px,py,S,S)}if(q.smoke>.02){c.fillStyle=`rgba(104,111,120,${q.smoke*.8})`;c.beginPath();c.arc(px+S/2,py+S/2,S*.6,0,7);c.fill()}if(q.fire>.02){const grad=c.createRadialGradient(px+S/2,py+S*.75,1,px+S/2,py+S*.5,S*1.6);grad.addColorStop(0,'#fff8aa');grad.addColorStop(.35,'#ffad36');grad.addColorStop(.72,'#ef4522');grad.addColorStop(1,'#e4371800');c.fillStyle=grad;c.beginPath();c.moveTo(px+S/2,py-S*(.7+q.fire));c.bezierCurveTo(px-S*.65,py+S*.1,px-S*.35,py+S*1.2,px+S/2,py+S*1.15);c.bezierCurveTo(px+S*1.35,py+S*1.2,px+S*1.6,py+S*.1,px+S/2,py-S*(.7+q.fire));c.fill();flames++}if(q.fire>.02||q.fuel>.08){reactionAir+=q.air;reactionCount++}smoke+=q.smoke;air+=q.air;count++}c.fillStyle='rgba(7,19,31,.82)';c.fillRect(12,510,360,54);c.fillStyle='#eff7ff';c.font='bold 16px system-ui';c.fillText('燃料 ＋ 酸素 ＋ 点火 → 炎・熱',24,533);c.font='13px system-ui';c.fillStyle='#b8dff4';c.fillText('水は熱を奪い、壁は酸素の流れを遮る',24,554);document.getElementById('flameM').textContent=flames;document.getElementById('oxygenM').textContent=Math.round((reactionCount?reactionAir/reactionCount:air/count)*100)+'%（反応部）';document.getElementById('smokeM').textContent=Math.round(smoke);document.getElementById('stateM').textContent=flames===0?'■ 結果：消火。燃料・酸素・点火のどれが欠けたか確認':' '+(smoke>25?'▲ 結果：酸素不足の不完全燃焼（煙が多い）':'● 結果：酸素が届く燃焼（炎が続く）')}
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);apply(point(e))});cv.addEventListener('pointermove',e=>{if(drag)apply(point(e))});cv.addEventListener('pointerup',()=>drag=false);document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('prompt').textContent={fuel:'👆 なぞって燃料を置く',air:'👆 炎へ空気を送る',water:'👆 炎へ水をかける',wall:'👆 壁を置いて空気を遮る',spark:'👆 燃料へ火をつける'}[tool];document.getElementById('prompt').hidden=false});document.getElementById('resetBtn').onclick=reset;
function loop(ts){if(ts-last>50){simulation();draw();last=ts}requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script><script src="lab4wonder_v1_1.js" defer></script></body></html>
