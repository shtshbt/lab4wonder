<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手回し4ストロークエンジン</title><link rel="stylesheet" href="lab4wonder_v1_1.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:12px 12px 100px;background:#081421;color:#eef7ff;font-family:system-ui,"Yu Gothic",sans-serif}.head,.tools,.phases{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}p{line-height:1.65}.stage{position:relative;border:2px solid #405e78;border-radius:20px;overflow:hidden;background:#c8e3ed}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#081421e8;padding:8px 13px;border-radius:999px;font-weight:900;white-space:nowrap}.tools{margin:10px 0}.tools button,.head button{min-height:46px;border:1px solid #47657f;border-radius:13px;background:#173049;color:#fff;padding:8px 13px;font-weight:900}.tools button.on{background:#ffd65a;color:#241d00}.phases{margin:8px 0}.phase{flex:1;min-width:125px;padding:9px;border:2px solid #38536b;border-radius:13px;background:#10283c}.phase.on{border-color:#ffd65a;background:#3b3519;transform:translateY(-2px)}.phase b{display:block}.phase small{display:block;opacity:.8}.card{padding:12px;margin-top:10px;border:1px solid #385570;border-radius:15px;background:#102438}.legend{display:flex;gap:8px;flex-wrap:wrap}.legend span{padding:5px 9px;border-radius:999px}.air{background:#75d6ff;color:#092739}.fuel{background:#ffbf62;color:#392200}.burn{background:#ff715b}.exhaust{background:#8794a2}
</style></head><body>
<header class="head"><div><h1>🚗 手回し4ストロークエンジン</h1><p>右下の黄色いクランクを指でぐるぐる回そう。ピストン、バルブ、空気と燃料が同時に動く。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="legend"><span class="air">青＝新しい空気</span><span class="fuel">橙＝燃料</span><span class="burn">赤＝燃焼ガス</span><span class="exhaust">灰＝排気</span></div>
<div class="phases"><div class="phase" data-phase="0"><b>① 吸気</b><small>空気＋燃料を吸う</small></div><div class="phase" data-phase="1"><b>② 圧縮</b><small>小さく押し込む</small></div><div class="phase" data-phase="2"><b>③ 燃焼・仕事</b><small>爆発が押し下げる</small></div><div class="phase" data-phase="3"><b>④ 排気</b><small>燃えたガスを出す</small></div></div>
<section class="stage"><canvas id="canvas" width="900" height="610" aria-label="クランクを直接手回しする4ストロークエンジン"></canvas><div class="prompt" id="prompt">👆 黄色い取っ手を円にそって回す</div></section>
<div class="tools"><button id="autoBtn">▶ 自動で回す</button><button id="slowBtn" class="on">🐢 超ゆっくり</button><button id="sparkBtn">⚡ 点火して観察</button><span id="status">いま：吸気</span></div>
<details class="card"><summary><b>🔬 もっとためす：回転速度と混合気</b></summary><label>自動回転速度 <input id="speed" type="range" min="1" max="10" value="3"></label><label>燃料の割合 <input id="fuel" type="range" min="20" max="100" value="60"></label><p><b>ストローク</b>はピストンが上から下、または下から上へ動く1回分。4ストロークにはクランク2回転が必要です。</p></details>
<script>
(()=>{'use strict';const cv=document.getElementById('canvas'),c=cv.getContext('2d');let theta=0,drag=false,auto=false,last=0,flash=0;const cx=700,cy=475,R=85;
function phase(){return Math.floor(((theta%(Math.PI*4))+Math.PI*4)%(Math.PI*4)/Math.PI)%4}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*610}}
function setAngle(p){let a=Math.atan2(p.y-cy,p.x-cx);const current=((theta%(Math.PI*2))+Math.PI*2)%(Math.PI*2),d=((a-current+Math.PI*3)%(Math.PI*2))-Math.PI;theta+=d;document.getElementById('prompt').hidden=true;draw()}
function valve(x,open,color){c.fillStyle=color;c.fillRect(x-8,115,16,open?55:25);c.beginPath();c.ellipse(x,open?170:140,32,10,0,0,7);c.fill()}
function arrow(x1,y1,x2,y2,color,label){c.strokeStyle=c.fillStyle=color;c.lineWidth=7;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();const a=Math.atan2(y2-y1,x2-x1);c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-17*Math.cos(a-.5),y2-17*Math.sin(a-.5));c.lineTo(x2-17*Math.cos(a+.5),y2-17*Math.sin(a+.5));c.fill();c.font='bold 17px system-ui';c.fillText(label,(x1+x2)/2,(y1+y2)/2-9)}
function draw(){const p=phase(),local=theta%Math.PI,pistonY=330-150*(.5+.5*Math.cos(local));c.fillStyle='#c8e3ed';c.fillRect(0,0,900,610);c.fillStyle='#213747';c.fillRect(245,75,390,390);c.fillStyle='#eef6f8';c.fillRect(290,115,300,310);const colors=['#83d7f4','#f0bd67','#ff735d','#8d9baa'];c.fillStyle=colors[p]+'aa';c.fillRect(300,140,280,Math.max(30,pistonY-150));valve(355,p===0,'#4faed0');valve(525,p===3,'#6c7580');c.fillStyle='#758a97';c.beginPath();c.roundRect(300,pistonY,280,75,14);c.fill();c.fillStyle='#dce8ec';c.fillRect(325,pistonY+12,230,18);c.strokeStyle='#485d68';c.lineWidth=18;c.beginPath();c.moveTo(440,pistonY+73);c.lineTo(cx+Math.cos(theta)*R,cy+Math.sin(theta)*R);c.stroke();c.fillStyle='#344c5c';c.beginPath();c.arc(cx,cy,R,0,7);c.fill();c.strokeStyle='#d4e3e8';c.lineWidth=12;c.stroke();const hx=cx+Math.cos(theta)*R,hy=cy+Math.sin(theta)*R;c.strokeStyle='#ffd65a';c.lineWidth=14;c.beginPath();c.moveTo(cx,cy);c.lineTo(hx,hy);c.stroke();c.fillStyle='#ffd65a';c.beginPath();c.arc(hx,hy,25,0,7);c.fill();c.fillStyle='#292000';c.beginPath();c.arc(hx,hy,7,0,7);c.fill();
if(p===0)arrow(100,170,285,170,'#2189b7','空気＋燃料 IN');if(p===1){arrow(440,180,440,270,'#d68420','ぎゅっと圧縮');arrow(395,200,430,260,'#d68420','')}if(p===2){arrow(440,190,440,305,'#df3a2e','燃焼が押す');if(flash>0){c.fillStyle='#fff4a3';c.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=i%2?35:75;c.lineTo(440+Math.cos(a)*r,185+Math.sin(a)*r)}c.fill()}}if(p===3)arrow(590,170,805,170,'#596775','排気 OUT');
c.fillStyle='#132b3d';c.fillRect(15,520,430,65);c.fillStyle='#fff';c.font='bold 26px system-ui';c.fillText(['① 吸気：入れる','② 圧縮：小さくする','③ 燃焼：押し下げる','④ 排気：外へ出す'][p],30,560);document.querySelectorAll('.phase').forEach((el,i)=>el.classList.toggle('on',i===p));document.getElementById('status').textContent='いま：'+['吸気','圧縮','燃焼・仕事','排気'][p]}
cv.addEventListener('pointerdown',e=>{const p=pos(e),h={x:cx+Math.cos(theta)*R,y:cy+Math.sin(theta)*R};if(Math.hypot(p.x-h.x,p.y-h.y)<70){drag=true;cv.setPointerCapture(e.pointerId)}});cv.addEventListener('pointermove',e=>{if(drag)setAngle(pos(e))});cv.addEventListener('pointerup',()=>drag=false);
document.getElementById('autoBtn').onclick=e=>{auto=!auto;e.currentTarget.textContent=auto?'⏸ とめる':'▶ 自動で回す'};document.getElementById('slowBtn').onclick=e=>e.currentTarget.classList.toggle('on');document.getElementById('sparkBtn').onclick=()=>{flash=.65;theta=Math.PI*2+.08;draw()};document.getElementById('resetBtn').onclick=()=>{theta=0;auto=false;flash=0;document.getElementById('autoBtn').textContent='▶ 自動で回す';draw()};
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(auto){const slow=document.getElementById('slowBtn').classList.contains('on')?.22:1;theta+=dt*Number(document.getElementById('speed').value)*slow}flash=Math.max(0,flash-dt);draw();requestAnimationFrame(loop)}draw();requestAnimationFrame(loop);
})();
</script><script src="lab4wonder_v1_1.js" defer></script></body></html>
