<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>俳句・短歌・一句づくり</title>
<link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{max-width:980px;margin:auto;padding:12px 12px 100px;background:#0a1524;color:#eef5fb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;min-height:44px;border:1px solid #42617e;border-radius:12px;padding:8px 12px;background:#15283b;color:#f5f9fc;font-weight:800;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.hdr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hdr h1{margin:0;font-size:clamp(20px,4vw,28px);line-height:1.5}
.sub{margin:6px 0 0;color:#b6c6d6;font-size:13px;line-height:1.7}
ruby rt{font-size:.55em}
.modeRow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.modeBtn{flex:1 1 150px}
.modeBtn.on{background:#ffd85a;color:#211a00;border-color:#d6b43d}
#speakBtn{flex:0 1 auto;min-width:104px}
.poemPanel{border:1px solid #cbb98d;border-radius:18px;padding:12px;background:linear-gradient(160deg,#f8f1de,#efe5c8);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.line{display:flex;align-items:center;gap:8px;min-height:64px;margin:8px 0;padding:6px 8px;border:2px solid #d5c69c;border-radius:14px;background:#fffcf1;cursor:pointer}
.line:first-child{margin-top:0}
.line:last-child{margin-bottom:0}
.line.sel{border:3px solid #2f7fd0;box-shadow:0 0 0 3px rgba(47,127,208,.25);background:#ffffff}
.line[data-state=exact]{background:#f0faf0}
.line[data-state=over]{background:#fdf5e8}
.line.shake{animation:shake .35s ease}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.slots{flex:1 1 0;display:flex;flex-wrap:wrap;gap:6px;min-width:0;align-items:center}
.ph{color:#a99b76;font-size:13px;font-weight:700}
.gauge{flex:none;text-align:right;min-width:86px;color:#8d8368}
.line[data-state=exact] .gauge{color:#1d7a3f}
.line[data-state=over] .gauge{color:#b45f17}
.dots{display:block;font-size:11px;letter-spacing:2px;line-height:1.2}
.num{display:block;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.pcard{min-height:44px;border:1px solid #caa96a;border-radius:12px;background:#fff6d9;color:#39301a;font-weight:800;font-size:18px;padding:6px 10px;display:inline-flex;align-items:center;gap:4px}
.pcard.pjoshi{background:#e8f2fd;border-color:#93b8d8;color:#173a5a;min-width:44px;justify-content:center}
.pcard .pe{font-size:16px}
.pcard .pm{font-size:10px;color:#7c6329;background:#f1e2b8;border-radius:999px;padding:1px 5px;margin-left:2px}
.pcard.pjoshi .pm{color:#33587a;background:#d3e5f5}
.hint{margin:10px 0 4px;color:#9fb2c5;font-size:12px;line-height:1.8}
.status{min-height:1.6em;margin:2px 0 10px;color:#ffd88a;font-size:14px;font-weight:800}
.tray{border:1px solid #2e465e;border-radius:16px;background:#101d2b;padding:12px;margin-top:6px}
.trayHead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tray h2{margin:0;font-size:14px;color:#ffd85a}
.tray h2.second{margin:14px 0 8px}
.cards{display:flex;flex-wrap:wrap;gap:9px}
.card{position:relative;min-width:96px;min-height:56px;background:#fffdf4;color:#33291a;border:1px solid #d8c9a5;border-radius:14px;font-size:19px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px 14px}
.card .ce{font-size:18px}
.card .cm{position:absolute;right:7px;bottom:4px;font-size:10px;font-weight:900;color:#8a7440}
.card .tagS{position:absolute;left:7px;top:-9px;font-size:10px;font-weight:900;border-radius:999px;padding:2px 7px;line-height:1.3}
.tagS.haru{background:#ffd7e6;color:#8a2a4d}
.tagS.natsu{background:#cdeeff;color:#14547a}
.tagS.aki{background:#ffe3bd;color:#7a4514}
.tagS.fuyu{background:#dcecff;color:#2a4a7a}
.tagS.kireji{background:#ffe9b3;color:#7a5514}
.card.joshi{min-width:56px;background:#eaf4ff;border-color:#9cc0e0;color:#123a5c;padding:10px 12px 14px}
.card.joshi .cm{color:#3d6a92}
.card.kireji{background:#fff3d1;border-color:#d8ae52;color:#5a4514}
#celebrate{position:fixed;inset:0;display:none;z-index:60;background:rgba(4,14,26,.88);padding:16px;overflow:auto}
#celebrate.show{display:flex;align-items:center;justify-content:center}
#confettiWrap{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti{position:absolute;top:-48px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(320deg)}}
.doneBox{position:relative;width:min(620px,100%);border-radius:22px;border:2px solid #e6c46a;background:linear-gradient(165deg,#fdf7e4,#f4e9c9);color:#33291a;padding:22px;text-align:center}
.banner{font-size:clamp(30px,7vw,44px);font-weight:900;color:#c23d5d;animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.doneSub{margin:6px 0 0;font-size:14px;color:#6b5a35;font-weight:800}
#donePoem{margin:16px 0;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(22px,5vw,30px);line-height:1.95;color:#2c2313;font-weight:600}
.doneBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.doneBtns button{background:#2f5f9e;border-color:#254b7d;color:#fff;min-width:120px}
@media(prefers-reduced-motion:reduce){
.confetti{display:none}
.banner{animation:none}
.line.shake{animation:none}
}
@media(max-width:560px){
.hdr{display:block}
.hdr h1{font-size:20px}
.gauge{min-width:72px}
.card{min-width:84px;font-size:17px}
}
</style>
</head>
<body>
<header class="hdr">
  <div>
    <h1><ruby>俳句<rt>はいく</rt></ruby>・<ruby>短歌<rt>たんか</rt></ruby>・<ruby>一句<rt>いっく</rt></ruby>づくり</h1>
    <p class="sub">ことばカードを ならべて、じぶんの うたを つくろう。おとの かずが ぜんぶ ぴったりに なったら できあがり。</p>
  </div>
  <button id="resetBtn" type="button">↺ やりなおす</button>
</header>

<div class="modeRow" role="group" aria-label="うたの かたちを えらぶ">
  <button id="haikuBtn" class="modeBtn on" type="button" aria-pressed="true">はいく 5・7・5</button>
  <button id="tankaBtn" class="modeBtn" type="button" aria-pressed="false">たんか 5・7・5・7・7</button>
  <button id="speakBtn" type="button" aria-label="いま ならべた うたを こえで よむ">🔊 よむ</button>
</div>

<section id="poemArea" class="poemPanel" aria-label="うたを つくる ばしょ"></section>
<p id="status" class="status" role="status"></p>
<p class="hint">👆 カードを タップすると、あおい わくの だんに はいるよ。おいた カードは もういちど タップすると もどるよ。だんを タップすると、そこに おけるよ。</p>

<section class="tray" aria-label="ことばカードの おきば">
  <div class="trayHead">
    <h2>ことばカード</h2>
    <button id="shuffleBtn" type="button">🔀 ちがうことば</button>
  </div>
  <div id="wordTray" class="cards"></div>
  <h2 class="second">くっつきことば と きれじ</h2>
  <div id="particleTray" class="cards"></div>
</section>

<div id="celebrate" role="dialog" aria-modal="true" aria-label="うたが かんせいした おいわい">
  <div id="confettiWrap" aria-hidden="true"></div>
  <div class="doneBox">
    <div class="banner">できた！</div>
    <p class="doneSub">じぶんの うたが かんせいしたよ</p>
    <div id="donePoem"></div>
    <div class="doneBtns">
      <button id="speakDoneBtn" type="button">🔊 よむ</button>
      <button id="closeDoneBtn" type="button">とじる</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

// Mora counting: each kana is one sound, except the small glide kana.
const SMALL_KANA = "ゃゅょぁぃぅぇぉ";
const mora = (text) => {
  let n = 0;
  for (const ch of String(text)) if (!SMALL_KANA.includes(ch)) n += 1;
  return n;
};

const SEASON_NAMES = { haru: "はる", natsu: "なつ", aki: "あき", fuyu: "ふゆ" };
const POOL = [
  { w: "さくら", e: "🌸", g: "season", s: "haru" },
  { w: "はるかぜ", e: "🍃", g: "season", s: "haru" },
  { w: "ちょうちょ", e: "🦋", g: "season", s: "haru" },
  { w: "たんぽぽ", e: "🌼", g: "season", s: "haru" },
  { w: "つくし", e: "", g: "season", s: "haru" },
  { w: "せみ", e: "", g: "season", s: "natsu" },
  { w: "ひまわり", e: "🌻", g: "season", s: "natsu" },
  { w: "かきごおり", e: "🍧", g: "season", s: "natsu" },
  { w: "うみ", e: "🌊", g: "season", s: "natsu" },
  { w: "はなび", e: "🎆", g: "season", s: "natsu" },
  { w: "もみじ", e: "🍁", g: "season", s: "aki" },
  { w: "どんぐり", e: "", g: "season", s: "aki" },
  { w: "おつきさま", e: "🌕", g: "season", s: "aki" },
  { w: "とんぼ", e: "", g: "season", s: "aki" },
  { w: "かかし", e: "", g: "season", s: "aki" },
  { w: "ゆきだるま", e: "⛄", g: "season", s: "fuyu" },
  { w: "こたつ", e: "", g: "season", s: "fuyu" },
  { w: "ゆき", e: "❄️", g: "season", s: "fuyu" },
  { w: "しもばしら", e: "", g: "season", s: "fuyu" },
  { w: "おでん", e: "🍢", g: "season", s: "fuyu" },
  { w: "かえる", e: "🐸", g: "mono" },
  { w: "ねこ", e: "🐱", g: "mono" },
  { w: "いぬ", e: "🐶", g: "mono" },
  { w: "ことり", e: "🐦", g: "mono" },
  { w: "きんぎょ", e: "🐟", g: "mono" },
  { w: "かわ", e: "", g: "mono" },
  { w: "やま", e: "⛰️", g: "mono" },
  { w: "そら", e: "", g: "mono" },
  { w: "くも", e: "☁️", g: "mono" },
  { w: "みち", e: "", g: "mono" },
  { w: "いえ", e: "🏠", g: "mono" },
  { w: "とんでいく", e: "", g: "ugoki" },
  { w: "ないている", e: "", g: "ugoki" },
  { w: "ひかってる", e: "", g: "ugoki" },
  { w: "わらってる", e: "", g: "ugoki" },
  { w: "ゆれている", e: "", g: "ugoki" },
  { w: "まっている", e: "", g: "ugoki" },
  { w: "おおきいな", e: "", g: "ugoki" },
  { w: "ちいさいな", e: "", g: "ugoki" },
  { w: "つめたいな", e: "", g: "ugoki" },
  { w: "あったかい", e: "", g: "ugoki" },
  { w: "きらきらと", e: "", g: "ugoki" },
  { w: "ふわふわと", e: "", g: "ugoki" },
];
POOL.forEach((c) => { c.m = mora(c.w); });

const PARTICLES = ["が", "の", "に", "と", "を", "は", "で", "も", "よ", "ね"]
  .map((w) => ({ w, e: "", g: "joshi", m: 1 }))
  .concat(["かな", "けり"].map((w) => ({ w, e: "", g: "kireji", m: 2 })));

const TARGETS = { haiku: [5, 7, 5], tanka: [5, 7, 5, 7, 7] };
const GROUP_RANK = { season: 0, mono: 1, ugoki: 2 };

let modeName = "haiku";
let lines = TARGETS[modeName].map(() => []);
let tray = [];
let selected = 0;
let uidSeq = 0;

const $ = (id) => document.getElementById(id);
const poemArea = $("poemArea");
const wordTray = $("wordTray");
const particleTray = $("particleTray");
const statusEl = $("status");
const speakBtn = $("speakBtn");
const canSpeak = "speechSynthesis" in window;

const targets = () => TARGETS[modeName];
const lineMora = (i) => lines[i].reduce((a, c) => a + c.m, 0);
const poemText = () => lines.map((l) => l.map((c) => c.w).join("")).filter(Boolean).join("、");

function shuffled(list) {
  const x = list.slice();
  for (let i = x.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [x[i], x[j]] = [x[j], x[i]];
  }
  return x;
}

function placedTexts() {
  const used = new Set();
  lines.forEach((l) => l.forEach((c) => used.add(c.w)));
  return used;
}

function deal() {
  const used = placedTexts();
  const pick = (g, n) => shuffled(POOL.filter((c) => c.g === g && !used.has(c.w))).slice(0, n);
  tray = [...pick("season", 2), ...pick("mono", 5), ...pick("ugoki", 5)];
}

function sortTray() {
  tray.sort((a, b) => (GROUP_RANK[a.g] ?? 9) - (GROUP_RANK[b.g] ?? 9));
}

function setStatus(text) {
  statusEl.textContent = text || "";
}

function shakeSelected() {
  const el = poemArea.querySelector(`.line[data-i="${selected}"]`);
  if (!el) return;
  el.classList.add("shake");
  setTimeout(() => el.classList.remove("shake"), 400);
}

function nextOpenLine(from) {
  const n = targets().length;
  for (let k = 1; k <= n; k++) {
    const i = (from + k) % n;
    if (lineMora(i) < targets()[i]) return i;
  }
  return -1;
}

function feedbackFor(i) {
  const t = targets()[i];
  const n = lineMora(i);
  if (n === t) return "ぴったり！";
  if (n > t) return "おとが おおめ。これは「じあまり」だよ。それも いいね。";
  return "あと " + (n === 0 ? t : t - n) + "おんで ぴったり！";
}

function place(card) {
  const i = selected;
  const t = targets()[i];
  if (lineMora(i) >= t) {
    setStatus("この だんは もう いっぱいだよ。ほかの だんを タップしてね。");
    shakeSelected();
    return;
  }
  lines[i].push({ w: card.w, e: card.e || "", g: card.g, s: card.s || "", m: card.m, uid: ++uidSeq });
  if (card.g !== "joshi" && card.g !== "kireji") {
    tray = tray.filter((c) => c !== card);
  }
  let msg = feedbackFor(i);
  if (lineMora(i) >= t) {
    const nx = nextOpenLine(i);
    if (nx >= 0) {
      selected = nx;
      msg += " つぎは " + (nx + 1) + "だんめ。";
    }
  }
  setStatus(msg);
  renderAll();
  checkDone();
}

function removePlaced(lineIdx, uid) {
  const l = lines[lineIdx];
  const k = l.findIndex((c) => c.uid === uid);
  if (k < 0) return;
  const [c] = l.splice(k, 1);
  if (c.g !== "joshi" && c.g !== "kireji") {
    const p = POOL.find((x) => x.w === c.w);
    if (p && !tray.includes(p)) tray.push(p);
    sortTray();
  }
  selected = lineIdx;
  setStatus("「" + c.w + "」を もどしたよ。");
  renderAll();
}

function returnAllPlaced() {
  lines.forEach((l) => l.forEach((c) => {
    if (c.g === "joshi" || c.g === "kireji") return;
    const p = POOL.find((x) => x.w === c.w);
    if (p && !tray.includes(p)) tray.push(p);
  }));
  sortTray();
}

function setMode(next) {
  if (modeName !== next) {
    returnAllPlaced();
    modeName = next;
    lines = targets().map(() => []);
    selected = 0;
    setStatus(next === "haiku" ? "はいくは 5・7・5 の 3だんだよ。" : "たんかは 5・7・5・7・7 の 5だんだよ。");
  }
  hideCelebrate();
  renderAll();
}

function resetAll() {
  returnAllPlaced();
  lines = targets().map(() => []);
  selected = 0;
  hideCelebrate();
  setStatus("さいしょから つくりなおそう。");
  renderAll();
}

function renderLines() {
  poemArea.replaceChildren();
  targets().forEach((t, i) => {
    const n = lineMora(i);
    const state = n === t ? "exact" : (n > t ? "over" : "under");
    const line = document.createElement("div");
    line.className = "line" + (i === selected ? " sel" : "");
    line.dataset.i = String(i);
    line.dataset.state = state;
    line.setAttribute("role", "button");
    line.tabIndex = 0;
    line.setAttribute("aria-label", (i + 1) + "だんめ。いま " + n + "おん、めあて " + t + "おん。" + (i === selected ? "いま えらんでいる だん。" : "タップで えらぶ。"));
    const slots = document.createElement("div");
    slots.className = "slots";
    if (!lines[i].length) {
      const ph = document.createElement("span");
      ph.className = "ph";
      ph.textContent = i === selected ? "ここに ことばを おいてね" : "タップして この だんを えらぶ";
      slots.appendChild(ph);
    }
    lines[i].forEach((c) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "pcard" + ((c.g === "joshi" || c.g === "kireji") ? " pjoshi" : "");
      b.dataset.uid = String(c.uid);
      b.dataset.line = String(i);
      b.dataset.text = c.w;
      b.setAttribute("aria-label", c.w + " " + c.m + "おん。タップで もどす");
      if (c.e) {
        const e = document.createElement("span");
        e.className = "pe";
        e.textContent = c.e;
        b.appendChild(e);
      }
      b.appendChild(document.createTextNode(c.w));
      const pm = document.createElement("span");
      pm.className = "pm";
      pm.textContent = String(c.m);
      b.appendChild(pm);
      slots.appendChild(b);
    });
    const gauge = document.createElement("div");
    gauge.className = "gauge";
    gauge.setAttribute("aria-hidden", "true");
    const dots = document.createElement("span");
    dots.className = "dots";
    dots.textContent = "●".repeat(Math.min(n, t)) + "○".repeat(Math.max(0, t - n));
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = n + "/" + t;
    gauge.append(dots, num);
    line.append(slots, gauge);
    poemArea.appendChild(line);
  });
}

function cardButton(c) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "card" + (c.g === "joshi" ? " joshi" : "") + (c.g === "kireji" ? " joshi kireji" : "");
  b.dataset.text = c.w;
  b.setAttribute("aria-label", c.w + " " + c.m + "おん を おく");
  if (c.s) {
    const s = document.createElement("span");
    s.className = "tagS " + c.s;
    s.textContent = SEASON_NAMES[c.s];
    b.appendChild(s);
  }
  if (c.g === "kireji") {
    const s = document.createElement("span");
    s.className = "tagS kireji";
    s.textContent = "きれじ";
    b.appendChild(s);
  }
  if (c.e) {
    const e = document.createElement("span");
    e.className = "ce";
    e.textContent = c.e;
    b.appendChild(e);
  }
  b.appendChild(document.createTextNode(c.w));
  const m = document.createElement("span");
  m.className = "cm";
  m.textContent = String(c.m);
  b.appendChild(m);
  return b;
}

function renderTray() {
  wordTray.replaceChildren();
  tray.forEach((c) => wordTray.appendChild(cardButton(c)));
  if (particleTray.childElementCount === 0) {
    PARTICLES.forEach((c) => particleTray.appendChild(cardButton(c)));
  }
}

function renderAll() {
  renderLines();
  renderTray();
  if (canSpeak) speakBtn.disabled = poemText() === "";
}

function checkDone() {
  const done = targets().every((t, i) => lineMora(i) === t);
  if (done) celebrate();
}

function hideCelebrate() {
  $("celebrate").classList.remove("show");
  $("confettiWrap").replaceChildren();
}

const CONFETTI_EMOJI = ["🌸", "✨", "🎉", "⭐", "🍁", "❄️", "🌼", "🦋"];
function celebrate() {
  const box = $("donePoem");
  box.replaceChildren();
  lines.forEach((l) => {
    const row = document.createElement("div");
    row.textContent = l.map((c) => c.w).join("");
    box.appendChild(row);
  });
  const wrap = $("confettiWrap");
  wrap.replaceChildren();
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    for (let i = 0; i < 26; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = CONFETTI_EMOJI[Math.floor(Math.random() * CONFETTI_EMOJI.length)];
      s.style.left = (Math.random() * 100) + "%";
      s.style.fontSize = (16 + Math.random() * 20) + "px";
      s.style.animationDuration = (2.6 + Math.random() * 2.2) + "s";
      s.style.animationDelay = (Math.random() * 1.2) + "s";
      wrap.appendChild(s);
    }
  }
  $("celebrate").classList.add("show");
}

function speak() {
  if (!canSpeak) return;
  const text = poemText();
  if (!text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP";
    u.rate = 0.9;
    speechSynthesis.speak(u);
  } catch (err) {
    setStatus("こえが だせなかったよ。");
  }
}

wordTray.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".card");
  if (!btn) return;
  const card = tray.find((c) => c.w === btn.dataset.text);
  if (card) place(card);
});

particleTray.addEventListener("click", (ev) => {
  const btn = ev.target.closest(".card");
  if (!btn) return;
  const card = PARTICLES.find((c) => c.w === btn.dataset.text);
  if (card) place(card);
});

poemArea.addEventListener("click", (ev) => {
  const pcard = ev.target.closest(".pcard");
  if (pcard) {
    removePlaced(Number(pcard.dataset.line), Number(pcard.dataset.uid));
    return;
  }
  const line = ev.target.closest(".line");
  if (line) {
    selected = Number(line.dataset.i);
    setStatus((selected + 1) + "だんめを えらんだよ。");
    renderAll();
  }
});

poemArea.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const line = ev.target.closest(".line");
  if (!line) return;
  ev.preventDefault();
  selected = Number(line.dataset.i);
  setStatus((selected + 1) + "だんめを えらんだよ。");
  renderAll();
});

$("haikuBtn").addEventListener("click", () => {
  $("haikuBtn").classList.add("on");
  $("haikuBtn").setAttribute("aria-pressed", "true");
  $("tankaBtn").classList.remove("on");
  $("tankaBtn").setAttribute("aria-pressed", "false");
  setMode("haiku");
});
$("tankaBtn").addEventListener("click", () => {
  $("tankaBtn").classList.add("on");
  $("tankaBtn").setAttribute("aria-pressed", "true");
  $("haikuBtn").classList.remove("on");
  $("haikuBtn").setAttribute("aria-pressed", "false");
  setMode("tanka");
});
$("shuffleBtn").addEventListener("click", () => {
  deal();
  setStatus("あたらしい ことばカードに かえたよ。");
  renderAll();
});
$("resetBtn").addEventListener("click", resetAll);
$("closeDoneBtn").addEventListener("click", hideCelebrate);
$("speakDoneBtn").addEventListener("click", speak);
speakBtn.addEventListener("click", speak);
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") hideCelebrate();
});

if (!canSpeak) {
  speakBtn.hidden = true;
  $("speakDoneBtn").hidden = true;
}

window.__testAPI = {
  ready: true,
  mora,
  state: () => ({
    mode: modeName,
    targets: targets().slice(),
    counts: targets().map((t, i) => lineMora(i)),
    lines: lines.map((l) => l.map((c) => c.w)),
    tray: tray.map((c) => c.w),
    selected,
  }),
  dealWords: (words) => {
    tray = words.map((w) => POOL.find((c) => c.w === w)).filter(Boolean);
    renderAll();
  },
  selectLine: (i) => {
    selected = Math.max(0, Math.min(targets().length - 1, Number(i) || 0));
    renderAll();
  },
  setMode,
  reset: resetAll,
};

deal();
renderAll();
setStatus("すきな カードを タップしてみよう。");
})();
</script>
