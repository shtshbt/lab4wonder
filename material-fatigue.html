<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>くり返し荷重・き裂ラボ</title><link rel="stylesheet" href="lab4wonder_v1_1.css"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:930px;margin:auto;padding:12px 12px 100px;background:#081421;color:#eef7ff;font-family:system-ui,"Yu Gothic",sans-serif}.head,.tools,.metrics{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}p{line-height:1.65}.stage{position:relative;border:2px solid #405d77;border-radius:20px;overflow:hidden;background:#dcecf2}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:#081421e8;font-weight:900;white-space:nowrap}.tools{margin:10px 0}.tools button,.head button{min-height:46px;border:1px solid #45637e;border-radius:13px;background:#173049;color:#fff;padding:8px 13px;font-weight:900}.tools button.on{background:#ffd65a;color:#281f00}.metrics span{padding:8px 10px;border-radius:12px;background:#10283c}.card{margin-top:10px;padding:12px;border:1px solid #385570;border-radius:15px;background:#102438}.card label{display:grid;grid-template-columns:1fr auto;margin:8px 0}.card input{grid-column:1/-1;width:100%}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.results div{padding:8px;text-align:center;border-radius:10px;background:#10283c}
</style></head><body>
<header class="head"><div><h1>🔩 くり返し荷重・き裂ラボ</h1><p>試験片をタップするたび、1回曲げる。目では見えない小さなき裂が、くり返しで育つ様子を拡大窓で見よう。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="tools"><button id="tapMode" class="on">👆 1回ずつ曲げる</button><button id="autoBtn">✊ 10回連打</button><button id="compareBtn">📊 3本を同時に試す</button></div>
<section class="stage"><canvas id="canvas" width="900" height="590" aria-label="タップで繰り返し荷重を与え、き裂を拡大表示する"></canvas><div class="prompt" id="prompt">👆 左・中央・右の金属板をタップ</div></section>
<div class="metrics"><span>選択 <b id="selectedM">中央</b></span><span>荷重回数 <b id="cyclesM">0回</b></span><span>き裂 <b id="crackM">0%</b></span><span id="stateM">まだ健全</span></div>
<div class="results"><div>A：弱い力<br><b id="aM">0回</b></div><div>B：標準<br><b id="bM">0回</b></div><div>C：強い力<br><b id="cM">0回</b></div></div>
<details class="card"><summary><b>🔬 もっとためす：力・傷・材料</b></summary><label>曲げる力 <output id="forceOut"></output><input id="force" type="range" min="20" max="100" value="55"></label><label>最初の小さな傷 <output id="notchOut"></output><input id="notch" type="range" min="0" max="40" value="8"></label><label>材料の粘り強さ <output id="toughOut"></output><input id="tough" type="range" min="30" max="100" value="70"></label><p><b>疲労</b>とは、壊れない程度の力でも何度も受けるとき裂が育つ現象。破断直前は自動でゆっくり表示します。</p></details>
<script>
(()=>{'use strict';const cv=document.getElementById('canvas'),c=cv.getContext('2d');let specimens,selected=1,anim=0,queue=0,breaking=null,last=0;const force=document.getElementById('force'),notch=document.getElementById('notch'),tough=document.getElementById('tough');
function reset(){specimens=[{cycles:0,crack:+notch.value/100,broken:false,mult:.68},{cycles:0,crack:+notch.value/100,broken:false,mult:1},{cycles:0,crack:+notch.value/100,broken:false,mult:1.35}];selected=1;anim=0;queue=0;breaking=null;labels();draw()}
function loadOne(i){const s=specimens[i];selected=i;if(s.broken){s.cycles=0;s.crack=+notch.value/100;s.broken=false}const growth=Math.pow(Number(force.value)/72,3)*s.mult*(1+s.crack*4)/(Number(tough.value)*.5);s.cycles++;s.crack=Math.min(1,s.crack+growth);anim=.35;if(s.crack>=.82&&!breaking)breaking={i,t:0};if(s.crack>=1)s.broken=true;document.getElementById('prompt').hidden=true;labels()}
function labels(){const s=specimens?.[selected]||{cycles:0,crack:0};document.getElementById('selectedM').textContent=['左 A','中央 B','右 C'][selected];document.getElementById('cyclesM').textContent=s.cycles+'回';document.getElementById('crackM').textContent=Math.round(s.crack*100)+'%';document.getElementById('stateM').textContent=s.broken?'💥 破断！ タップで新しい試験片':s.crack>.8?'⚠️ 破断が近い・自動スロー':s.crack>.45?'き裂が成長中':'まだ健全';['aM','bM','cM'].forEach((id,i)=>document.getElementById(id).textContent=specimens[i].broken?`破断 ${specimens[i].cycles}回`:`${specimens[i].cycles}回／き裂${Math.round(specimens[i].crack*100)}%`);document.getElementById('forceOut').textContent=force.value+'%';document.getElementById('notchOut').textContent=notch.value+'%';document.getElementById('toughOut').textContent=tough.value+'%'}
function crackPath(x,y,len){c.strokeStyle='#b92f37';c.lineWidth=5;c.beginPath();c.moveTo(x,y);for(let k=1;k<=6;k++)c.lineTo(x+(k%2?8:-7),y+k*len/6);c.stroke()}
function draw(){c.fillStyle='#dcecf2';c.fillRect(0,0,900,590);for(let i=0;i<3;i++){const x=100+i*270,s=specimens[i],bend=anim>0&&selected===i?Math.sin(anim*28)*16:0;c.fillStyle=i===selected?'#ffd65a':'#5c7d91';c.beginPath();c.roundRect(x,180,180,55+bend,8);c.fill();c.fillStyle='#324b5b';c.fillRect(x-20,155,24,115);c.fillRect(x+176,155,24,115);if(s.broken){c.fillStyle='#dcecf2';c.beginPath();c.moveTo(x+84,175);c.lineTo(x+103,260);c.lineTo(x+125,175);c.fill()}else crackPath(x+90,180,s.crack*48);c.fillStyle='#253d4e';c.font='bold 18px system-ui';c.textAlign='center';c.fillText(['A 弱い力','B 標準','C 強い力'][i],x+90,305)}
const s=specimens[selected],zx=450,zy=350;c.fillStyle='#10283c';c.beginPath();c.roundRect(zx,zy,400,200,18);c.fill();c.fillStyle='#fff';c.font='bold 21px system-ui';c.textAlign='left';c.fillText('🔍 き裂の拡大（赤）',zx+22,zy+38);c.fillStyle='#93a9b5';c.fillRect(zx+45,zy+78,300,78);c.strokeStyle='#d8e4e8';c.lineWidth=2;for(let x=zx+55;x<zx+345;x+=26){c.beginPath();c.moveTo(x,zy+83);c.lineTo(x+8,zy+150);c.stroke()}crackPath(zx+195,zy+78,s.crack*105);c.fillStyle='#ffd65a';c.font='bold 18px system-ui';c.fillText(`長さ ${Math.round(s.crack*100)}%`,zx+250,zy+185)}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*900,y=(e.clientY-r.top)/r.height*590;if(y<330)loadOne(Math.max(0,Math.min(2,Math.floor((x-65)/270))))});document.getElementById('autoBtn').onclick=()=>queue+=10;document.getElementById('compareBtn').onclick=()=>{for(let i=0;i<3;i++)loadOne(i)};document.getElementById('resetBtn').onclick=reset;[force,notch,tough].forEach(x=>x.oninput=()=>{labels()});
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;anim=Math.max(0,anim-dt);if(queue>0&&anim<=0){loadOne(selected);queue--}if(breaking){breaking.t+=dt*.25;if(breaking.t>1){specimens[breaking.i].crack=1;specimens[breaking.i].broken=true;breaking=null;labels()}}draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script><script src="lab4wonder_v1_1.js" defer></script></body></html>
