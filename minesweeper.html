<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自分でマインスイーパー</title><link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:850px;margin:auto;padding:12px 12px 100px;background:#081522;color:#eef6ff;font-family:system-ui,"Yu Gothic",sans-serif}.head,.bar,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}p{line-height:1.65}.bar button,.head button{min-height:46px;border:1px solid #46617c;border-radius:13px;background:#172c40;color:#fff;padding:8px 13px;font-weight:900}.bar button.on{background:#ffd65a;color:#241d00}.stats span{background:#13283b;padding:7px 10px;border-radius:999px}.board{display:grid;margin:12px auto;max-width:680px;aspect-ratio:1;border:5px solid #38536c;border-radius:16px;overflow:hidden;background:#183149;touch-action:manipulation}.cell{padding:0;border:1px solid #52708c;border-radius:0;background:linear-gradient(145deg,#315877,#1d3d58);color:#fff;font-size:clamp(.85rem,4vw,1.6rem);font-weight:1000;min-height:0;min-width:0;line-height:1;overflow:hidden}.cell.open{background:#dbe7ee;color:#18344c}.cell.mine{background:#e35e5e}.cell.flag{background:#654f1d}.n1{color:#126ac4!important}.n2{color:#18834d!important}.n3{color:#d7483e!important}.n4{color:#6538a5!important}.message{min-height:48px;padding:10px;border:1px solid #35536e;border-radius:13px;background:#10263a;font-weight:800}.card{margin-top:10px;padding:12px;border:1px solid #35536e;border-radius:15px;background:#102235}.card label{display:block;margin:8px 0}.card input{width:100%}
</style></head>
<body>
<header class="head"><div><h1>💣 自分でマインスイーパー</h1><p>数字は「まわり8マスにある地雷の数」。安全だと思うマスを自分で選ぼう。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="stats"><span>🚩 <b id="flags">0</b></span><span>安全マス <b id="left">0</b></span><span>連勝 <b id="streak">0</b></span></div>
<div class="bar"><button id="openMode" class="on">👆 あける</button><button id="flagMode">🚩 はたを立てる</button><button id="hintBtn">💡 1マスだけヒント</button></div>
<div id="message" class="message">どこでも1マス、タップしてスタート！ 最初のマスは必ず安全です。</div>
<div id="board" class="board" role="grid" aria-label="自分で開くマインスイーパー盤面"></div>
<details class="card"><summary><b>🔬 もっとためす：むずかしさ</b></summary><label>盤面の大きさ <input id="size" type="range" min="7" max="12" value="9" step="1"><output id="sizeOut">9 × 9</output></label><label>地雷の割合 <input id="density" type="range" min="10" max="28" value="17" step="1"><output id="densityOut">17%</output></label><p>旗は「ここは地雷だ」という予想の印。数字と旗を照らし合わせると、安全なマスを論理的に見つけられます。</p></details>
<script>
(()=>{
'use strict';
const board=document.getElementById('board');let size,mines,cells,mode='open',started=false,ended=false,streak=0;
function neighbors(i){const x=i%size,y=Math.floor(i/size),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if((dx||dy)&&X>=0&&Y>=0&&X<size&&Y<size)a.push(Y*size+X)}return a}
function reset(){size=Number(document.getElementById('size').value);mines=Math.round(size*size*Number(document.getElementById('density').value)/100);cells=Array.from({length:size*size},()=>({mine:false,open:false,flag:false,n:0}));started=false;ended=false;board.style.gridTemplateColumns=`repeat(${size},1fr)`;board.style.gridTemplateRows=`repeat(${size},1fr)`;document.getElementById('message').textContent='どこでも1マス、タップしてスタート！ 最初のマスは必ず安全です。';render()}
function plant(safe){const banned=new Set([safe,...neighbors(safe)]);let ids=cells.map((_,i)=>i).filter(i=>!banned.has(i));for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids.slice(0,mines).forEach(i=>cells[i].mine=true);cells.forEach((c,i)=>c.n=neighbors(i).filter(j=>cells[j].mine).length);started=true}
function open(i){const c=cells[i];if(c.flag||c.open||ended)return;if(!started)plant(i);c.open=true;if(c.mine){ended=true;streak=0;cells.forEach(x=>{if(x.mine)x.open=true});document.getElementById('message').textContent='💥 地雷だった！ 盤面を見たら「はじめから」で即再挑戦。'}else{if(c.n===0)neighbors(i).forEach(open);const safeLeft=cells.filter(x=>!x.mine&&!x.open).length;if(!safeLeft){ended=true;streak++;document.getElementById('message').textContent='🎉 全部見つけた！ 同じ難しさでもう一度遊べるよ。'}else document.getElementById('message').textContent=c.n?`このマスのまわりには地雷が ${c.n} 個。`:'まわりは安全！ 空白がいっきに開いた。'}render()}
function toggleFlag(i){if(ended||cells[i].open)return;cells[i].flag=!cells[i].flag;render()}
function render(){board.innerHTML='';cells.forEach((c,i)=>{const b=document.createElement('button');b.className='cell'+(c.open?' open':'')+(c.mine&&c.open?' mine':'')+(c.flag?' flag':'')+(c.open&&!c.mine&&c.n?' n'+Math.min(4,c.n):'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',c.open?(c.mine?'地雷':`周囲の地雷${c.n}個`):(c.flag?'旗あり':'未開封'));b.textContent=c.flag&&!c.open?'🚩':c.open?(c.mine?'💣':c.n||''):'';b.onclick=()=>mode==='open'?open(i):toggleFlag(i);b.oncontextmenu=e=>{e.preventDefault();toggleFlag(i)};board.appendChild(b)});document.getElementById('flags').textContent=cells.filter(x=>x.flag).length+'/'+mines;document.getElementById('left').textContent=cells.filter(x=>!x.mine&&!x.open).length;document.getElementById('streak').textContent=streak}
function setMode(m){mode=m;document.getElementById('openMode').classList.toggle('on',m==='open');document.getElementById('flagMode').classList.toggle('on',m==='flag')}
document.getElementById('openMode').onclick=()=>setMode('open');document.getElementById('flagMode').onclick=()=>setMode('flag');document.getElementById('resetBtn').onclick=reset;
document.getElementById('hintBtn').onclick=()=>{if(!started||ended)return;const safe=cells.findIndex(c=>!c.mine&&!c.open&&!c.flag);if(safe>=0){open(safe);document.getElementById('message').textContent='💡 安全な1マスを開いたよ。数字から次を考えよう。'}};
['size','density'].forEach(id=>document.getElementById(id).oninput=()=>{document.getElementById('sizeOut').textContent=document.getElementById('size').value+' × '+document.getElementById('size').value;document.getElementById('densityOut').textContent=document.getElementById('density').value+'%';reset()});reset();
})();
</script>
<script src="lab4wonder_v1_1.js" defer></script>
</body></html>
