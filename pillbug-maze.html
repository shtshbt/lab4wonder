<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ダンゴムシ迷路</title>
<link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{max-width:980px;margin:auto;padding:12px 12px 100px;background:#08111c;color:#eef5fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input{font:inherit}
button{min-height:44px;border:1px solid #3d5873;border-radius:11px;padding:8px 11px;background:#16283a;color:#f4f8fb;font-weight:850}
button.primary,button.on{border-color:#d5b43d;background:#ffd75a;color:#211a00}
.header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.header h1{margin:0;font-size:clamp(21px,4vw,29px)}
.sub{margin:5px 0 0;color:#adbdcd;font-size:13px;line-height:1.65}
.tools{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}
.stage{position:relative;overflow:hidden;border:1px solid #36506b;border-radius:18px;background:#cbbd94}
#maze_canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none}
.status{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);padding:7px 10px;border-radius:999px;background:#07121ddd;color:#fff;font-size:12px;font-weight:850;pointer-events:none}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.card{padding:10px 11px;border:1px solid #30485f;border-radius:13px;background:#101d2b}
.card h2{margin:0 0 7px;color:#ffd75a;font-size:14px}
.control{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.control input{grid-column:1/-1;width:100%;height:32px}
.control output{color:#ffd75a;font:800 12px ui-monospace,monospace}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.metric{padding:8px;border-radius:10px;background:#0a1724;text-align:center}
.metric b{display:block;color:#9fb2c5;font-size:10px}.metric strong{font:850 18px ui-monospace,monospace}
.note{margin:9px 0 0;font-size:12px;line-height:1.7;color:#cbd6e0}
@media(max-width:650px){.header{display:block}.panel{grid-template-columns:1fr}.tools button{flex:1 1 28%}}
</style>
</head>
<body>
<header class="header">
  <div>
    <h1>ダンゴムシ迷路</h1>
    <p class="sub">自分で壁を描き、ダンゴムシが触角と壁沿い行動で出口を探す様子を観察します。</p>
  </div>
  <button id="reset_button" type="button">↺ はじめから</button>
</header>

<div class="tools" aria-label="迷路を作る道具">
  <button id="draw_tool" class="on" type="button">✏️ 壁を描く</button>
  <button id="erase_tool" type="button">🧽 壁を消す</button>
  <button id="start_tool" type="button">🔵 出発点</button>
  <button id="exit_tool" type="button">🟢 出口</button>
  <button id="play_button" class="primary" type="button">▶ 放す</button>
  <button id="clear_button" type="button">迷路を空にする</button>
</div>

<section class="stage">
  <canvas id="maze_canvas" width="900" height="600" aria-label="指で描けるダンゴムシ迷路"></canvas>
  <div class="status" id="status">壁を指で描いてください</div>
</section>

<div class="panel">
  <section class="card">
    <h2>ダンゴムシの行動</h2>
    <label class="control">放す数 <output id="count_output">6匹</output>
      <input id="bug_count" type="range" min="1" max="15" value="6">
    </label>
    <label class="control">壁沿いの強さ <output id="wall_output">70%</output>
      <input id="wall_follow" type="range" min="20" max="100" value="70">
    </label>
    <label class="control">迷い・個体差 <output id="noise_output">35%</output>
      <input id="noise" type="range" min="0" max="100" value="35">
    </label>
  </section>
  <section class="card">
    <h2>観察</h2>
    <div class="metrics">
      <div class="metric"><b>出口へ到着</b><strong id="goal_metric">0</strong></div>
      <div class="metric"><b>動いている</b><strong id="moving_metric">0</strong></div>
      <div class="metric"><b>経過</b><strong id="time_metric">0秒</strong></div>
    </div>
    <p class="note" id="observation">同じ迷路でも、最初に向いた方向や壁への当たり方で通る道が変わります。</p>
  </section>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("maze_canvas");
  const context = canvas.getContext("2d");
  const status = document.getElementById("status");
  const start = { x: 80, y: 520 };
  const exit = { x: 820, y: 80, radius: 30 };
  let walls = [];
  let bugs = [];
  let running = false;
  let tool = "draw";
  let activePointer = null;
  let lastDrawPoint = null;
  let elapsed = 0;
  let arrived = 0;
  let previousFrame = performance.now();

  const defaultWalls = [
    [170,600,170,370],[170,285,170,0],[300,480,300,150],[300,150,500,150],
    [300,480,590,480],[430,360,430,245],[430,245,650,245],[590,480,590,355],
    [590,355,760,355],[760,355,760,145],[650,245,650,70],
  ];

  function setDefaultMaze() {
    walls = defaultWalls.map(([x1, y1, x2, y2]) => ({ x1, y1, x2, y2 }));
  }

  function pointFromEvent(event) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (event.clientX - rect.left) / rect.width * canvas.width,
      y: (event.clientY - rect.top) / rect.height * canvas.height,
    };
  }

  function setTool(nextTool) {
    tool = nextTool;
    document.querySelectorAll(".tools button").forEach((button) => button.classList.remove("on"));
    document.getElementById(`${nextTool}_tool`)?.classList.add("on");
    const labels = {
      draw: "指でなぞって壁を描きます",
      erase: "消したい壁を指でなぞります",
      start: "新しい出発点をタップします",
      exit: "新しい出口をタップします",
    };
    status.textContent = labels[nextTool];
  }

  function beginPointer(event) {
    if (running) return;
    const point = pointFromEvent(event);
    activePointer = event.pointerId;
    canvas.setPointerCapture?.(event.pointerId);
    if (tool === "start") {
      start.x = point.x;
      start.y = point.y;
      resetBugs();
      return;
    }
    if (tool === "exit") {
      exit.x = point.x;
      exit.y = point.y;
      return;
    }
    lastDrawPoint = point;
    if (tool === "erase") eraseNear(point);
  }

  function movePointer(event) {
    if (event.pointerId !== activePointer || running) return;
    const point = pointFromEvent(event);
    if (tool === "draw" && lastDrawPoint) {
      if (Math.hypot(point.x - lastDrawPoint.x, point.y - lastDrawPoint.y) >= 8) {
        walls.push({ x1: lastDrawPoint.x, y1: lastDrawPoint.y, x2: point.x, y2: point.y });
        lastDrawPoint = point;
      }
    } else if (tool === "erase") {
      eraseNear(point);
    }
  }

  function endPointer(event) {
    if (event.pointerId !== activePointer) return;
    canvas.releasePointerCapture?.(event.pointerId);
    activePointer = null;
    lastDrawPoint = null;
  }

  function distanceToSegment(point, wall) {
    const dx = wall.x2 - wall.x1;
    const dy = wall.y2 - wall.y1;
    const lengthSquared = dx * dx + dy * dy || 1;
    const ratio = Math.max(0, Math.min(1, ((point.x - wall.x1) * dx + (point.y - wall.y1) * dy) / lengthSquared));
    const x = wall.x1 + ratio * dx;
    const y = wall.y1 + ratio * dy;
    return Math.hypot(point.x - x, point.y - y);
  }

  function eraseNear(point) {
    const before = walls.length;
    walls = walls.filter((wall) => distanceToSegment(point, wall) > 24);
    if (walls.length !== before) status.textContent = "壁を消しました";
  }

  function makeBug(index) {
    return {
      x: start.x + (index % 3) * 8,
      y: start.y + Math.floor(index / 3) * 8,
      angle: -Math.PI / 4 + (Math.random() - 0.5) * 1.2,
      speed: 31 + Math.random() * 10,
      turnBias: index % 2 ? 1 : -1,
      trail: [],
      done: false,
      stuck: 0,
    };
  }

  function resetBugs() {
    const count = Number(document.getElementById("bug_count").value);
    bugs = Array.from({ length: count }, (_, index) => makeBug(index));
    elapsed = 0;
    arrived = 0;
    running = false;
    document.getElementById("play_button").textContent = "▶ 放す";
    updateMetrics();
  }

  function rayDistance(bug, angle, maxDistance = 58) {
    for (let distance = 6; distance <= maxDistance; distance += 5) {
      const point = {
        x: bug.x + Math.cos(angle) * distance,
        y: bug.y + Math.sin(angle) * distance,
      };
      if (point.x < 12 || point.x > canvas.width - 12 || point.y < 12 || point.y > canvas.height - 12) return distance;
      if (walls.some((wall) => distanceToSegment(point, wall) < 11)) return distance;
    }
    return maxDistance;
  }

  function chooseDirection(bug, delta) {
    const goalAngle = Math.atan2(exit.y - bug.y, exit.x - bug.x);
    const wallFollow = Number(document.getElementById("wall_follow").value) / 100;
    const noise = Number(document.getElementById("noise").value) / 100;
    const offsets = [-1.05, -0.55, -0.22, 0, 0.22, 0.55, 1.05];
    let best = { angle: bug.angle, score: -Infinity };
    offsets.forEach((offset) => {
      const angle = bug.angle + offset;
      const clearance = rayDistance(bug, angle);
      const goalScore = Math.cos(angle - goalAngle) * 12;
      const edgeScore = clearance < 34 ? wallFollow * 9 : 0;
      const sideScore = -Math.abs(offset - bug.turnBias * 0.3) * wallFollow * 4;
      const randomScore = (Math.random() - 0.5) * noise * 18;
      const score = clearance + goalScore + edgeScore + sideScore + randomScore;
      if (score > best.score) best = { angle, score };
    });
    const turnRate = Math.min(1, delta * (4.5 + wallFollow * 3));
    bug.angle += normalizeAngle(best.angle - bug.angle) * turnRate;
  }

  function normalizeAngle(angle) {
    let value = angle;
    while (value > Math.PI) value -= Math.PI * 2;
    while (value < -Math.PI) value += Math.PI * 2;
    return value;
  }

  function updateBug(bug, delta) {
    if (bug.done) return;
    chooseDirection(bug, delta);
    const next = {
      x: bug.x + Math.cos(bug.angle) * bug.speed * delta,
      y: bug.y + Math.sin(bug.angle) * bug.speed * delta,
    };
    const blocked = next.x < 11 || next.x > canvas.width - 11 || next.y < 11 || next.y > canvas.height - 11
      || walls.some((wall) => distanceToSegment(next, wall) < 10);
    if (blocked) {
      bug.angle += bug.turnBias * (0.8 + Math.random() * 0.75);
      bug.turnBias *= Math.random() < 0.18 ? -1 : 1;
      bug.stuck += delta;
      return;
    }
    bug.x = next.x;
    bug.y = next.y;
    bug.stuck = 0;
    if (!bug.trail.length || Math.hypot(bug.x - bug.trail.at(-1).x, bug.y - bug.trail.at(-1).y) > 5) {
      bug.trail.push({ x: bug.x, y: bug.y });
      if (bug.trail.length > 650) bug.trail.shift();
    }
    if (Math.hypot(bug.x - exit.x, bug.y - exit.y) < exit.radius) {
      bug.done = true;
      arrived += 1;
    }
  }

  function update(delta) {
    bugs.forEach((bug) => updateBug(bug, delta));
    elapsed += delta;
    if (arrived === bugs.length && bugs.length) {
      running = false;
      status.textContent = "全員が出口へ着きました！";
      document.getElementById("play_button").textContent = "▶ もう一度";
    } else {
      status.textContent = `${bugs.length - arrived}匹が出口を探しています`;
    }
    updateMetrics();
  }

  function drawBackground() {
    context.fillStyle = "#cdbf99";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.fillStyle = "rgba(95,74,43,.08)";
    for (let index = 0; index < 90; index += 1) {
      const x = (index * 73) % canvas.width;
      const y = (index * 131) % canvas.height;
      context.beginPath();
      context.arc(x, y, 2 + index % 4, 0, Math.PI * 2);
      context.fill();
    }
  }

  function drawWalls() {
    context.strokeStyle = "#725f45";
    context.lineWidth = 17;
    context.lineCap = "round";
    context.lineJoin = "round";
    walls.forEach((wall) => {
      context.beginPath();
      context.moveTo(wall.x1, wall.y1);
      context.lineTo(wall.x2, wall.y2);
      context.stroke();
    });
  }

  function drawMarkers() {
    context.fillStyle = "#4489d8";
    context.beginPath();
    context.arc(start.x, start.y, 24, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = "#fff";
    context.font = "bold 14px sans-serif";
    context.textAlign = "center";
    context.fillText("出発", start.x, start.y + 5);
    context.fillStyle = "#51b77a";
    context.beginPath();
    context.arc(exit.x, exit.y, exit.radius, 0, Math.PI * 2);
    context.fill();
    context.fillStyle = "#fff";
    context.fillText("出口", exit.x, exit.y + 5);
  }

  function drawTrail(bug) {
    if (bug.trail.length < 2) return;
    context.strokeStyle = bug.done ? "rgba(81,183,122,.62)" : "rgba(255,193,58,.35)";
    context.lineWidth = 2.2;
    context.beginPath();
    bug.trail.forEach((point, index) => {
      if (index) context.lineTo(point.x, point.y);
      else context.moveTo(point.x, point.y);
    });
    context.stroke();
  }

  function drawBug(bug) {
    context.save();
    context.translate(bug.x, bug.y);
    context.rotate(bug.angle);
    context.fillStyle = bug.done ? "#5c9570" : "#48545d";
    context.strokeStyle = "#111820";
    context.lineWidth = 1.7;
    context.beginPath();
    context.ellipse(0, 0, 13, 8.5, 0, 0, Math.PI * 2);
    context.fill();
    context.stroke();
    context.strokeStyle = "#9aa7af";
    for (let x = -8; x <= 7; x += 3) {
      context.beginPath();
      context.moveTo(x, -7);
      context.lineTo(x, 7);
      context.stroke();
    }
    context.strokeStyle = "#273139";
    context.beginPath();
    context.moveTo(10, -4);
    context.lineTo(19, -10);
    context.moveTo(10, 4);
    context.lineTo(19, 10);
    context.stroke();
    context.restore();
  }

  function draw() {
    drawBackground();
    bugs.forEach(drawTrail);
    drawWalls();
    drawMarkers();
    bugs.forEach(drawBug);
  }

  function updateMetrics() {
    document.getElementById("goal_metric").textContent = `${arrived}/${bugs.length}`;
    document.getElementById("moving_metric").textContent = String(bugs.length - arrived);
    document.getElementById("time_metric").textContent = `${elapsed.toFixed(0)}秒`;
    const observation = document.getElementById("observation");
    if (arrived) observation.textContent = "緑の軌跡が出口まで届いた経路です。別の個体は同じ道を選ぶでしょうか。";
    else if (elapsed > 25) observation.textContent = "行き止まりでは向きを変え、壁に沿える側を探しています。壁を一本消すとどう変わるでしょう。";
  }

  function frame(now) {
    const delta = Math.min(0.035, Math.max(0, (now - previousFrame) / 1000));
    previousFrame = now;
    if (running) update(delta);
    draw();
    requestAnimationFrame(frame);
  }

  function fullReset() {
    setDefaultMaze();
    start.x = 80;
    start.y = 520;
    exit.x = 820;
    exit.y = 80;
    resetBugs();
    setTool("draw");
    status.textContent = "壁を指で描いてください";
  }

  canvas.addEventListener("pointerdown", beginPointer);
  canvas.addEventListener("pointermove", movePointer);
  canvas.addEventListener("pointerup", endPointer);
  canvas.addEventListener("pointercancel", endPointer);
  ["draw", "erase", "start", "exit"].forEach((name) => {
    document.getElementById(`${name}_tool`).addEventListener("click", () => setTool(name));
  });
  document.getElementById("play_button").addEventListener("click", (event) => {
    if (arrived === bugs.length) resetBugs();
    running = !running;
    event.currentTarget.textContent = running ? "⏸ とめる" : "▶ 放す";
  });
  document.getElementById("clear_button").addEventListener("click", () => {
    walls = [];
    resetBugs();
    status.textContent = "空の画面に迷路を描いてください";
  });
  document.getElementById("bug_count").addEventListener("input", (event) => {
    document.getElementById("count_output").textContent = `${event.target.value}匹`;
    resetBugs();
  });
  document.getElementById("wall_follow").addEventListener("input", (event) => {
    document.getElementById("wall_output").textContent = `${event.target.value}%`;
  });
  document.getElementById("noise").addEventListener("input", (event) => {
    document.getElementById("noise_output").textContent = `${event.target.value}%`;
  });
  document.getElementById("reset_button").addEventListener("click", fullReset);

  fullReset();
  requestAnimationFrame(frame);
})();
</script>
<script src="lab4wonder_v1_1.js"></script>
</body>
</html>
