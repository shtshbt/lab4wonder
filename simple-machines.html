<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>滑車・ロープを引く実験</title><link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{max-width:920px;margin:auto;padding:12px 12px 100px;background:#071522;color:#eff7ff;font-family:system-ui,"Yu Gothic",sans-serif}.head,.tools,.metrics{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}p{line-height:1.65}.stage{position:relative;border:2px solid #425d77;border-radius:20px;overflow:hidden;background:#b9ddf2}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.prompt{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#071522df;padding:8px 13px;border-radius:999px;font-weight:900;white-space:nowrap}.tools{margin:10px 0}.tools button,.head button{min-height:46px;border:1px solid #496782;border-radius:13px;background:#173049;color:#fff;padding:8px 13px;font-weight:900}.tools button.on{background:#ffd65a;color:#251d00}.metrics span{padding:8px 11px;border-radius:12px;background:#10283d}.card{margin-top:10px;padding:12px;border:1px solid #385571;border-radius:15px;background:#102438}.card label{display:grid;grid-template-columns:1fr auto;margin:9px 0}.card input{grid-column:1/-1;width:100%}.legend{display:flex;gap:9px;flex-wrap:wrap}.legend b{padding:5px 9px;border-radius:999px}.yellow{background:#ffd65a;color:#271f00}.blue{background:#6bd7ff;color:#082131}.brown{background:#9b613d}
</style></head><body>
<header class="head"><div><h1>🏗️ 滑車・ロープを引く実験</h1><p>青い持ち手を指で下へ引こう。ロープを支える本数で、荷物の動きと必要な力が変わる。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="legend"><b class="yellow">黄＝ロープ</b><b class="blue">青＝あなたの手</b><b class="brown">茶＝持ち上げる荷物</b></div>
<div class="tools"><button data-strands="1">1本：固定滑車</button><button data-strands="2" class="on">2本：動滑車</button><button data-strands="4">4本：組合せ滑車</button></div>
<section class="stage"><canvas id="canvas" width="900" height="600" aria-label="ロープを直接引いて荷物を上げる滑車"></canvas><div class="prompt" id="prompt">👇 青い持ち手を下へドラッグ</div></section>
<div class="metrics"><span>必要な力 <b id="force">—</b></span><span>手の移動 <b id="handMove">0 cm</b></span><span>荷物の上昇 <b id="loadMove">0 cm</b></span><span id="result">まず引いてみよう</span></div>
<details class="card"><summary><b>🔬 もっとためす：重さ・摩擦・ロープ本数</b></summary><label>荷物の重さ <output id="massOut"></output><input id="mass" type="range" min="10" max="100" value="50"></label><label>滑車の摩擦 <output id="frictionOut"></output><input id="friction" type="range" min="0" max="40" value="10"></label><p><b>機械的有利</b>とは、必要な力を何分の1にできるか。力が小さくなる代わりに、手は荷物より長い距離を動きます。</p></details>
<script>
(()=>{
'use strict';const cv=document.getElementById('canvas'),c=cv.getContext('2d');let strands=2,drag=false,hand=245,startHand=245;
const mass=document.getElementById('mass'),friction=document.getElementById('friction');
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*cv.width,y:(e.clientY-r.top)/r.height*cv.height}}
function reset(){hand=245;startHand=245;drag=false;draw();update()}
function update(){const hm=Math.max(0,hand-startHand),lm=hm/strands,need=Number(mass.value)*9.8/strands*(1+Number(friction.value)/100);document.getElementById('force').textContent=Math.round(need)+' N';document.getElementById('handMove').textContent=Math.round(hm*.45)+' cm';document.getElementById('loadMove').textContent=Math.round(lm*.45)+' cm';document.getElementById('result').textContent=hm<8?'まず引いてみよう':strands===1?'向きを変えたが、力の大きさは同じ':`${strands}本で支えるので力は約1/${strands}、手は${strands}倍動く`;document.getElementById('massOut').textContent=mass.value+' kg';document.getElementById('frictionOut').textContent=friction.value+'%'}
function pulley(x,y,r,moving=false){c.fillStyle=moving?'#5f7689':'#344d63';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.strokeStyle='#dce9ef';c.lineWidth=5;c.stroke();c.fillStyle='#172533';c.beginPath();c.arc(x,y,8,0,7);c.fill()}
function rope(points){c.strokeStyle='#ffd65a';c.lineWidth=9;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.strokeStyle='#6b5318';c.lineWidth=2;c.stroke()}
function arrow(x1,y1,x2,y2,color,text){const a=Math.atan2(y2-y1,x2-x1);c.strokeStyle=c.fillStyle=color;c.lineWidth=7;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-18*Math.cos(a-.5),y2-18*Math.sin(a-.5));c.lineTo(x2-18*Math.cos(a+.5),y2-18*Math.sin(a+.5));c.fill();c.font='bold 19px system-ui';c.fillText(text,x1+10,(y1+y2)/2)}
function draw(){const hm=Math.max(0,hand-startHand),loadY=440-hm/strands;c.fillStyle='#b9ddf2';c.fillRect(0,0,900,600);c.fillStyle='#476477';c.fillRect(90,35,720,25);c.fillStyle='#71838a';c.fillRect(0,535,900,65);c.fillStyle='#4d8c42';for(let x=0;x<900;x+=28)c.fillRect(x,525,18,18);
 if(strands===1){pulley(450,135,48);rope([[300,55],[300,loadY],[450,loadY],[450,183],[700,183],[700,hand]]);c.strokeStyle='#ffd65a';c.lineWidth=9;c.beginPath();c.moveTo(300,55);c.lineTo(300,loadY);c.stroke()}
 else{const movableY=loadY-36;pulley(450,movableY,45,true);pulley(650,135,45);if(strands===2)rope([[340,55],[340,movableY],[450,movableY+45],[560,movableY],[560,180],[650,180],[650,hand]]);else{pulley(350,135,38);pulley(550,135,38);pulley(380,movableY,36,true);pulley(520,movableY,36,true);rope([[270,55],[270,movableY],[380,movableY+36],[410,movableY],[410,173],[350,173],[350,movableY],[520,movableY+36],[580,movableY],[580,173],[550,173],[550,hand]])}}
 c.fillStyle='#8d5638';c.fillRect(350,loadY,200,95);c.fillStyle='#d79b62';c.fillRect(365,loadY+15,170,65);c.fillStyle='#392719';c.font='bold 24px system-ui';c.textAlign='center';c.fillText(mass.value+' kg',450,loadY+58);c.textAlign='left';c.fillStyle='#62d6ff';c.beginPath();c.arc(strands===1?700:strands===2?650:550,hand,24,0,7);c.fill();arrow(790,hand-45,790,hand+45,'#197db0','手で引く');arrow(120,loadY+75,120,loadY+10,'#2d8b4e','荷物が上がる');}
cv.addEventListener('pointerdown',e=>{const p=pos(e),hx=strands===1?700:strands===2?650:550;if(Math.hypot(p.x-hx,p.y-hand)<70){drag=true;cv.setPointerCapture(e.pointerId);document.getElementById('prompt').hidden=true}});
cv.addEventListener('pointermove',e=>{if(!drag)return;hand=Math.max(200,Math.min(500,pos(e).y));draw();update()});cv.addEventListener('pointerup',()=>drag=false);
document.querySelectorAll('[data-strands]').forEach(b=>b.onclick=()=>{strands=Number(b.dataset.strands);document.querySelectorAll('[data-strands]').forEach(x=>x.classList.toggle('on',x===b));reset()});[mass,friction].forEach(x=>x.oninput=()=>{update();draw()});document.getElementById('resetBtn').onclick=reset;reset();
})();
</script><script src="lab4wonder_v1_1.js" defer></script></body></html>
