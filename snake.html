<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゆびでスネーク</title>
<link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0 auto;max-width:900px;padding:12px 12px 100px;background:#071522;color:#eff9f1;font-family:system-ui,"Yu Gothic",sans-serif}.head,.tools,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}p{line-height:1.65}.stage{position:relative;margin-top:10px;border:2px solid #466b57;border-radius:20px;overflow:hidden;background:#102719;box-shadow:0 15px 40px #0007}.stage canvas{display:block;width:100%;height:auto;touch-action:none}.hint{position:absolute;inset:12px auto auto 50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:#071522dd;font-weight:900;pointer-events:none}.tools{margin:10px 0}.tools button{min-height:48px;padding:8px 14px;border:1px solid #50715e;border-radius:14px;background:#193528;color:#fff;font-weight:900}.tools button.on{background:#ffd75f;color:#2d2300}.stats>span{padding:7px 10px;border-radius:999px;background:#152c20}.card{margin-top:10px;padding:12px;border:1px solid #3d5f4b;border-radius:16px;background:#102318}.directions{display:grid;grid-template-columns:repeat(3,60px);justify-content:center;gap:6px}.directions button{height:56px;border-radius:14px;border:1px solid #557864;background:#1a3b2a;color:#fff;font-size:1.5rem}.directions .up{grid-column:2}.directions .left{grid-column:1}.directions .down{grid-column:2}.directions .right{grid-column:3}.flash{animation:flash .32s ease}@keyframes flash{50%{filter:brightness(1.9)}}@media(max-width:560px){.head{align-items:flex-start}.hint{font-size:.82rem;white-space:nowrap}}
</style>
</head>
<body>
<header class="head"><div><h1>🐍 ゆびでスネーク</h1><p>行きたい方向をタップかスワイプ。くだものを食べて、ながいヘビを育てよう。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="stats"><span>🍎 <b id="score">0</b></span><span>最長 <b id="best">0</b></span><span id="status">画面をタップして出発！</span></div>
<section class="stage" id="stage"><canvas id="game" width="800" height="560" aria-label="自分で操作するスネークゲーム"></canvas><div class="hint" id="hint">👆 行きたい方向をタップ</div></section>
<div class="tools"><button id="fruitBtn" class="on">🍎 くだもの</button><button id="rockBtn">🪨 いわを置く</button><button id="slowBtn">🐢 ゆっくり</button></div>
<div class="directions" aria-label="方向ボタン"><button class="up" data-dir="0,-1">↑</button><button class="left" data-dir="-1,0">←</button><button class="down" data-dir="0,1">↓</button><button class="right" data-dir="1,0">→</button></div>
<details class="card"><summary><b>🔬 もっとためす：速さと作戦</b></summary><p>長くなるほど、自分の体にぶつかりやすくなります。「ゆっくり」を切り替えて、同じ盤面で曲がるタイミングを比べてみよう。いわは画面をタップした場所に置けます。</p><label>速さ <input id="speed" type="range" min="90" max="260" value="150" step="10"></label></details>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),cols=20,rows=14;
let snake,dir,nextDir,fruit,rocks,score,running,ended,lastStep=0,tool='fruit',touchStart=null;
const key='lab4wonder_snake_best';
function best(){try{return Number(localStorage.getItem(key)||0)}catch(_){return 0}}
function saveBest(){try{localStorage.setItem(key,String(Math.max(best(),score)))}catch(_){}}
function emptyCell(){for(let tries=0;tries<500;tries++){const p={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};if(!snake.some(s=>s.x===p.x&&s.y===p.y)&&!rocks.some(r=>r.x===p.x&&r.y===p.y))return p}return{x:1,y:1}}
function reset(){snake=[{x:7,y:7},{x:6,y:7},{x:5,y:7}];dir={x:1,y:0};nextDir={...dir};rocks=[{x:13,y:4},{x:14,y:4},{x:4,y:10}];fruit=emptyCell();score=0;running=false;ended=false;lastStep=0;update();draw()}
function setDir(x,y){if(ended)return reset();if(x===-dir.x&&y===-dir.y)return;nextDir={x,y};running=true;document.getElementById('hint').hidden=true}
function step(){dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const hit=head.x<0||head.y<0||head.x>=cols||head.y>=rows||snake.some(p=>p.x===head.x&&p.y===head.y)||rocks.some(p=>p.x===head.x&&p.y===head.y);if(hit){ended=true;running=false;saveBest();document.getElementById('status').textContent='ぶつかった！ タップですぐ再挑戦';canvas.classList.add('flash');setTimeout(()=>canvas.classList.remove('flash'),350);update();return}snake.unshift(head);if(head.x===fruit.x&&head.y===fruit.y){score++;fruit=emptyCell();document.getElementById('status').textContent='やった！ 1つ長くなった'}else snake.pop();update()}
function update(){document.getElementById('score').textContent=score;document.getElementById('best').textContent=Math.max(best(),score)}
function cellFromEvent(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(cols-1,Math.floor((e.clientX-r.left)/r.width*cols))),y:Math.max(0,Math.min(rows-1,Math.floor((e.clientY-r.top)/r.height*rows)))}}
function chooseByTap(p){const h=snake[0],dx=p.x-h.x,dy=p.y-h.y;if(Math.abs(dx)>Math.abs(dy))setDir(Math.sign(dx),0);else if(dy)setDir(0,Math.sign(dy))}
canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{const p=cellFromEvent(e);if(tool==='rock'){if(!snake.some(s=>s.x===p.x&&s.y===p.y)){const i=rocks.findIndex(r=>r.x===p.x&&r.y===p.y);i>=0?rocks.splice(i,1):rocks.push(p);draw()}return}const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.hypot(dx,dy)>24){Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy))}else chooseByTap(p)});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const [x,y]=b.dataset.dir.split(',').map(Number);setDir(x,y)});
document.getElementById('resetBtn').onclick=reset;document.getElementById('fruitBtn').onclick=()=>setTool('fruit');document.getElementById('rockBtn').onclick=()=>setTool('rock');
function setTool(t){tool=t;document.getElementById('fruitBtn').classList.toggle('on',t==='fruit');document.getElementById('rockBtn').classList.toggle('on',t==='rock');document.getElementById('hint').textContent=t==='rock'?'👆 タップでいわを置く・消す':'👆 行きたい方向をタップ';document.getElementById('hint').hidden=false}
document.getElementById('slowBtn').onclick=e=>{e.currentTarget.classList.toggle('on')};
function draw(){const w=canvas.width/cols,h=canvas.height/rows;ctx.fillStyle='#102719';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#244532';ctx.lineWidth=1;for(let x=0;x<=cols;x++){ctx.beginPath();ctx.moveTo(x*w,0);ctx.lineTo(x*w,canvas.height);ctx.stroke()}for(let y=0;y<=rows;y++){ctx.beginPath();ctx.moveTo(0,y*h);ctx.lineTo(canvas.width,y*h);ctx.stroke()}ctx.font=`${h*.72}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍎',(fruit.x+.5)*w,(fruit.y+.52)*h);rocks.forEach(p=>ctx.fillText('🪨',(p.x+.5)*w,(p.y+.52)*h));snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#dbff71':`hsl(${115-i*1.8} 65% ${48-Math.min(18,i*.6)}%)`;roundRect(p.x*w+3,p.y*h+3,w-6,h-6,Math.min(w,h)*.32);ctx.fill();if(i===0){ctx.fillStyle='#102719';const ex=dir.x*.15*w,ey=dir.y*.15*h;ctx.beginPath();ctx.arc((p.x+.5)*w+ex-dir.y*7,(p.y+.5)*h+ey+dir.x*7,3.5,0,7);ctx.arc((p.x+.5)*w+ex+dir.y*7,(p.y+.5)*h+ey-dir.x*7,3.5,0,7);ctx.fill()}})}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function loop(t){const base=Number(document.getElementById('speed').value),delay=document.getElementById('slowBtn').classList.contains('on')?base*1.8:base;if(running&&!ended&&t-lastStep>delay){step();lastStep=t}draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
})();
</script>
<script src="lab4wonder_v1_1.js" defer></script>
</body>
</html>
