<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自分で数独</title><link rel="stylesheet" href="lab4wonder_v1_1.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{max-width:850px;margin:auto;padding:12px 12px 100px;background:#081522;color:#eef6ff;font-family:system-ui,"Yu Gothic",sans-serif}
.head,.bar,.stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.head{justify-content:space-between}.head h1{margin:0;font-size:clamp(1.3rem,4vw,2rem)}p{line-height:1.65}
.bar button,.head button{min-height:46px;border:1px solid #46617c;border-radius:13px;background:#172c40;color:#fff;padding:8px 13px;font-weight:900}
.bar button.on{background:#ffd65a;color:#241d00}
.stats span{background:#13283b;padding:7px 10px;border-radius:999px}
.message{min-height:48px;padding:10px;border:1px solid #35536e;border-radius:13px;background:#10263a;font-weight:800;margin-top:10px}
.board{display:grid;margin:12px auto;width:min(94vw,64vh,600px);aspect-ratio:1;border:4px solid #38536c;border-radius:14px;overflow:hidden;background:#f2f7fb;touch-action:manipulation}
.cell{padding:0;margin:0;border:1px solid #a8bccb;border-radius:0;background:#f2f7fb;color:#1668c0;font-size:clamp(.95rem,4vw,1.8rem);font-weight:900;min-width:0;min-height:0;line-height:1;overflow:hidden}
.cell.blkL{border-left:3px solid #38536c}.cell.blkT{border-top:3px solid #38536c}
.cell.given{background:#cfdfeb;color:#12293c}
.cell.peer{background:#e2edf5}.cell.given.peer{background:#c2d5e4}
.cell.sel{box-shadow:inset 0 0 0 4px #ffb43a;background:#fff2cf}
.cell.bad{background:#f5c9c2;color:#a02c20}
.cell.bad.sel{box-shadow:inset 0 0 0 4px #ffb43a}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:min(94vw,64vh,600px);margin:10px auto}
.pad button{min-height:56px;border:1px solid #46617c;border-radius:13px;background:#172c40;color:#fff;font-size:1.35rem;font-weight:900;touch-action:manipulation}
.pad button.erase{font-size:1rem;background:#3a2f4b;border-color:#5c4f73}
.card{margin-top:10px;padding:12px;border:1px solid #35536e;border-radius:15px;background:#102235}
#winBanner{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#04101dcc;padding:20px}
#winBanner[hidden]{display:none}
.winBox{background:#11304a;border:2px solid #ffd65a;border-radius:22px;padding:26px 30px;text-align:center;max-width:420px;animation:pop .5s ease}
.winBox h2{margin:0 0 8px;font-size:1.7rem}.winBox p{margin:0 0 14px}
.winBox button{min-height:52px;border:none;border-radius:14px;background:#ffd65a;color:#241d00;padding:10px 18px;font-weight:900;font-size:1.05rem}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1)}}
#party{position:fixed;inset:0;z-index:55;pointer-events:none;overflow:hidden}
#party span{position:absolute;bottom:-50px;font-size:2rem;animation:rise 2s ease-out forwards}
@keyframes rise{to{transform:translateY(-108vh) rotate(320deg);opacity:0}}
@media(prefers-reduced-motion:reduce){#party{display:none}.winBox{animation:none}}
</style></head>
<body>
<header class="head"><div><h1>🔢 自分で数独</h1><p>たての列、よこの行、ふとい線のブロックに、おなじ数字は1こずつ。ますをえらんで、自分の手で数字を入れよう。</p></div><button id="resetBtn">↺ はじめから</button></header>
<div class="stats"><span>のこり <b id="left">0</b> ます</span><span>💡 つかったヒント <b id="hintsUsed">0</b></span><span>🏆 クリア <b id="cleared">0</b></span></div>
<div class="bar"><button id="miniBtn">🐣 ミニ 4×4</button><button id="easyBtn" class="on">🌱 やさしい</button><button id="normalBtn">🌼 ふつう</button><button id="hardBtn">🌋 むずかしい</button><button id="newBtn">🎲 あたらしい問題</button><button id="hintBtn">💡 1マスだけヒント</button></div>
<div id="message" class="message">すきなますをタップしてから、下の数字ボタンをおしてね。</div>
<div id="board" class="board" role="grid" aria-label="自分でとく数独の盤面"></div>
<div id="pad" class="pad" aria-label="数字を入れるボタン"></div>
<details class="card"><summary><b>🔬 こまったときのコツ</b></summary><p>こい色のますは、さいしょから決まっている数字なので動かせません。まちがえても大丈夫。おなじ数字がぶつかると、そのますが赤くなって教えてくれます。まずは「ここには1つの数字しか入らない」というますをさがしてみよう。どうしてもわからないときだけ、ヒントボタンを1回おしてみてね。</p></details>
<div id="winBanner" hidden><div class="winBox" role="dialog" aria-label="完成のお祝い"><h2>🎉 かんせい！</h2><p id="winText">ぜんぶの数字がそろったよ。すごい！</p><button id="winNext">🎲 つぎの問題へ</button></div></div>
<div id="party" aria-hidden="true"></div>
<script>
(()=>{
'use strict';
const LEVELS={
 mini:{size:4,br:2,bc:2,clues:7,name:'ミニ 4×4'},
 easy:{size:9,br:3,bc:3,clues:40,name:'やさしい'},
 normal:{size:9,br:3,bc:3,clues:32,name:'ふつう'},
 hard:{size:9,br:3,bc:3,clues:26,name:'むずかしい'}
};
const boardEl=document.getElementById('board'),padEl=document.getElementById('pad'),msgEl=document.getElementById('message');
let level='easy',size=9,br=3,bc=3,solution=[],puzzle=[],grid=[],given=[],sel=-1,hintsUsed=0,cleared=0,done=false;

function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function boxOf(i,n,h,w){return Math.floor(Math.floor(i/n)/h)*h+Math.floor((i%n)/w)}

// Fill an empty grid with a random complete solution by backtracking.
function makeSolved(n,h,w){
 const g=new Array(n*n).fill(0),rows=new Array(n).fill(0),cols=new Array(n).fill(0),boxes=new Array(n).fill(0);
 const digits=[...Array(n).keys()].map(v=>v+1);
 function fill(i){
  if(i===n*n)return true;
  const r=Math.floor(i/n),c=i%n,b=boxOf(i,n,h,w),used=rows[r]|cols[c]|boxes[b];
  for(const v of shuffled(digits.slice())){
   const bit=1<<v;
   if(used&bit)continue;
   g[i]=v;rows[r]|=bit;cols[c]|=bit;boxes[b]|=bit;
   if(fill(i+1))return true;
   g[i]=0;rows[r]^=bit;cols[c]^=bit;boxes[b]^=bit;
  }
  return false;
 }
 if(!fill(0))throw new Error('solved grid generation failed');
 return g;
}

// Count solutions up to "limit" with a fewest-candidates-first backtracking solver.
function countSolutions(p,n,h,w,limit){
 const rows=new Array(n).fill(0),cols=new Array(n).fill(0),boxes=new Array(n).fill(0),g=p.slice(),empties=[];
 for(let i=0;i<n*n;i++){
  const v=g[i];
  if(!v){empties.push(i);continue}
  const bit=1<<v,r=Math.floor(i/n),c=i%n,b=boxOf(i,n,h,w);
  if((rows[r]|cols[c]|boxes[b])&bit)return 0;
  rows[r]|=bit;cols[c]|=bit;boxes[b]|=bit;
 }
 let count=0;
 function walk(){
  if(count>=limit)return;
  let best=-1,bestMask=0,bestN=n+1;
  for(const i of empties){
   if(g[i])continue;
   const r=Math.floor(i/n),c=i%n,b=boxOf(i,n,h,w);
   let mask=0,cnt=0;
   for(let v=1;v<=n;v++){const bit=1<<v;if(!((rows[r]|cols[c]|boxes[b])&bit)){mask|=bit;cnt++}}
   if(cnt===0)return;
   if(cnt<bestN){bestN=cnt;best=i;bestMask=mask;if(cnt===1)break}
  }
  if(best<0){count++;return}
  const r=Math.floor(best/n),c=best%n,b=boxOf(best,n,h,w);
  for(let v=1;v<=n;v++){
   const bit=1<<v;
   if(!(bestMask&bit))continue;
   g[best]=v;rows[r]|=bit;cols[c]|=bit;boxes[b]|=bit;
   walk();
   g[best]=0;rows[r]^=bit;cols[c]^=bit;boxes[b]^=bit;
   if(count>=limit)return;
  }
 }
 walk();
 return count;
}

// Remove clues one by one, keeping every removal that leaves exactly one solution.
function digPuzzle(sol,n,h,w,targetClues){
 const p=sol.slice();
 let clues=n*n;
 for(const i of shuffled([...Array(n*n).keys()])){
  if(clues<=targetClues)break;
  const kept=p[i];
  p[i]=0;
  if(countSolutions(p,n,h,w,2)!==1)p[i]=kept;else clues--;
 }
 return p;
}

function newPuzzle(){
 const cfg=LEVELS[level];
 size=cfg.size;br=cfg.br;bc=cfg.bc;
 solution=makeSolved(size,br,bc);
 puzzle=digPuzzle(solution,size,br,bc,cfg.clues);
 grid=puzzle.slice();
 given=puzzle.map(v=>v>0);
 sel=-1;done=false;
 document.getElementById('winBanner').hidden=true;
 say(`${cfg.name}の問題だよ。ますをえらんで数字を入れてね。`);
 buildPad();render();
}

function restart(){
 grid=puzzle.slice();sel=-1;done=false;
 document.getElementById('winBanner').hidden=true;
 say('この問題をさいしょからやりなおすよ。');
 render();
}

function say(t){msgEl.textContent=t}

function conflicts(){
 const bad=new Set();
 const groups=[];
 for(let r=0;r<size;r++)groups.push([...Array(size).keys()].map(c=>r*size+c));
 for(let c=0;c<size;c++)groups.push([...Array(size).keys()].map(r=>r*size+c));
 for(let b=0;b<size;b++){
  const r0=Math.floor(b/(size/br))*br,c0=(b%(size/bc))*bc,ids=[];
  for(let r=r0;r<r0+br;r++)for(let c=c0;c<c0+bc;c++)ids.push(r*size+c);
  groups.push(ids);
 }
 for(const ids of groups){
  const seen=new Map();
  for(const i of ids){
   const v=grid[i];
   if(!v)continue;
   if(seen.has(v)){bad.add(i);bad.add(seen.get(v))}else seen.set(v,i);
  }
 }
 return bad;
}

function peersOf(i){
 const out=new Set();
 if(i<0)return out;
 const r=Math.floor(i/size),c=i%size,r0=Math.floor(r/br)*br,c0=Math.floor(c/bc)*bc;
 for(let k=0;k<size;k++){out.add(r*size+k);out.add(k*size+c)}
 for(let y=r0;y<r0+br;y++)for(let x=c0;x<c0+bc;x++)out.add(y*size+x);
 out.delete(i);
 return out;
}

function render(){
 boardEl.innerHTML='';
 boardEl.style.gridTemplateColumns=`repeat(${size},1fr)`;
 boardEl.style.gridTemplateRows=`repeat(${size},1fr)`;
 const bad=conflicts(),peers=peersOf(sel);
 grid.forEach((v,i)=>{
  const r=Math.floor(i/size),c=i%size;
  const b=document.createElement('button');
  let cls='cell';
  if(c%bc===0&&c>0)cls+=' blkL';
  if(r%br===0&&r>0)cls+=' blkT';
  if(given[i])cls+=' given';
  if(peers.has(i))cls+=' peer';
  if(!given[i]&&v&&bad.has(i))cls+=' bad';
  if(i===sel)cls+=' sel';
  b.className=cls;
  b.setAttribute('role','gridcell');
  b.setAttribute('aria-label',`${r+1}行${c+1}列 ${v?(given[i]?'さいしょからの数字':'入れた数字')+v:'あきます'}`);
  b.textContent=v||'';
  b.addEventListener('click',()=>selectCell(i));
  boardEl.appendChild(b);
 });
 document.getElementById('left').textContent=grid.filter(v=>!v).length;
 document.getElementById('hintsUsed').textContent=hintsUsed;
 document.getElementById('cleared').textContent=cleared;
}

function selectCell(i){
 if(done)return;
 sel=i;
 if(given[i])say('このますは、さいしょから決まっている数字だよ。ほかのますをえらんでね。');
 render();
}

function enter(v){
 if(done)return;
 if(sel<0){say('先に、数字を入れたいますをタップしてえらんでね。');return}
 if(given[sel]){say('このますは、さいしょから決まっている数字だよ。ほかのますをえらんでね。');return}
 grid[sel]=v;
 if(v===0)say('けしたよ。もういちど考えてみよう。');
 else{
  const bad=conflicts();
  if(bad.has(sel))say('あれれ、おなじ数字がたて・よこ・ブロックのどこかにあるよ。赤いますを見てなおそう。');
  else say(`${v} を入れたよ。つぎのますへ！`);
 }
 render();
 checkComplete();
}

function checkComplete(){
 if(grid.some(v=>!v)||conflicts().size>0)return;
 done=true;cleared++;sel=-1;
 say('🎉 かんせい！ ぜんぶの数字がそろったよ。');
 document.getElementById('winText').textContent=hintsUsed?`ヒントを ${hintsUsed} 回つかって、みごとにかんせい！`:'ヒントなしで、ぜんぶ自分でといたよ。すごい！';
 document.getElementById('winBanner').hidden=false;
 throwParty();
 render();
}

function throwParty(){
 const party=document.getElementById('party');
 party.innerHTML='';
 const icons=['🎉','⭐','🎈','✨','🌟'];
 for(let k=0;k<24;k++){
  const s=document.createElement('span');
  s.textContent=icons[k%icons.length];
  s.style.left=Math.random()*96+'%';
  s.style.animationDelay=(Math.random()*.7)+'s';
  party.appendChild(s);
 }
 setTimeout(()=>{party.innerHTML=''},3200);
}

function hint(){
 if(done){say('もうかんせいしているよ。あたらしい問題であそぼう！');return}
 let target=-1;
 if(sel>=0&&!given[sel]&&grid[sel]!==solution[sel])target=sel;
 else{
  const open=shuffled([...Array(size*size).keys()].filter(i=>!given[i]&&grid[i]!==solution[i]));
  if(open.length)target=open[0];
 }
 if(target<0){say('あいているますはもうないよ。あとすこし！');return}
 grid[target]=solution[target];
 sel=target;hintsUsed++;
 say(`💡 このますには ${solution[target]} が入るよ。りゆうも考えてみよう。`);
 render();
 checkComplete();
}

function setLevel(key){
 level=key;
 ['mini','easy','normal','hard'].forEach(k=>document.getElementById(k+'Btn').classList.toggle('on',k===key));
 newPuzzle();
}

function buildPad(){
 padEl.innerHTML='';
 for(let v=1;v<=size;v++){
  const b=document.createElement('button');
  b.textContent=v;
  b.setAttribute('aria-label',`数字の${v}を入れる`);
  b.addEventListener('click',()=>enter(v));
  padEl.appendChild(b);
 }
 const e=document.createElement('button');
 e.className='erase';e.textContent='🧽 けす';
 e.setAttribute('aria-label','えらんだますの数字をけす');
 e.addEventListener('click',()=>enter(0));
 padEl.appendChild(e);
}

document.getElementById('miniBtn').addEventListener('click',()=>setLevel('mini'));
document.getElementById('easyBtn').addEventListener('click',()=>setLevel('easy'));
document.getElementById('normalBtn').addEventListener('click',()=>setLevel('normal'));
document.getElementById('hardBtn').addEventListener('click',()=>setLevel('hard'));
document.getElementById('newBtn').addEventListener('click',newPuzzle);
document.getElementById('hintBtn').addEventListener('click',hint);
document.getElementById('resetBtn').addEventListener('click',restart);
document.getElementById('winNext').addEventListener('click',newPuzzle);
document.getElementById('winBanner').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.hidden=true});

document.addEventListener('keydown',e=>{
 if(e.target.closest('input,select,textarea'))return;
 if(/^[1-9]$/.test(e.key)&&Number(e.key)<=size){enter(Number(e.key));return}
 if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){enter(0);return}
 const dir={ArrowUp:-size,ArrowDown:size,ArrowLeft:-1,ArrowRight:1}[e.key];
 if(dir!==undefined){
  e.preventDefault();
  const next=sel<0?0:Math.max(0,Math.min(size*size-1,sel+dir));
  sel=next;render();
 }
});

window.__sudokuTest={
 state:()=>({level,size,puzzle:puzzle.slice(),solution:solution.slice(),grid:grid.slice(),given:given.slice(),sel,done})
};

newPuzzle();
})();
</script>
<script src="lab4wonder_v1_1.js" defer></script>
</body></html>
